<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GMAO Ligne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" />
    <style>
      :root {
        --bg: #f4f5f5;
        --panel: #ffffff;
        --panel2: #f7f8f7;
        --text: #333333;
        --muted: #65706f;
        --line: #dcdfdd;
        --accent: #157c79;
        --accent-text: #fff;
        --brand: #157c79;
        --brand-ink: #c3b48c;
        --brand-ink-soft: #e3dcc6;
        --sand: #9a8a5c;
        --sand-soft: #f0ebdc;
        --ok: #2b7a50;
        --warn: #e07b00;
        --crit: #b3362c;
        --none: #a2aaa8;
        --ok-bg: #dcefe3;
        --warn-bg: #fbecd6;
        --crit-bg: #f7dfdb;
        --none-bg: #eceeed;
        --metal: #cfd5d3;
        --metal2: #9aa5a3;
        --metal-dark: #5a6866;
        --draw-bg: #fbfcfb;
        --shadow: none;
        --font: "Roboto", Arial, system-ui, sans-serif;
        --font-data: "Roboto Mono", ui-monospace, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1c1c;
          --panel: #132927;
          --panel2: #17322f;
          --text: #e9e9e6;
          --muted: #a2b1ae;
          --line: #284845;
          --accent: #3fa9a5;
          --accent-text: #0d1c1c;
          --brand: #11605d;
          --sand: #c3b48c;
          --sand-soft: #38321f;
          --ok: #5cc28a;
          --warn: #f0a446;
          --crit: #ef6b5b;
          --ok-bg: #173325;
          --warn-bg: #3a2a12;
          --crit-bg: #42201d;
          --none-bg: #1f3a37;
          --none: #6f807d;
          --metal: #2f4f4c;
          --metal2: #4d6966;
          --metal-dark: #8fa3a0;
          --draw-bg: #10221f;
          --shadow: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1c1c;
        --panel: #132927;
        --panel2: #17322f;
        --text: #e9e9e6;
        --muted: #a2b1ae;
        --line: #284845;
        --accent: #3fa9a5;
        --accent-text: #0d1c1c;
        --brand: #11605d;
        --sand: #c3b48c;
        --sand-soft: #38321f;
        --ok: #5cc28a;
        --warn: #f0a446;
        --crit: #ef6b5b;
        --ok-bg: #173325;
        --warn-bg: #3a2a12;
        --crit-bg: #42201d;
        --none-bg: #1f3a37;
        --none: #6f807d;
        --metal: #2f4f4c;
        --metal2: #4d6966;
        --metal-dark: #8fa3a0;
        --draw-bg: #10221f;
        --shadow: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--accent);
      }
      header.top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header.top h1 {
        font-size: 17px;
        margin: 0;
        white-space: nowrap;
      }
      header.top .src {
        font-size: 12px;
        color: var(--muted);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      header.top .src b.dirty {
        color: var(--warn);
      }
      header.top .sp {
        flex: 1;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 6px 12px;
        border-radius: 7px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.pri {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .btn.danger {
        color: var(--crit);
        border-color: var(--crit);
      }
      .btn.sm {
        padding: 3px 8px;
        font-size: 12.5px;
      }
      .layout {
        display: grid;
        grid-template-columns: 250px 1fr;
        min-height: calc(100vh - 52px);
      }
      nav.side {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      nav.side .grp {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 12px 8px 4px;
      }
      nav.side a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 7px;
        text-decoration: none;
        color: var(--text);
      }
      nav.side a:hover {
        background: var(--panel2);
      }
      nav.side a.on {
        background: var(--panel2);
        font-weight: 600;
        box-shadow: inset 3px 0 0 var(--accent);
      }
      nav.side a .cnt b {
        display: inline-block;
        min-width: 18px;
        padding: 0 5px;
        border-radius: 99px;
        color: #fff;
        font-size: 11px;
        text-align: center;
        margin-left: 3px;
      }
      .split .draw svg {
        max-height: 380px;
      }
      nav.side a .cnt {
        white-space: nowrap;
        display: flex;
        margin-left: auto;
        font-size: 11.5px;
        color: var(--muted);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        background: var(--none);
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      .dot.crit {
        background: var(--crit);
      }
      main {
        padding: 18px 20px;
        min-width: 0;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .tile {
        padding: 12px 14px;
      }
      .tile .k {
        font-size: 12px;
        color: var(--muted);
      }
      .tile .v {
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .tile.ok .v {
        color: var(--ok);
      }
      .tile.warn .v {
        color: var(--warn);
      }
      .tile.crit .v {
        color: var(--crit);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
      }
      .eqcard {
        padding: 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 4px solid var(--none);
      }
      .eqcard.ok {
        border-top-color: var(--ok);
      }
      .eqcard.warn {
        border-top-color: var(--warn);
      }
      .eqcard.crit {
        border-top-color: var(--crit);
      }
      .eqcard:hover {
        border-color: var(--accent);
      }
      .eqcard .hd {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .eqcard .hd b {
        flex: 1;
      }
      .eqcard .meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .draw {
        background: var(--draw-bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
      }
      .draw svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .badge.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .badge.crit {
        background: var(--crit-bg);
        color: var(--crit);
      }
      .badge.none {
        background: var(--none-bg);
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 99px;
        font-size: 12px;
        background: var(--panel);
        cursor: pointer;
      }
      .alerts {
        padding: 12px 14px;
        margin-bottom: 16px;
      }
      .alerts h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .alerts .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }
      .alerts .row:first-of-type {
        border-top: 0;
      }
      .alerts .row .n {
        flex: 1;
        min-width: 0;
      }
      .alerts .row .n small {
        color: var(--muted);
        display: block;
      }
      .muted {
        color: var(--muted);
      }
      .eqhead {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .eqhead .t {
        flex: 1;
        min-width: 220px;
      }
      .counters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .counter {
        padding: 8px 14px;
        min-width: 140px;
      }
      .counter .k {
        font-size: 12px;
        color: var(--muted);
      }
      .counter .v {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .tablewrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        background: var(--panel2);
        white-space: nowrap;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      tr.sel td {
        background: var(--panel2);
      }
      tr.click {
        cursor: pointer;
      }
      .bar {
        position: relative;
        height: 9px;
        background: var(--none-bg);
        border-radius: 99px;
        min-width: 110px;
        overflow: visible;
      }
      .bar i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 99px;
        background: var(--ok);
      }
      .bar.warn i {
        background: var(--warn);
      }
      .bar.crit i {
        background: var(--crit);
      }
      .bar b {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        background: var(--warn);
        border-radius: 1px;
      }
      .bar-l {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .empty {
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }
      .inline-in {
        width: 100px;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        text-align: right;
      }
      select.inline-in {
        text-align: left;
        width: auto;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        align-items: center;
      }
      .toolbar input[type="search"] {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        min-width: 220px;
      }

      /* Dessins : les organes prennent la couleur de leur état */
      svg .part {
        cursor: pointer;
        --c: var(--none);
      }
      svg .part.st-ok {
        --c: var(--ok);
      }
      svg .part.st-warn {
        --c: var(--warn);
      }
      svg .part.st-crit {
        --c: var(--crit);
      }
      svg .part:hover {
        filter: brightness(1.12) drop-shadow(0 0 3px var(--c));
      }
      svg .part.hl {
        filter: drop-shadow(0 0 5px var(--c));
      }
      svg .f {
        fill: var(--c);
        stroke: rgba(0, 0, 0, 0.35);
        stroke-width: 1.2;
      }
      svg .s {
        fill: none;
        stroke: var(--c);
        stroke-width: 6;
        stroke-linecap: round;
      }
      svg .o {
        fill: none;
        stroke: rgba(255, 255, 255, 0.75);
        stroke-width: 2;
      }
      svg .hl2 {
        fill: rgba(255, 255, 255, 0.28);
      }
      svg .n {
        fill: var(--metal);
        stroke: var(--metal2);
        stroke-width: 1.2;
      }
      svg .nd {
        fill: var(--metal-dark);
      }
      svg .pipe {
        fill: none;
        stroke: var(--metal2);
        stroke-width: 7;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      svg .ln {
        fill: none;
        stroke: var(--metal2);
        stroke-width: 1.5;
      }
      svg text {
        fill: var(--muted);
        font:
          600 10px system-ui,
          sans-serif;
        pointer-events: none;
      }
      svg text.on {
        fill: #fff;
        font-size: 10px;
      }
      @keyframes blink {
        50% {
          opacity: 0.55;
        }
      }
      svg .part.st-crit .f,
      svg .part.st-crit .s {
        animation: blink 1.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        svg .part.st-crit .f,
        svg .part.st-crit .s {
          animation: none;
        }
      }

      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0;
        background: var(--panel);
        color: var(--text);
        width: min(560px, calc(100vw - 32px));
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      dialog::backdrop {
        background: rgba(10, 15, 25, 0.45);
      }
      dialog .mh {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      dialog .mh h3 {
        margin: 0;
        font-size: 16px;
        flex: 1;
      }
      dialog .mb {
        padding: 16px 18px;
        max-height: 65vh;
        overflow: auto;
      }
      dialog .mf {
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      dialog .mf .left {
        margin-right: auto;
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .form .full {
        grid-column: 1/-1;
      }
      .form label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .form input,
      .form select,
      .form textarea {
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
      }
      .form .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .form fieldset {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .form fieldset legend {
        font-size: 12px;
        color: var(--muted);
        padding: 0 4px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg label {
        flex-direction: row;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        cursor: pointer;
        color: var(--text);
        font-size: 13px;
      }
      .seg label:has(input:checked) {
        background: var(--accent);
        color: var(--accent-text);
      }
      .seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 14px;
        margin-bottom: 12px;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 9px 16px;
        border-radius: 8px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 50;
      }
      .toast.show {
        opacity: 1;
      }
      .menu-btn {
        display: none;
      }

      @media (max-width: 1500px) {
        .split {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        nav.side {
          display: none;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        nav.side.open {
          display: flex;
        }
        .menu-btn {
          display: inline-block;
        }
        .split {
          grid-template-columns: 1fr;
        }
        .tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        main {
          padding: 14px 16px;
        }
        header.top {
          padding: 10px 16px;
        }
        .form {
          grid-template-columns: 1fr;
        }
        .form fieldset {
          grid-template-columns: 1fr;
        }
      }
      @media print {
        header.top,
        nav.side,
        .noprint {
          display: none !important;
        }
        .layout {
          display: block;
        }
      }

      /* ===== Charte Riva : bandeau sarcelle, titres sable, Roboto, angles droits ===== */
      body { font: 14px/1.5 var(--font); }
      .btn, .card, .chip, .badge, .draw, .bar, .bar i, .seg, dialog, .inline-in,
      .form input, .form select, .form textarea, .form fieldset, .toast,
      nav.side a, .toolbar input[type="search"], .eqcard { border-radius: 0 !important; }
      header.top {
        background: var(--brand); color: var(--brand-ink); border-bottom: 0;
        padding: 14px 20px 24px; clip-path: polygon(0 0, 100% 0, 100% 72%, 0 100%);
      }
      header.top h1 { font-weight: 300; font-size: 24px; letter-spacing: .01em; color: var(--brand-ink); }
      header.top h1 span { font-weight: 500; }
      header.top .src { color: var(--brand-ink-soft); }
      header.top .src b.dirty { color: #ffd38a; }
      header.top .btn { background: transparent; color: var(--brand-ink); border-color: var(--brand-ink); }
      header.top .btn:hover { background: var(--brand-ink); color: var(--brand); }
      header.top .btn.pri { background: var(--brand-ink); color: var(--brand); border-color: var(--brand-ink); font-weight: 500; }
      header.top .btn.pri:hover { background: #fff; }
      .layout { min-height: calc(100vh - 64px); }
      nav.side { background: var(--panel); }
      nav.side .grp { color: var(--sand); font-weight: 600; letter-spacing: .1em; }
      nav.side a.on { color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
      h2 { font-weight: 300; font-size: 26px; color: var(--accent); }
      .alerts h3, dialog .mh h3 { font-weight: 500; }
      .alerts h3, th, .tile .k, .counter .k, .form label, .form fieldset legend {
        text-transform: uppercase; letter-spacing: .07em; font-size: 11.5px;
      }
      .alerts h3 { color: var(--accent); }
      .tile .v, .counter .v, td.num, .bar + .bar-l { font-family: var(--font-data); font-weight: 500; }
      .tile { border-top: 3px solid var(--line); }
      .tile.ok { border-top-color: var(--ok); } .tile.warn { border-top-color: var(--warn); } .tile.crit { border-top-color: var(--crit); }

          return Math.max(0, prodTonnes(eq, (o.ref || {}).date || "", orgDiams(eq, o)) + (+o.tonnesInit || 0));
        return Math.max(
          0,
          (+eq.compteurs[o.mode] || 0) - (+(o.ref || {})[o.mode] || 0),
        );
      }
      /* ---------- arrêts techniques ----------
         Un organe « aux arrêts » se remplace tous les N arrêts techniques. Les arrêts comptés sont
         ceux passés (date <= aujourd'hui) après la date de son dernier remplacement. */
      const joursAvant = (date) => Math.round((new Date(date + "T12:00:00") - new Date(today() + "T12:00:00")) / 864e5);
      const arretsTries = () => [...db.arrets].sort((a, b) => a.date.localeCompare(b.date));
      function arretsInfo(o) {
        const ref = (o.ref && o.ref.date) || "", td = today(), all = arretsTries();
        const done = all.filter((a) => a.date > ref && a.date <= td).length;
        const fut = all.filter((a) => a.date > td);
        const N = Math.max(1, Math.round(+o.seuilRemplacement || 1));
        const k = N - done; // nombre d'arrêts restant avant le remplacement
        return { done, N, k, due: k > 0 ? fut[k - 1] || null : null };
      }
      function status(eq, o) {
        if (o.mode === "arrets") {
          const a = arretsInfo(o);
          if (a.done >= a.N) return "crit";
          if (a.k === 1 && a.due && joursAvant(a.due.date) <= db.arretsVigilanceJours) return "warn";
          return "ok";
        }
        const u = usage(eq, o),
          v = +o.seuilVigilance,
          r = +o.seuilRemplacement;
        if (!(r > 0)) return "none";
        if (u >= r) return "crit";
        if (v > 0 && u >= v) return "warn";
        return "ok";
      }
      function eqStatus(eq) {
        let s = "none";
        for (const o of eq.organes) {
          const x = status(eq, o);
          if (RANK[x] > RANK[s]) s = x;
        }
        return s;
      }
      function counts(list) {
        const c = { ok: 0, warn: 0, crit: 0, none: 0 };
        list.forEach(([e, o]) => c[status(e, o)]++);
        return c;
      }
      function allOrg() {
        const r = [];
        db.equipements.forEach((e) => e.organes.forEach((o) => r.push([e, o])));
        return r;
      }

      /* ---------- base production (tonnages AS400 par diamètre) ----------
         La base (ex. base_production_laminoir.json) contient des « rapports » journaliers
         (dateDebut, laminoir, lignes[{diam, tonnes}]). On en garde un résumé jour × diamètre. */
      let PROD = null;
      let prodEtat = { st: "off", msg: "" }; // off | ok | reconnect | erreur
      let prodFileMod = 0;
      const PROD_CACHE = "gmao-prod-cache";
      const idb = {
        _p: null,
        open() {
          return (this._p = this._p || new Promise((res, rej) => {
            const r = indexedDB.open("gmao-ligne", 1);
            r.onupgradeneeded = () => r.result.createObjectStore("kv");
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
          }));
        },
        async run(mode, fn) {
          const d = await this.open();
          return new Promise((res, rej) => {
            const t = d.transaction("kv", mode), q = fn(t.objectStore("kv"));
            t.oncomplete = () => res(q && q.result);
            t.onerror = () => rej(t.error);
          });
        },
        get(k) { return this.run("readonly", (st) => st.get(k)).catch(() => null); },
        set(k, v) { return this.run("readwrite", (st) => st.put(v, k)); },
        del(k) { return this.run("readwrite", (st) => st.delete(k)).catch(() => null); },
      };
      const prodCfg = () => db.production;
      const prodActive = () => !!(db.production && db.production.actif && PROD);
      const eqDiams = (eq) => (Array.isArray(eq.diametres) ? eq.diametres : []);
      const diamTxt = (eq) => (eqDiams(eq).length ? "Ø " + eqDiams(eq).join(", ") : "tous diamètres");
      function aggregateProd(json, source, modif) {
        if (!json || !Array.isArray(json.rapports))
          throw new Error("Ce fichier n'est pas une base production : la clé « rapports » est absente.");
        const jours = [], diams = new Set(), lams = new Set();
        json.rapports.forEach((r) => {
          const date = String(r.dateDebut || "").slice(0, 10);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
          const d = {};
          (r.lignes || []).forEach((l) => {
            const k = Number(l.diam);
            const t = l.tonnes != null ? +l.tonnes : (+l.kgMaj || +l.kgFard || 0) / 1000;
            if (!(k > 0) || !isFinite(t)) return;
            d[k] = (d[k] || 0) + t;
            diams.add(k);
          });
          const lam = String(r.laminoir || "");
          if (lam) lams.add(lam);
          jours.push({ date, lam, d });
        });
        jours.sort((a, b) => a.date.localeCompare(b.date));
        return { jours, diams: [...diams].sort((a, b) => a - b), lams: [...lams].sort(), debut: jours.length ? jours[0].date : "",
          fin: jours.length ? jours[jours.length - 1].date : "", nb: json.rapports.length, source, modif, lu: new Date().toISOString() };
      }
      // tonnes produites dans les diamètres de l'équipement (tous si aucun), à partir de la date « from » incluse
      function prodTonnes(eq, from, dsOverride) {
        if (!PROD) return 0;
        const ds = dsOverride || eqDiams(eq), lam = prodCfg().laminoir;
        let s = 0;
        for (const j of PROD.jours) {
          if ((from && j.date < from) || (lam && j.lam !== lam)) continue;
          if (ds.length) for (const k of ds) s += j.d[k] || 0;
          else for (const k in j.d) s += j.d[k];
        }
        return s;
      }
      // un organe peut avoir ses propres diamètres (ex. moteur d'une cage) ; sinon il prend ceux de l'équipement
      const orgDiams = (eq, o) => (o && Array.isArray(o.diametres) ? o.diametres : eqDiams(eq));
      const orgDiamTxt = (eq, o) => (orgDiams(eq, o).length ? "Ø " + orgDiams(eq, o).join(", ") : "tous diamètres");
      const eqTonnes = (e) => (prodActive() ? prodTonnes(e, "") : +e.compteurs.tonnes || 0);
      function useProdCache() {
        if (PROD) return;
        try {
          const c = JSON.parse(localStorage.getItem(PROD_CACHE) || "null");
          if (c && Array.isArray(c.jours)) { PROD = c; prodEtat.cache = true; }
        } catch (e) {}
      }
      function setProd(json, source, modif) {
        PROD = aggregateProd(json, source, modif);
        try { localStorage.setItem(PROD_CACHE, JSON.stringify(PROD)); } catch (e) {}
        prodEtat = { st: "ok" };
      }
      // lecture de la base : automatique à l'ouverture (interactive = false), ou sur clic (true)
      async function loadProd(interactive) {
        const c = prodCfg();
        if (!c.actif) { prodEtat = { st: "off" }; return; }
        try {
          if (c.mode === "url") {
            if (!c.url) throw new Error("Adresse de la base non renseignée.");
            const r = await fetch(c.url, { cache: "no-store" });
            if (!r.ok) throw new Error("La base ne répond pas (HTTP " + r.status + ").");
            setProd(await r.json(), c.url, r.headers.get("last-modified"));
          } else {
            const h = await idb.get("prodHandle");
            if (!h) throw new Error("Aucun fichier production choisi sur ce poste.");
            let perm = await h.queryPermission({ mode: "read" });
            if (perm !== "granted") {
              if (!interactive) { prodEtat = { st: "reconnect", msg: h.name }; useProdCache(); return; }
              perm = await h.requestPermission({ mode: "read" });
              if (perm !== "granted") throw new Error("Accès au fichier refusé.");
            }
            const f = await h.getFile();
            prodFileMod = f.lastModified;
            setProd(JSON.parse(await f.text()), h.name, new Date(f.lastModified).toISOString());
          }
        } catch (e) {
          prodEtat = { st: "erreur", msg: e.message };
          useProdCache();
        }
      }
      const PROD_TYPES = [{ description: "Base production (JSON)", accept: { "application/json": [".json"] } }];
      async function chooseProdFile() {
        const c = prodCfg();
        if (window.showOpenFilePicker) {
          try {
            const [h] = await showOpenFilePicker({ types: PROD_TYPES });
            await idb.set("prodHandle", h);
            Object.assign(c, { mode: "fichier", fichier: h.name, actif: true });
            PROD = null;
            await loadProd(true);
            commit();
            if (prodEtat.st === "ok") toast("Base production connectée : " + h.name);
          } catch (e) {
            if (e.name !== "AbortError") alert("Connexion impossible : " + e.message);
          }
        } else $("#prodInput").click(); // navigateur sans accès direct : lecture ponctuelle
      }
      async function prodRefresh() {
        await loadProd(true);
        render();
        toast(prodEtat.st === "ok" ? "Base production rechargée" : "Production : " + (prodEtat.msg || "indisponible"));
      }
      function renderProdChip() {
        $("#btnReleveLigne").hidden = prodActive();
        const b = $("#prodChip"), c = db.production;
        if (!c || !c.actif) { b.hidden = true; return; }
        b.hidden = false;
        b.classList.toggle("warn", prodEtat.st !== "ok");
        if (prodEtat.st === "ok") { b.textContent = "🏭 Prod. " + fdate(PROD.fin); b.title = PROD.source + " — lue le " + new Date(PROD.lu).toLocaleString("fr-FR"); }
        else if (prodEtat.st === "reconnect") { b.textContent = "🏭 Reconnecter la production"; b.title = "Cliquez pour autoriser la lecture de " + prodEtat.msg; }
        else { b.textContent = "⚠ Production" + (PROD ? " (données du " + fdate(PROD.fin) + ")" : " indisponible"); b.title = prodEtat.msg || ""; }
      }
      // revenir sur l'onglet relit la base si elle a changé
      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState !== "visible" || !db || !db.production.actif || prodEtat.st !== "ok") return;
        if (db.production.mode === "fichier") {
          const h = await idb.get("prodHandle");
          try { if (!h || (await h.getFile()).lastModified === prodFileMod) return; } catch (e) { return; }
        }
        await loadProd(false);
        render();
      });

      /* ---------- persistance ---------- */
      /* Conversion d'une base créée avec l'ancien modèle (v1) :
         TRO-0 : galets -> galet supérieur + galet inférieur, vérin -> un vérin de chaque côté.
         Soudeuse : bagues acier / téflon dédoublées par vérin offsetting, ajout des 4 galets porteurs. */
      function migrateV2(d) {
        const today_ = new Date().toISOString().slice(0, 10);
        const clone = (o, suffix, slot, nom) =>
          Object.assign(JSON.parse(JSON.stringify(o)), { id: o.id + suffix, slot, nom });
        const split = (e, from, slotA, nomA, slotB, nomB, oldNom) => {
          const o = e.organes.find((x) => x.slot === from);
          if (!o) return;
          const i = e.organes.indexOf(o);
          o.slot = slotA;
          if (!oldNom || o.nom === oldNom) o.nom = nomA;
          e.organes.splice(i + 1, 0, clone(o, "-" + slotB, slotB, nomB));
        };
        d.equipements.forEach((e) => {
          let changed = false;
          if (e.type === "tro0" && e.organes.some((o) => o.slot === "galet" || o.slot === "verin")) {
            split(e, "galet", "galet_sup", "Galet supérieur", "galet_inf", "Galet inférieur", "Galets");
            split(e, "verin", "verin_1", "Vérin pneumatique côté piste", "verin_2", "Vérin pneumatique côté moteur", "Vérin pneumatique");
            changed = true;
          }
          if (e.type === "soudeuse") {
            if (e.organes.some((o) => o.slot === "bague_acier" || o.slot === "bague_teflon")) {
              split(e, "bague_acier", "bague_acier_sup", "Bagues acier – offsetting sup.", "bague_acier_inf", "Bagues acier – offsetting inf.");
              split(e, "bague_teflon", "bague_teflon_sup", "Bagues téflon – offsetting sup.", "bague_teflon_inf", "Bagues téflon – offsetting inf.");
              changed = true;
            }
            if (!e.organes.some((o) => /^galet_a[vr]\d$/.test(o.slot))) {
              [["galet_av1", "Galet porteur avant 1 (côté piste)"], ["galet_av2", "Galet porteur avant 2 (côté piste)"],
               ["galet_ar1", "Galet porteur arrière 1 (côté moteur)"], ["galet_ar2", "Galet porteur arrière 2 (côté moteur)"]].forEach(([slot, nom]) =>
                e.organes.push({ id: e.id + "-" + slot, nom, slot, mode: "heures", seuilVigilance: 9000, seuilRemplacement: 10000,
                  ref: { date: today_, heures: +e.compteurs.heures || 0, tonnes: +e.compteurs.tonnes || 0 } }));
              changed = true;
            }
          }
          if (changed) {
            d.journal.push({ id: "j-" + Math.random().toString(36).slice(2, 8), ts: new Date().toISOString(), type: "config", date: today_,
              eqId: e.id, eqNom: e.nom, commentaire: "Conversion automatique au nouveau modèle (organes dédoublés / ajoutés)",
              heures: e.compteurs.heures, tonnes: e.compteurs.tonnes });
            d._migrated = true;
          }
        });
        d.schema = 2;
      }
      // v3 : rails et crémaillère de la soudeuse
      function migrateV3(d) {
        const today_ = new Date().toISOString().slice(0, 10);
        d.equipements.forEach((e) => {
          if (e.type !== "soudeuse" || e.organes.some((o) => o.slot === "rail_piste" || o.slot === "cremaillere")) return;
          const ref = { date: today_, heures: +e.compteurs.heures || 0, tonnes: +e.compteurs.tonnes || 0 };
          [["rail_piste", "Rail côté piste", 45000, 50000], ["rail_moteur", "Rail côté moteur", 45000, 50000],
           ["cremaillere", "Crémaillère (rail côté moteur)", 27000, 30000]].forEach(([slot, nom, v, r]) =>
            e.organes.push({ id: e.id + "-" + slot, nom, slot, mode: "heures", seuilVigilance: v, seuilRemplacement: r, ref: Object.assign({}, ref) }));
          d.journal.push({ id: "j-" + Math.random().toString(36).slice(2, 8), ts: new Date().toISOString(), type: "config", date: today_,
            eqId: e.id, eqNom: e.nom, commentaire: "Ajout des rails et de la crémaillère (suivi démarré à zéro)",
            heures: e.compteurs.heures, tonnes: e.compteurs.tonnes });
          d._migrated = true;
        });
        d.schema = 3;
      }
      const TRO_ENTRAINEMENT = [
        ["allonge_sup", "Allonge galet supérieur", 850000, 1000000],
        ["allonge_inf", "Allonge galet inférieur", 850000, 1000000],
        ["reducteur", "Réducteur", 1530000, 1700000],
        ["moteur", "Moteur", 1530000, 1700000],
      ];
      const CENTRALE_TYPE = [
        ["filtre", "Filtre", 153000, 170000],
        ["pompe_1", "Pompe 1", 1530000, 1700000],
        ["pompe_2", "Pompe 2", 1530000, 1700000],
        ["vidange", "Vidange centrale", 382500, 425000],
      ];
      const NOUVELLES_CENTRALES = [
        ["ch-soudeuse", "Centrale soudeuse", "Soudeuse"],
        ["ch-h1-6", "Centrale hydraulique 1 à 6", "Train"],
        ["ch-lub1-6", "Centrale lubrif 1 à 6", "Train"],
        ["ch-lub7-10", "Centrale lubrif 7 à 10", "Train"],
        ["ch-lub11-14", "Centrale lubrif 11 à 14", "Train"],
        ["ch-lub15-16", "Centrale lubrif 15-16", "Train"],
        ["ch-cv4fq", "Centrale CV4 + FQ", "Cisailles"],
        ["ch-cv1", "Centrale CV1", "Cisailles"],

      const CISAILLE_ORGANES = [
        ["moteur", "Moteur", 1530000, 1700000],
        ["courroie", "Courroie", 255000, 300000],
        ["ev_frein", "EV frein", 510000, 600000],
        ["ev_embrayage", "EV embrayage", 510000, 600000],
      ];
      const CURSEUR_CENTRALE = [
        ["filtre", "Filtre", 153000, 170000],
        ["pompe_1", "Pompe 1", 1530000, 1700000],
        ["pompe_2", "Pompe 2", 1530000, 1700000],
        ["vidange", "Vidange centrale", 382500, 425000],
      ];
      const CURSEUR_ORGANES = [
        ["verin_separateur", "Vérin séparateur", 595000, 680000],
        ["verin_deviateur", "Vérin déviateur", 595000, 680000],
        ["verin_pneu", "Vérin pneumatique curseur", 595000, 680000],
        ["verin_hydro", "Vérin hydraulique curseur", 595000, 680000],
      ];
      const DEFO_ORGANES = [
        ["galet_sup", "Galet supérieur", 2700, 3000],
        ["galet_inf", "Galet inférieur", 2700, 3000],
        ["verin_1", "Vérin pneumatique côté piste", 7000, 8000],

        ["moteur_inf", "Moteur hydraulique galet inférieur", 18000, 20000],
      ];
      // v4 : centrale Nortek
      function nortekOrganes(prefix, used) {
        return [
          ["cuve", "Cuve de centrale (vidange / nettoyage)", 7000, 8000],
          ["pompe_1", "Pompe de fonctionnement 1", 18000, 20000],
          ["pompe_2", "Pompe de fonctionnement 2", 18000, 20000],

          ["ev_retour", "EV retour bâche", 9000, 10000],
        ].map(([slot, nom, v, r]) => ({ id: prefix + "-" + slot, nom, slot, mode: "heures", seuilVigilance: v, seuilRemplacement: r, ref: used(slot) }));
      }
      function migrateV4(d) {
        if (!d.equipements.some((e) => e.type === "nortek")) {
          const today_ = new Date().toISOString().slice(0, 10);
          const src = d.equipements.find((e) => e.type === "hydraulique") || d.equipements[0];
          const c = src ? { heures: +src.compteurs.heures || 0, tonnes: +src.compteurs.tonnes || 0 } : { heures: 0, tonnes: 0 };
          const e = { id: "nortek", nom: "Centrale Nortek", zone: src ? src.zone || "" : "", type: "nortek",
            compteurs: { heures: c.heures, tonnes: c.tonnes, date: today_ },
            organes: nortekOrganes("nk", () => ({ date: today_, heures: c.heures, tonnes: c.tonnes })) };
          const i = src ? d.equipements.indexOf(src) + 1 : d.equipements.length;
          d.equipements.splice(i, 0, e);
          d.journal.push({ id: "j-" + Math.random().toString(36).slice(2, 8), ts: new Date().toISOString(), type: "config", date: today_,
            eqId: e.id, eqNom: e.nom, commentaire: "Création de la centrale Nortek (suivi démarré à zéro)", heures: c.heures, tonnes: c.tonnes });
          d._migrated = true;
        }
        d.schema = 4;
      }
      function normalize(d) {
        if (!d || !Array.isArray(d.equipements))
          throw new Error(
            "Fichier invalide : la clé « equipements » est absente.",
          );
        d.version = d.version || 1;
        d.journal = Array.isArray(d.journal) ? d.journal : [];
        d.arrets = (Array.isArray(d.arrets) ? d.arrets : []).filter((a) => a && /^\d{4}-\d{2}-\d{2}$/.test(a.date));
        d.arrets.forEach((a) => (a.id = a.id || uid("at")));
        d.arretsVigilanceJours = +d.arretsVigilanceJours > 0 ? +d.arretsVigilanceJours : 30;
        d.production = Object.assign({ actif: false, mode: "fichier", url: "", fichier: "", laminoir: "" }, d.production);
        d.equipements.forEach((e) => {
          e.id = e.id || uid("eq");
          e.type = TYPES[e.type] ? e.type : "generique";
          e.compteurs = Object.assign(
            { heures: 0, tonnes: 0, date: "" },
            e.compteurs,
          );
          e.organes = Array.isArray(e.organes) ? e.organes : [];
          e.options = e.options && typeof e.options === "object" ? e.options : {};
          e.diametres = Array.isArray(e.diametres) ? e.diametres.map(Number).filter((x) => x > 0) : [];
          e.organes.forEach((o) => {
            o.id = o.id || uid("org");
            o.mode = ["tonnes", "arrets"].includes(o.mode) ? o.mode : "heures";

        });
        if ((d.schema || 1) < 2) migrateV2(d);
        if (d.schema < 3) migrateV3(d);
        if (d.schema < 4) migrateV4(d);
        if (d.schema < 5) {
          // v5 : la voie rouleaux enfournement est motorisée (paliers + motoréducteur)
          d.equipements.forEach((e) => {
            if (e.type === "rouleaux" && (e.id === "vr-enf" || /enfourn/i.test(e.nom))) e.options = Object.assign({}, e.options, { motorise: true });
          });
          d.schema = 5;
        }
        if (d.schema < 6) {
          // v6 : défourneuse = galet sup. + galet inf., 2 vérins pneumatiques, 1 moteur hydraulique par galet
          const today_ = new Date().toISOString().slice(0, 10);
          d.equipements.forEach((e) => {
            if (e.type !== "defourneuse" || e.organes.some((o) => o.slot === "galet_sup")) return;
            const ref = { date: today_, heures: +e.compteurs.heures || 0, tonnes: +e.compteurs.tonnes || 0 };
            DEFO_ORGANES.forEach(([slot, nom, v, r]) =>
              e.organes.push({ id: e.id + "-" + slot, nom, slot, mode: "heures", seuilVigilance: v, seuilRemplacement: r, ref: Object.assign({}, ref) }));
            d.journal.push({ id: "j-" + Math.random().toString(36).slice(2, 8), ts: new Date().toISOString(), type: "config", date: today_,
              eqId: e.id, eqNom: e.nom, commentaire: "Ajout des organes de la défourneuse (suivi démarré à zéro)", heures: e.compteurs.heures, tonnes: e.compteurs.tonnes });
            d._migrated = true;
          });
          d.schema = 6;
        }
        if (d.schema < 7) {
          // v7 : centrale hydraulique enfournement = 3 pompes
          const today_ = new Date().toISOString().slice(0, 10);
          d.equipements.forEach((e) => {
            if (e.type !== "hydraulique" || e.organes.some((o) => o.slot === "pompe_2")) return;
            const old = e.organes.find((o) => o.slot === "pompe");

      function viewEquip(e) {
        const rows = e.organes
          .map((o) => {

            return `<tr class="click${o.id === selOrg ? " sel" : ""}" data-org="${o.id}">
      <td><b>${esc(o.nom)}</b><div class="bar-l">${esc(TYPES[e.type].slots[o.slot] || "Hors dessin")}</div></td>
      <td>${badge(s)}<div class="bar-l">${remainTxt(e, o)}</div></td>

    <div class="counters">

        ? `<div class="card counter" title="Tonnes produites dans la base production (${diamTxt(e)})"><div class="k">Tonnage produit · ${diamTxt(e)}</div><div class="v">${fmt(prodTonnes(e, ""))} t</div></div>`

  <div class="toolbar noprint">

  </div>
  <div class="split">
    <div class="card" style="padding:10px">${drawing(e)}${legend}
      ${(DRAW_EXTRA[e.type] || []).map((v) => `<h3 style="margin:16px 4px 8px;font-size:14px;color:var(--accent)">${esc(v.titre)}</h3><div class="draw-extra">${drawing(e, false, v.fn)}</div>`).join("")}</div>
    <div class="card tablewrap">${
      e.organes.length
        ? `<table><thead><tr><th>Organe</th><th>État</th><th>Usure depuis remplacement</th>
      <th class="num">Critère</th><th class="num">Dernier rempl.</th><th class="noprint"></th></tr></thead><tbody>${rows}</tbody></table>`
        : '<div class="empty">Aucun organe suivi sur cet équipement.<br><br><button class="btn pri" data-act="addorg">＋ Ajouter un organe</button></div>'
    }</div>
  </div>${e.type === "cages" || e.type === "tempcore" ? viewCagesDiam(e) : ""}`;
      }
      // diamètres travaillés par chaque cage : le moteur de la cage compte les tonnes de ces diamètres
      function viewCagesDiam(e) {
        const cage = e.type === "cages";
        const ds = [...new Set([...(PROD ? PROD.diams : []), ...e.organes.flatMap((o) => o.diametres || [])])].sort((a, b) => a - b);
        return `<div class="card tablewrap" style="margin-top:14px">
    <div style="padding:12px 14px 0"><h3 style="margin:0;font-size:14px">${cage ? "Diamètres travaillés par cage" : "Diamètres par organe"}</h3>
      <p class="hint" style="font-size:12.5px;color:var(--muted);margin:4px 0 8px">${cage
        ? "Cochez les diamètres dans lesquels chaque cage travaille. Le moteur de la cage compte les tonnes produites dans ces diamètres (base production). Sans case cochée, la cage compte <b>tous</b> les diamètres."
        : "Chaque organe ne compte que les tonnes produites dans les diamètres cochés (base production). Sans case cochée, il compte <b>tous</b> les diamètres."}</p></div>
    ${ds.length ? `<table id="tCages"><thead><tr><th>${cage ? "Cage" : "Organe"}</th>${ds.map((k) => `<th class="num">Ø ${k}</th>`).join("")}<th class="num">Tonnes comptées (base)</th><th>${cage ? "État moteur" : "État"}</th></tr></thead><tbody>
      ${e.organes.map((o) => `<tr data-org="${o.id}"><td><b>${esc(cage ? o.nom.replace(/^Moteur /, "").replace(/^cage/, "Cage") : o.nom)}</b><div class="bar-l">${orgDiamTxt(e, o)}</div></td>
        ${ds.map((k) => `<td class="num"><input type="checkbox" data-cd="${k}"${(o.diametres || []).includes(k) ? " checked" : ""} aria-label="${esc(o.nom)} Ø ${k}"></td>`).join("")}
        <td class="num">${PROD ? fmt(prodTonnes(e, "", orgDiams(e, o))) + " t" : "—"}</td><td>${badge(status(e, o))}</td></tr>`).join("")}
    </tbody></table>` : '<div class="empty">Connectez la base production (onglet 🏭 Production) pour cocher les diamètres de chaque cage.</div>'}
  </div>`;
      }

      function viewSeuils() {
        return `<h2>Seuils</h2><p class="sub">Pour chaque organe : remplacement à la tonne (seuils de vigilance et de remplacement) ou aux arrêts techniques (tous les N arrêts). Les modifications sont appliquées immédiatement.</p>
  <div class="toolbar"><input type="search" id="fSeuil" placeholder="Filtrer (équipement, organe)…"></div>
  <div class="card tablewrap"><table id="tSeuils"><thead><tr><th>Équipement</th><th>Organe</th><th>Remplacement</th>
    <th class="num">Seuil vigilance (t)</th><th class="num">Remplacement (t ou nb d'arrêts)</th><th class="num">Usure actuelle</th><th>État</th></tr></thead><tbody>
  ${allOrg()
    .map(
      ([
        e,
        o,
      ]) => `<tr data-eq="${e.id}" data-org="${o.id}" data-q="${esc((e.nom + " " + o.nom).toLowerCase())}">
    <td>${esc(e.nom)}</td><td>${esc(o.nom)}</td>
    <td><select class="inline-in" data-f="mode"><option value="tonnes"${o.mode !== "arrets" ? " selected" : ""}>À la tonne</option><option value="arrets"${o.mode === "arrets" ? " selected" : ""}>Aux arrêts techniques</option></select></td>
    <td class="num">${o.mode === "arrets" ? '<span class="muted">—</span>' : `<input class="inline-in" type="number" min="0" step="any" data-f="seuilVigilance" value="${o.seuilVigilance}">`}</td>
    <td class="num"><input class="inline-in" type="number" min="0" step="any" data-f="seuilRemplacement" value="${o.seuilRemplacement}"></td>
    <td class="num" data-u>${fmt(usage(e, o))} ${UNIT[o.mode]}</td><td data-s>${badge(status(e, o))}</td></tr>`,
    )
    .join("")}
  </tbody></table></div>`;
      }

      function viewJournal() {
        const j = [...db.journal].sort((a, b) =>
          (b.date + b.ts).localeCompare(a.date + a.ts),
        );
        const T = {
          remplacement: "🔁 Remplacement",
          releve: "⏱ Relevé",
          config: "⚙️ Paramétrage",
        };
        return `<h2>Journal</h2><p class="sub">Historique des interventions et relevés (${j.length}).</p>
  <div class="toolbar"><input type="search" id="fJour" placeholder="Filtrer…"><button class="btn" id="csv">⬇ Export CSV</button></div>
  <div class="card tablewrap">${
    j.length
      ? `<table id="tJour"><thead><tr><th>Date</th><th>Type</th><th>Équipement</th><th>Organe</th><th>Intervenant</th>
    <th class="num">Tonnage</th><th class="num">Usure au rempl.</th><th>Commentaire</th></tr></thead><tbody>
    ${j
      .map(
        (
          x,
        ) => `<tr data-q="${esc([x.eqNom, x.orgNom, x.intervenant, x.commentaire, x.type].join(" ").toLowerCase())}">
      <td class="num">${fdate(x.date)}</td><td>${T[x.type] || esc(x.type)}</td><td>${esc(x.eqNom)}</td><td>${esc(x.orgNom || "")}</td>
      <td>${esc(x.intervenant || "")}</td><td class="num">${fmt(x.tonnes)} t</td>
      <td class="num">${x.usage != null ? fmt(x.usage) + " " + (UNIT[x.mode] || "") : ""}</td><td>${esc(x.commentaire || "")}</td></tr>`,
      )
      .join("")}
    </tbody></table>`
      : '<div class="empty">Aucune entrée pour le moment.</div>'
  }</div>`;
      }

      function bindMain() {
        const m = $("#main"),
          r = route();
        m.querySelectorAll("[data-goeq]").forEach(
          (el) =>
            (el.onclick = () => {
              if (el.dataset.org && el.classList.contains("row")) {
                go("eq=" + el.dataset.goeq);
                setTimeout(
                  () => ficheOrgane(findEq(el.dataset.goeq), el.dataset.org),
                  30,
                );
              } else go("eq=" + el.dataset.goeq);
            }),
        );
        if (r.page === "eq") {
          const e = findEq(r.id);
          if (!e) return;
          m.querySelectorAll("#tCages input[data-cd]").forEach((x) => (x.onchange = () => {
            const o = findOrg(e, x.closest("tr").dataset.org), k = +x.dataset.cd;
            const cur = Array.isArray(o.diametres) ? o.diametres : [];
            o.diametres = x.checked ? [...new Set([...cur, k])].sort((a, b) => a - b) : cur.filter((d) => d !== k);
            commit();
          }));
          m.querySelectorAll(".draw, .chip[data-org]").forEach(
            (el) =>
              (el.onclick = (ev) => {
                if (v3Dragged) return;
                const t = ev.target.closest("[data-org]");
                if (!t) return;
                ev.stopPropagation();
                ficheOrgane(e, t.dataset.org);
              }),
          );
          m.querySelectorAll("[data-v3]").forEach(
            (b) =>
              (b.onclick = () => {
                const k = b.dataset.v3;
                if (k === "piste") V3.yaw = -30;
                else if (k === "moteur") V3.yaw = 150;
                else V3.yaw += k === "l" ? -30 : 30;
                renderMain();
              }),
          );
          const d3 = m.querySelector(".draw");
          if (d3 && DRAW3D[e.type]) {
            let x0 = null, y0 = 0, yaw0 = 0, p0 = 0;
            d3.onpointerdown = (ev) => { x0 = ev.clientX; y0 = ev.clientY; yaw0 = V3.yaw; p0 = V3.pitch; v3Dragged = false; };
            d3.onpointermove = (ev) => {
              if (x0 === null) return;
              const dx = ev.clientX - x0, dy = ev.clientY - y0;
              if (!v3Dragged && Math.hypot(dx, dy) < 5) return;
              if (!v3Dragged) { v3Dragged = true; try { d3.setPointerCapture(ev.pointerId); } catch (er) {} }
              V3.yaw = yaw0 + dx * 0.5;
              V3.pitch = Math.max(5, Math.min(70, p0 + dy * 0.3));
              d3.querySelector("svg").outerHTML = render3d(e, slotInfo(e).S);
            };
            d3.onpointerup = d3.onpointercancel = () => { x0 = null; setTimeout(() => (v3Dragged = false), 0); };
          }
          m.querySelectorAll("table:not(#tCages) tr[data-org]").forEach(
            (el) => (el.onclick = () => ficheOrgane(e, el.dataset.org)),
          );
          m.querySelectorAll("[data-act]").forEach(
            (el) =>
              (el.onclick = (ev) => {
                ev.stopPropagation();
                const o = findOrg(e, el.dataset.org);
                ({
                  repl: () => remplacement(e, o),
                  edit: () => editOrgane(e, o),
                  releve: () => releve(e),
                  addorg: () => editOrgane(e, null),
                  editeq: () => editEquip(e),
                })[el.dataset.act]();
              }),
          );
        }
        if (r.page === "centrales") {
          m.querySelectorAll(".draw[data-eq]").forEach((d) => (d.onclick = (ev) => {
            const t = ev.target.closest("[data-org]");
            if (t) ficheOrgane(findEq(d.dataset.eq), t.dataset.org);
          }));
        }
        if (r.page === "arrets") {
          $("#atForm").onsubmit = (ev) => {
            ev.preventDefault();
            const fd = new FormData(ev.target);
            db.arrets.push({ id: uid("at"), date: fd.get("date"), fin: fd.get("fin") || "", libelle: fd.get("libelle").trim() });
            log({ type: "config", date: today(), eqNom: "Arrêts techniques", commentaire: "Arrêt technique planifié le " + fdate(fd.get("date")) });
            commit();
            toast("Arrêt technique ajouté");
          };
          $("#atVig").onchange = (ev) => { db.arretsVigilanceJours = Math.max(1, +ev.target.value || 30); commit(); };
          m.querySelectorAll("[data-at-edit]").forEach((b) => (b.onclick = () => editArret(db.arrets.find((a) => a.id === b.dataset.atEdit))));
          m.querySelectorAll("[data-at-del]").forEach((b) => (b.onclick = () => {
            const a = db.arrets.find((x) => x.id === b.dataset.atDel);
            if (!confirm("Supprimer l'arrêt technique du " + fdate(a.date) + " ?")) return;
            db.arrets = db.arrets.filter((x) => x !== a);
            commit();
          }));
        }
        if (r.page === "production") {
          const c = prodCfg();
          m.querySelectorAll("input[name=pmode]").forEach((x) => (x.onchange = () => { c.mode = x.value; commit(); }));
          const u = $("#pUrl");
          if (u) u.onchange = () => { c.url = u.value.trim(); commit(true); };
          $("#pLam").onchange = (ev) => { c.laminoir = ev.target.value; commit(); };
          $("#pActif").onchange = async (ev) => { c.actif = ev.target.checked; if (c.actif) await loadProd(true); else prodEtat = { st: "off" }; commit(); };
          m.querySelectorAll("[data-p]").forEach((b) => (b.onclick = async () => {
            const k = b.dataset.p;
            if (k === "file") chooseProdFile();
            else if (k === "url") { if (u) c.url = u.value.trim(); c.actif = true; PROD = null; await loadProd(true); commit(); toast(prodEtat.st === "ok" ? "Base production connectée" : "Connexion impossible : " + prodEtat.msg); }
            else prodRefresh();
          }));
          m.querySelectorAll("#tDiam input[data-d]").forEach((x) => (x.onchange = () => {
            const e = findEq(x.closest("tr").dataset.eq), k = +x.dataset.d;
            e.diametres = x.checked ? [...new Set([...eqDiams(e), k])].sort((a, b) => a - b) : eqDiams(e).filter((d) => d !== k);
            commit();
          }));
        }
        if (r.page === "seuils") {
          $("#fSeuil").oninput = (ev) => {
            const q = ev.target.value.toLowerCase();
            m.querySelectorAll("#tSeuils tbody tr").forEach(
              (tr) => (tr.hidden = !tr.dataset.q.includes(q)),
            );
          };
          m.querySelectorAll("#tSeuils [data-f]").forEach(
            (inp) =>
              (inp.onchange = () => {
                const tr = inp.closest("tr"),
                  e = findEq(tr.dataset.eq),
                  o = findOrg(e, tr.dataset.org),
                  f = inp.dataset.f;
                o[f] = f === "mode" ? inp.value : Math.max(0, +inp.value || 0);
                if (f === "mode") {
                  // changement de critère : valeurs par défaut cohérentes
                  if (o.mode === "arrets") { o.seuilRemplacement = 2; o.seuilVigilance = 1; }
                  return commit();
                }
                if (o.mode === "arrets") { o.seuilRemplacement = Math.max(1, Math.round(o.seuilRemplacement)); o.seuilVigilance = o.seuilRemplacement - 1; }
                if (+o.seuilVigilance > +o.seuilRemplacement)
                  toast(
                    "⚠ Le seuil de vigilance est supérieur au seuil de remplacement",
                  );
                tr.querySelector("[data-u]").textContent =
                  fmt(usage(e, o)) + " " + UNIT[o.mode];

          if (ev.submitter && ev.submitter.value === "ok" && onOk) {

              return;

          {

    ${

    }</div>`,

      function releve(e) {
        modal(
          "Tonnage — " + esc(e.nom),
          `<div class="form">

    <label>Relevé par<input name="intervenant" autocomplete="off"></label></div>`,
          {
            ok: "Valider",
            onOk: (fd) => {
              const h = +fd.get("h"),
                t = +fd.get("t");
              if (
                (h < e.compteurs.heures || (!prodActive() && t < e.compteurs.tonnes)) &&
                !confirm(
                  "Une valeur est inférieure au relevé précédent. Confirmer ?",
                )
              )
                return false;
              applyReleve(
                e,
                h,
                t,
                fd.get("date"),
                fd.get("intervenant").trim(),
              );
              commit();
              toast("Relevé enregistré");
            },
          },
        );
      }
      function applyReleve(e, h, t, date, who) {
        if (h === +e.compteurs.heures && t === +e.compteurs.tonnes)
          return false;
        const before = e.organes.map((o) => status(e, o));
        e.compteurs = { heures: h, tonnes: t, date };
        log({
          type: "releve",
          date,
          eqId: e.id,
          eqNom: e.nom,
          intervenant: who,
          heures: h,
          tonnes: t,
        });
        const newly = e.organes.filter(
          (o, i) =>
            RANK[status(e, o)] > RANK[before[i]] && status(e, o) !== "ok",
        );
        if (newly.length)
          setTimeout(
            () =>
              toast(
                "⚠ " +
                  e.nom +
                  " : " +
                  newly
                    .map((o) => o.nom + " → " + STATUS_TXT[status(e, o)])
                    .join(", "),
              ),
            300,
          );
        return true;
      }

      )
      .join("")}

          {
            wide: true,
            ok: "Valider le relevé",
            extra:
              '<button class="btn" data-extra="copy">⇣ Appliquer la 1re ligne à tous</button>',
            onExtra: (k, f) => {
              const [h, t] = [
                f.querySelector("[name^=h_]").value,
                f.querySelector("[name^=t_]").value,
              ];
              f.querySelectorAll("[name^=h_]").forEach((i) => (i.value = h));
              f.querySelectorAll("[name^=t_]").forEach((i) => (i.value = t));
            },
            onOk: (fd) => {
              const down = db.equipements.filter(
                (e) =>
                  +fd.get("h_" + e.id) < e.compteurs.heures ||
                  (!prodActive() && +fd.get("t_" + e.id) < e.compteurs.tonnes),
              );
              if (
                down.length &&
                !confirm(
                  "Valeurs inférieures au relevé précédent pour : " +
                    down.map((e) => e.nom).join(", ") +
                    ". Confirmer ?",
                )
              )
                return false;
              let n = 0;
              db.equipements.forEach((e) => {
                if (
                  applyReleve(
                    e,
                    +fd.get("h_" + e.id),
                    +fd.get("t_" + e.id),
                    fd.get("date"),
                    fd.get("intervenant").trim(),

          Object.assign(prodCfg(), { mode: "fichier", fichier: f.name, actif: true });
          commit();
          toast("Base production chargée (ce navigateur ne permet pas la reconnexion automatique)");
        } catch (e) { alert("Lecture impossible : " + e.message); }
        ev.target.value = "";
      });

      function exportCsv() {
        const cols = [
          "date",
          "type",
          "eqNom",
          "orgNom",
          "intervenant",
          "tonnes",
          "usage",
          "mode",
          "commentaire",
        ];
        const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
        const csv =
          "﻿" +
          cols.join(";") +
          "\n" +
          db.journal.map((j) => cols.map((c) => q(j[c])).join(";")).join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "gmao-journal-" + today() + ".csv";
        a.click();
        URL.revokeObjectURL(a.href);
      }

      /* ---------- démarrage ---------- */
      (async function init() {
        try {
          const s = JSON.parse(localStorage.getItem(LS_KEY) || "null");
          if (s && s.db) {
            db = normalize(s.db);
            fileName = s.fileName || "";
          }
        } catch (e) {}
        if (!db && location.protocol !== "file:") {
          try {
            const r = await fetch("gmao-data.json", { cache: "no-store" });
            if (r.ok) {
              db = normalize(await r.json());
              fileName = "gmao-data.json";
            }
          } catch (e) {}
        }
        if (!db) db = normalize(JSON.parse(JSON.stringify(DEFAULT_DB)));
        if (!afterMigration()) render();
        // connexion automatique à la base production, dans sa dernière version
        if (db.production.actif) {
          await loadProd(false);
          render();
        }
      })();
    </script>
  </body>
</html>
