<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GMAO Ligne</title>
    <style>
      :root {
        --bg: #f3f5f8;
        --panel: #ffffff;
        --panel2: #f8f9fb;
        --text: #1d2430;
        --muted: #667085;
        --line: #dde2ea;
        --accent: #2457c5;
        --accent-text: #fff;
        --ok: #1f9d55;
        --warn: #f08c00;
        --crit: #e03131;
        --none: #a5adba;
        --ok-bg: #e6f6ec;
        --warn-bg: #fff3e0;
        --crit-bg: #fdecec;
        --none-bg: #eef0f3;
        --metal: #c9d0da;
        --metal2: #9aa4b2;
        --metal-dark: #5f6b7a;
        --draw-bg: #fbfcfd;
        --shadow:
          0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #11151b;
          --panel: #1a2029;
          --panel2: #151a22;
          --text: #e6e9ee;
          --muted: #98a2b3;
          --line: #2c3440;
          --accent: #5b8def;
          --ok-bg: #12321f;
          --warn-bg: #3a2a10;
          --crit-bg: #3d1717;
          --none-bg: #252c36;
          --metal: #3b4552;
          --metal2: #56616f;
          --metal-dark: #8a96a6;
          --draw-bg: #161b23;
          --shadow: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #11151b;
        --panel: #1a2029;
        --panel2: #151a22;
        --text: #e6e9ee;
        --muted: #98a2b3;
        --line: #2c3440;
        --accent: #5b8def;
        --ok-bg: #12321f;
        --warn-bg: #3a2a10;
        --crit-bg: #3d1717;
        --none-bg: #252c36;
        --metal: #3b4552;
        --metal2: #56616f;
        --metal-dark: #8a96a6;
        --draw-bg: #161b23;
        --shadow: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--accent);
      }
      header.top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header.top h1 {
        font-size: 17px;
        margin: 0;
        white-space: nowrap;
      }
      header.top .src {
        font-size: 12px;
        color: var(--muted);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      header.top .src b.dirty {
        color: var(--warn);
      }
      header.top .sp {
        flex: 1;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 6px 12px;
        border-radius: 7px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.pri {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .btn.danger {
        color: var(--crit);
        border-color: var(--crit);
      }
      .btn.sm {
        padding: 3px 8px;
        font-size: 12.5px;
      }
      .layout {
        display: grid;
        grid-template-columns: 250px 1fr;
        min-height: calc(100vh - 52px);
      }
      nav.side {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      nav.side .grp {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 12px 8px 4px;
      }
      nav.side a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 7px;
        text-decoration: none;
        color: var(--text);
      }
      nav.side a:hover {
        background: var(--panel2);
      }
      nav.side a.on {
        background: var(--panel2);
        font-weight: 600;
        box-shadow: inset 3px 0 0 var(--accent);
      }
      nav.side a .cnt b {
        display: inline-block;
        min-width: 18px;
        padding: 0 5px;
        border-radius: 99px;
        color: #fff;
        font-size: 11px;
        text-align: center;
        margin-left: 3px;
      }
      .split .draw svg {
        max-height: 380px;
      }
      nav.side a .cnt {
        white-space: nowrap;
        display: flex;
        margin-left: auto;
        font-size: 11.5px;
        color: var(--muted);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        background: var(--none);
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      .dot.crit {
        background: var(--crit);
      }
      main {
        padding: 18px 20px;
        min-width: 0;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .tile {
        padding: 12px 14px;
      }
      .tile .k {
        font-size: 12px;
        color: var(--muted);
      }
      .tile .v {
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .tile.ok .v {
        color: var(--ok);
      }
      .tile.warn .v {
        color: var(--warn);
      }
      .tile.crit .v {
        color: var(--crit);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
      }
      .eqcard {
        padding: 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 4px solid var(--none);
      }
      .eqcard.ok {
        border-top-color: var(--ok);
      }
      .eqcard.warn {
        border-top-color: var(--warn);
      }
      .eqcard.crit {
        border-top-color: var(--crit);
      }
      .eqcard:hover {
        border-color: var(--accent);
      }
      .eqcard .hd {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .eqcard .hd b {
        flex: 1;
      }
      .eqcard .meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .draw {
        background: var(--draw-bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
      }
      .draw svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .badge.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .badge.crit {
        background: var(--crit-bg);
        color: var(--crit);
      }
      .badge.none {
        background: var(--none-bg);
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 99px;
        font-size: 12px;
        background: var(--panel);
        cursor: pointer;
      }
      .alerts {
        padding: 12px 14px;
        margin-bottom: 16px;
      }
      .alerts h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .alerts .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }
      .alerts .row:first-of-type {
        border-top: 0;
      }
      .alerts .row .n {
        flex: 1;
        min-width: 0;
      }
      .alerts .row .n small {
        color: var(--muted);
        display: block;
      }
      .muted {
        color: var(--muted);
      }
      .eqhead {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .eqhead .t {
        flex: 1;
        min-width: 220px;
      }
      .counters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .counter {
        padding: 8px 14px;
        min-width: 140px;
      }
      .counter .k {
        font-size: 12px;
        color: var(--muted);
      }
      .counter .v {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .tablewrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        background: var(--panel2);
        white-space: nowrap;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      tr.sel td {
        background: var(--panel2);
      }
      tr.click {
        cursor: pointer;
      }
      .bar {
        position: relative;
        height: 9px;
        background: var(--none-bg);
        border-radius: 99px;
        min-width: 110px;
        overflow: visible;
      }
      .bar i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 99px;
        background: var(--ok);
      }
      .bar.warn i {
        background: var(--warn);
      }
      .bar.crit i {
        background: var(--crit);
      }
      .bar b {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        background: var(--warn);
        border-radius: 1px;
      }
      .bar-l {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .empty {
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }
      .inline-in {
        width: 100px;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        text-align: right;
      }
      select.inline-in {
        text-align: left;
        width: auto;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        align-items: center;
      }
      .toolbar input[type="search"] {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        min-width: 220px;
      }

      /* Dessins : les organes prennent la couleur de leur état */
      svg .part {
        cursor: pointer;
        --c: var(--none);
      }
      svg .part.st-ok {
        --c: var(--ok);
      }
      svg .part.st-warn {
        --c: var(--warn);
      }
      svg .part.st-crit {
        --c: var(--crit);
      }
      svg .part:hover {
        filter: brightness(1.12) drop-shadow(0 0 3px var(--c));
      }
      svg .part.hl {
        filter: drop-shadow(0 0 5px var(--c));
      }
      svg .f {
        fill: var(--c);
        stroke: rgba(0, 0, 0, 0.35);
        stroke-width: 1.2;
      }
      svg .s {
        fill: none;
        stroke: var(--c);
        stroke-width: 6;
        stroke-linecap: round;
      }
      svg .o {
        fill: none;
        stroke: rgba(255, 255, 255, 0.75);
        stroke-width: 2;
      }
      svg .hl2 {
        fill: rgba(255, 255, 255, 0.28);
      }
      svg .n {
        fill: var(--metal);
        stroke: var(--metal2);
        stroke-width: 1.2;
      }
      svg .nd {
        fill: var(--metal-dark);
      }
      svg .pipe {
        fill: none;
        stroke: var(--metal2);
        stroke-width: 7;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      svg .ln {
        fill: none;
        stroke: var(--metal2);
        stroke-width: 1.5;
      }
      svg text {
        fill: var(--muted);
        font:
          600 10px system-ui,
          sans-serif;
        pointer-events: none;
      }
      svg text.on {
        fill: #fff;
        font-size: 10px;
      }
      @keyframes blink {
        50% {
          opacity: 0.55;
        }
      }
      svg .part.st-crit .f,
      svg .part.st-crit .s {
        animation: blink 1.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        svg .part.st-crit .f,
        svg .part.st-crit .s {
          animation: none;
        }
      }

      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0;
        background: var(--panel);
        color: var(--text);
        width: min(560px, calc(100vw - 32px));
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      dialog::backdrop {
        background: rgba(10, 15, 25, 0.45);
      }
      dialog .mh {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      dialog .mh h3 {
        margin: 0;
        font-size: 16px;
        flex: 1;
      }
      dialog .mb {
        padding: 16px 18px;
        max-height: 65vh;
        overflow: auto;
      }
      dialog .mf {
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      dialog .mf .left {
        margin-right: auto;
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .form .full {
        grid-column: 1/-1;
      }
      .form label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .form input,
      .form select,
      .form textarea {
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
      }
      .form .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .form fieldset {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .form fieldset legend {
        font-size: 12px;
        color: var(--muted);
        padding: 0 4px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg label {
        flex-direction: row;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        cursor: pointer;
        color: var(--text);
        font-size: 13px;
      }
      .seg label:has(input:checked) {
        background: var(--accent);
        color: var(--accent-text);
      }
      .seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 14px;
        margin-bottom: 12px;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 9px 16px;
        border-radius: 8px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 50;
      }
      .toast.show {
        opacity: 1;
      }
      .menu-btn {
        display: none;
      }

      @media (max-width: 1500px) {
        .split {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        nav.side {
          display: none;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        nav.side.open {
          display: flex;
        }
        .menu-btn {
          display: inline-block;
        }
        .split {
          grid-template-columns: 1fr;
        }
        .tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        main {
          padding: 14px 16px;
        }
        header.top {
          padding: 10px 16px;
        }
        .form {
          grid-template-columns: 1fr;
        }
        .form fieldset {
          grid-template-columns: 1fr;
        }
      }
      @media print {
        header.top,
        nav.side,
        .noprint {
          display: none !important;
        }
        .layout {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <button class="btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1>🔧 GMAO Ligne</h1>
      <div class="src" id="src"></div>
      <div class="sp"></div>
      <button
        class="btn"
        id="btnReleveLigne"
        title="Saisir les compteurs de tous les équipements"
      >
        ⏱ Relevé compteurs
      </button>
      <button class="btn" id="btnOpen" title="Ouvrir un fichier gmao-data.json">
        📂 Ouvrir BDD
      </button>
      <button
        class="btn pri"
        id="btnSave"
        title="Enregistrer dans le fichier JSON (Ctrl+S)"
      >
        💾 Enregistrer
      </button>
      <input
        type="file"
        id="fileInput"
        accept=".json,application/json"
        hidden
      />
    </header>
    <div class="layout">
      <nav class="side" id="side"></nav>
      <main id="main"></main>
    </div>
    <dialog id="dlg"></dialog>
    <div class="toast" id="toast"></div>

    <script>
      /* ============================================================
   GMAO Ligne — fichier unique HTML + base JSON
   - Les données sont dans un fichier JSON (gmao-data.json) que l'on
     ouvre / enregistre avec les boutons du bandeau.
   - Une copie de travail est gardée dans le navigateur.
   ============================================================ */

      /* ---------- rendu ---------- */
      function route() {
        const h = location.hash.slice(1);
        const [p, id] = h.split("=");
        return { page: p || "dash", id };
      }
      function go(h) {
        location.hash = h;
      }
      window.addEventListener("hashchange", () => {
        selOrg = null;
        render();
        window.scrollTo(0, 0);
        $("#side").classList.remove("open");
      });
      $("#menuBtn").onclick = () => $("#side").classList.toggle("open");

      function render() {
        renderSrc();
        renderNav();
        renderMain();
      }
      function renderNav() {
        const r = route();
        $("#side").innerHTML = `
    <a href="#dash" class="${r.page === "dash" ? "on" : ""}">📊 Tableau de bord</a>
    <a href="#seuils" class="${r.page === "seuils" ? "on" : ""}">🎚 Seuils</a>
    <a href="#journal" class="${r.page === "journal" ? "on" : ""}">📒 Journal</a>
    <div class="grp">Équipements</div>
    ${db.equipements
      .map((e) => {
        const c = counts(e.organes.map((o) => [e, o]));
        return `<a href="#eq=${e.id}" class="${r.page === "eq" && r.id === e.id ? "on" : ""}"><span class="dot ${eqStatus(e)}"></span>${esc(e.nom)}
        <span class="cnt">${c.crit ? '<b style="background:var(--crit)" title="À remplacer">' + c.crit + "</b>" : ""}${c.warn ? '<b style="background:var(--warn)" title="Vigilance">' + c.warn + "</b>" : ""}</span></a>`;
      })
      .join("")}
    <a href="javascript:void 0" id="addEq" class="muted">＋ Ajouter un équipement</a>`;
        $("#addEq").onclick = () => editEquip(null);
      }
      function renderMain() {
        const r = route(),
          m = $("#main");
        if (r.page === "eq" && findEq(r.id))
          m.innerHTML = viewEquip(findEq(r.id));
        else if (r.page === "seuils") m.innerHTML = viewSeuils();
        else if (r.page === "journal") m.innerHTML = viewJournal();
        else m.innerHTML = viewDash();
        bindMain();
      }

      function bar(eq, o) {
        const u = usage(eq, o),
          r = +o.seuilRemplacement || 0,
          v = +o.seuilVigilance || 0,
          s = status(eq, o);
        const pct = r ? Math.min(100, (u / r) * 100) : 0,
          vp = r ? Math.min(100, (v / r) * 100) : 0;
        return `<div class="bar ${s}"><i style="width:${pct}%"></i>${v && r ? `<b style="left:calc(${vp}% - 1px)" title="Seuil vigilance"></b>` : ""}</div>
    <div class="bar-l">${fmt(u)} / ${fmt(r)} ${UNIT[o.mode]} · ${r ? Math.round((u / r) * 100) : 0} %</div>`;
      }
      function remainTxt(eq, o) {
        const u = usage(eq, o),
          v = +o.seuilVigilance,
          r = +o.seuilRemplacement,
          un = UNIT[o.mode];
        if (!(r > 0)) return "Seuils non définis";
        if (u >= r) return `Dépassé de ${fmt(u - r)} ${un}`;
        if (v > 0 && u < v) return `Vigilance dans ${fmt(v - u)} ${un}`;
        return `Remplacement dans ${fmt(r - u)} ${un}`;
      }
      const badge = (s) =>
        `<span class="badge ${s}"><span class="dot ${s}"></span>${STATUS_TXT[s]}</span>`;
      const legend = `<div class="legend"><span><span class="dot ok"></span>OK</span><span><span class="dot warn"></span>Seuil vigilance atteint</span>
  <span><span class="dot crit"></span>Seuil remplacement atteint</span><span><span class="dot"></span>Non suivi</span></div>`;

      function viewDash() {
        const all = allOrg(),
          c = counts(all);
        const al = all
          .filter(([e, o]) => ["warn", "crit"].includes(status(e, o)))
          .sort(
            (a, b) =>
              RANK[status(...b)] - RANK[status(...a)] ||
              usage(...b) / (+b[1].seuilRemplacement || 1) -
                usage(...a) / (+a[1].seuilRemplacement || 1),
          );
        return `<h2>Tableau de bord</h2><p class="sub">${db.equipements.length} équipements · ${all.length} organes suivis</p>
  <div class="tiles">
    <div class="card tile ok"><div class="k">OK</div><div class="v">${c.ok}</div></div>
    <div class="card tile warn"><div class="k">Vigilance</div><div class="v">${c.warn}</div></div>
    <div class="card tile crit"><div class="k">À remplacer</div><div class="v">${c.crit}</div></div>
    <div class="card tile"><div class="k">Non suivis</div><div class="v">${c.none}</div></div>
  </div>
  <div class="card alerts"><h3>Actions à prévoir</h3>
    ${
      al.length
        ? al
            .map(
              ([
                e,
                o,
              ]) => `<div class="row" data-goeq="${e.id}" data-org="${o.id}">${badge(status(e, o))}
      <div class="n"><b>${esc(o.nom)}</b><small>${esc(e.nom)} · ${remainTxt(e, o)}</small></div>
      <div style="width:150px" class="noprint">${bar(e, o)}</div></div>`,
            )
            .join("")
        : '<div class="muted">Rien à signaler : tous les organes sont sous le seuil de vigilance.</div>'
    }
  </div>
  <div class="grid">${db.equipements
    .map((e) => {
      const cc = counts(e.organes.map((o) => [e, o]));
      return `<div class="card eqcard ${eqStatus(e)}" data-goeq="${e.id}">
      <div class="hd"><span class="dot ${eqStatus(e)}"></span><b>${esc(e.nom)}</b>${badge(eqStatus(e))}</div>
      ${drawing(e, true)}
      <div class="meta"><span>${fmt(e.compteurs.heures)} h</span><span>${fmt(e.compteurs.tonnes)} t</span>
        <span>${e.organes.length} organe(s)</span>${cc.warn ? `<span style="color:var(--warn)">${cc.warn} vigilance</span>` : ""}${cc.crit ? `<span style="color:var(--crit)">${cc.crit} à remplacer</span>` : ""}</div>
    </div>`;
    })
    .join("")}</div>${legend}`;
      }

      function viewEquip(e) {
        const rows = e.organes
          .map((o) => {
            const s = status(e, o);
            return `<tr class="click${o.id === selOrg ? " sel" : ""}" data-org="${o.id}">
      <td><b>${esc(o.nom)}</b><div class="bar-l">${esc(TYPES[e.type].slots[o.slot] || "Hors dessin")}</div></td>
      <td>${badge(s)}<div class="bar-l">${remainTxt(e, o)}</div></td>
      <td style="min-width:160px">${bar(e, o)}</td>
      <td class="num">${fmt(o.seuilVigilance)} / ${fmt(o.seuilRemplacement)} ${UNIT[o.mode]}</td>
      <td class="num">${fdate(o.ref.date)}</td>
      <td class="noprint" style="white-space:nowrap"><button class="btn sm" data-act="repl" data-org="${o.id}">🔁 Remplacé</button>
        <button class="btn sm" data-act="edit" data-org="${o.id}">✏️</button></td></tr>`;
          })
          .join("");
        return `<div class="eqhead"><div class="t"><h2>${esc(e.nom)}</h2><p class="sub" style="margin:0">${esc(e.zone || "")} · ${esc(TYPES[e.type].label)} · ${badge(eqStatus(e))}</p></div>
    <div class="counters">
      <div class="card counter"><div class="k">Compteur heures</div><div class="v">${fmt(e.compteurs.heures)} h</div></div>
      <div class="card counter"><div class="k">Compteur tonnage</div><div class="v">${fmt(e.compteurs.tonnes)} t</div></div>
    </div></div>
  <div class="toolbar noprint">
    <button class="btn pri" data-act="releve">⏱ Saisir relevé</button>
    <button class="btn" data-act="addorg">＋ Ajouter un organe</button>
    <button class="btn" data-act="editeq">⚙️ Modifier l'équipement</button>
    <span class="muted" style="font-size:12px">Dernier relevé : ${fdate(e.compteurs.date)} · Cliquez une pièce du dessin pour sa fiche.</span>
  </div>
  <div class="split">
    <div class="card" style="padding:10px">${drawing(e)}${legend}</div>
    <div class="card tablewrap">${
      e.organes.length
        ? `<table><thead><tr><th>Organe</th><th>État</th><th>Usure depuis remplacement</th>
      <th class="num">Vigil. / Rempl.</th><th class="num">Dernier rempl.</th><th class="noprint"></th></tr></thead><tbody>${rows}</tbody></table>`
        : '<div class="empty">Aucun organe suivi sur cet équipement.<br><br><button class="btn pri" data-act="addorg">＋ Ajouter un organe</button></div>'
    }</div>
  </div>`;
      }

      function viewSeuils() {
        return `<h2>Seuils</h2><p class="sub">Réglez pour chaque organe l'unité de suivi (heures ou tonnes) et les seuils. Les modifications sont appliquées immédiatement.</p>
  <div class="toolbar"><input type="search" id="fSeuil" placeholder="Filtrer (équipement, organe)…"></div>
  <div class="card tablewrap"><table id="tSeuils"><thead><tr><th>Équipement</th><th>Organe</th><th>Unité</th>
    <th class="num">Seuil vigilance</th><th class="num">Seuil remplacement</th><th class="num">Usure actuelle</th><th>État</th></tr></thead><tbody>
  ${allOrg()
    .map(
      ([
        e,
        o,
      ]) => `<tr data-eq="${e.id}" data-org="${o.id}" data-q="${esc((e.nom + " " + o.nom).toLowerCase())}">
    <td>${esc(e.nom)}</td><td>${esc(o.nom)}</td>
    <td><select class="inline-in" data-f="mode"><option value="heures"${o.mode === "heures" ? " selected" : ""}>Heures</option><option value="tonnes"${o.mode === "tonnes" ? " selected" : ""}>Tonnes</option></select></td>
    <td class="num"><input class="inline-in" type="number" min="0" step="any" data-f="seuilVigilance" value="${o.seuilVigilance}"></td>
    <td class="num"><input class="inline-in" type="number" min="0" step="any" data-f="seuilRemplacement" value="${o.seuilRemplacement}"></td>
    <td class="num" data-u>${fmt(usage(e, o))} ${UNIT[o.mode]}</td><td data-s>${badge(status(e, o))}</td></tr>`,
    )
    .join("")}
  </tbody></table></div>`;
      }

      function viewJournal() {
        const j = [...db.journal].sort((a, b) =>
          (b.date + b.ts).localeCompare(a.date + a.ts),
        );
        const T = {
          remplacement: "🔁 Remplacement",
          releve: "⏱ Relevé",
          config: "⚙️ Paramétrage",
        };
        return `<h2>Journal</h2><p class="sub">Historique des interventions et relevés (${j.length}).</p>
  <div class="toolbar"><input type="search" id="fJour" placeholder="Filtrer…"><button class="btn" id="csv">⬇ Export CSV</button></div>
  <div class="card tablewrap">${
    j.length
      ? `<table id="tJour"><thead><tr><th>Date</th><th>Type</th><th>Équipement</th><th>Organe</th><th>Intervenant</th>
    <th class="num">Compteurs</th><th class="num">Usure au rempl.</th><th>Commentaire</th></tr></thead><tbody>
    ${j
      .map(
        (
          x,
        ) => `<tr data-q="${esc([x.eqNom, x.orgNom, x.intervenant, x.commentaire, x.type].join(" ").toLowerCase())}">
      <td class="num">${fdate(x.date)}</td><td>${T[x.type] || esc(x.type)}</td><td>${esc(x.eqNom)}</td><td>${esc(x.orgNom || "")}</td>
      <td>${esc(x.intervenant || "")}</td><td class="num">${fmt(x.heures)} h · ${fmt(x.tonnes)} t</td>
      <td class="num">${x.usage != null ? fmt(x.usage) + " " + (UNIT[x.mode] || "") : ""}</td><td>${esc(x.commentaire || "")}</td></tr>`,
      )
      .join("")}
    </tbody></table>`
      : '<div class="empty">Aucune entrée pour le moment.</div>'
  }</div>`;
      }

      function bindMain() {
        const m = $("#main"),
          r = route();
        m.querySelectorAll("[data-goeq]").forEach(
          (el) =>
            (el.onclick = () => {
              if (el.dataset.org && el.classList.contains("row")) {
                go("eq=" + el.dataset.goeq);
                setTimeout(
                  () => ficheOrgane(findEq(el.dataset.goeq), el.dataset.org),
                  30,
                );
              } else go("eq=" + el.dataset.goeq);
            }),
        );
        if (r.page === "eq") {
          const e = findEq(r.id);
          if (!e) return;
          m.querySelectorAll(".draw [data-org], .chip[data-org]").forEach(
            (el) =>
              (el.onclick = (ev) => {
                ev.stopPropagation();
                ficheOrgane(e, el.dataset.org);
              }),
          );
          m.querySelectorAll("tr[data-org]").forEach(
            (el) => (el.onclick = () => ficheOrgane(e, el.dataset.org)),
          );
          m.querySelectorAll("[data-act]").forEach(
            (el) =>
              (el.onclick = (ev) => {
                ev.stopPropagation();
                const o = findOrg(e, el.dataset.org);
                ({
                  repl: () => remplacement(e, o),
                  edit: () => editOrgane(e, o),
                  releve: () => releve(e),
                  addorg: () => editOrgane(e, null),
                  editeq: () => editEquip(e),
                })[el.dataset.act]();
              }),
          );
        }
        if (r.page === "seuils") {
          $("#fSeuil").oninput = (ev) => {
            const q = ev.target.value.toLowerCase();
            m.querySelectorAll("#tSeuils tbody tr").forEach(
              (tr) => (tr.hidden = !tr.dataset.q.includes(q)),
            );
          };
          m.querySelectorAll("#tSeuils [data-f]").forEach(
            (inp) =>
              (inp.onchange = () => {
                const tr = inp.closest("tr"),
                  e = findEq(tr.dataset.eq),
                  o = findOrg(e, tr.dataset.org),
                  f = inp.dataset.f;
                o[f] = f === "mode" ? inp.value : Math.max(0, +inp.value || 0);
                if (+o.seuilVigilance > +o.seuilRemplacement)
                  toast(
                    "⚠ Le seuil de vigilance est supérieur au seuil de remplacement",
                  );
                tr.querySelector("[data-u]").textContent =
                  fmt(usage(e, o)) + " " + UNIT[o.mode];
                tr.querySelector("[data-s]").innerHTML = badge(status(e, o));
                commit(true);
                renderNav();
              }),
          );
        }
        if (r.page === "journal") {
          const f = $("#fJour");
          if (f)
            f.oninput = (ev) => {
              const q = ev.target.value.toLowerCase();
              m.querySelectorAll("#tJour tbody tr").forEach(
                (tr) => (tr.hidden = !tr.dataset.q.includes(q)),
              );
            };
          $("#csv").onclick = exportCsv;
        }
      }

      /* ---------- fenêtres ---------- */
      function modal(
        title,
        body,
        { ok = "Enregistrer", onOk, extra = "", onExtra, wide } = {},
      ) {
        const d = $("#dlg");
        d.style.width = wide ? "min(820px, calc(100vw - 32px))" : "";
        d.innerHTML = `<form method="dialog" id="mform"><div class="mh"><h3>${title}</h3><button class="btn sm" value="cancel" formnovalidate aria-label="Fermer">✕</button></div>
    <div class="mb">${body}</div>
    <div class="mf">${extra ? `<span class="left">${extra}</span>` : ""}<button class="btn" value="cancel" formnovalidate>Annuler</button>${ok ? `<button class="btn pri" value="ok">${ok}</button>` : ""}</div></form>`;
        const f = $("#mform");
        f.onsubmit = (ev) => {
          if (ev.submitter && ev.submitter.value === "ok" && onOk) {
            const res = onOk(new FormData(f), f);
            if (res === false) {
              ev.preventDefault();
              return;
            }
          }
        };
        if (onExtra)
          d.querySelectorAll("[data-extra]").forEach(
            (b) =>
              (b.onclick = (ev) => {
                ev.preventDefault();
                onExtra(b.dataset.extra, f);
              }),
          );
        d.showModal();
        const first = f.querySelector(".mb input, .mb select, .mb textarea");
        if (first) first.focus();
        return f;
      }
      const closeModal = () => $("#dlg").close();
      function log(entry) {
        db.journal.push(
          Object.assign({ id: uid("j"), ts: new Date().toISOString() }, entry),
        );
      }

      function ficheOrgane(e, orgId) {
        const o = findOrg(e, orgId);
        if (!o) return;
        selOrg = o.id;
        renderMain();
        const s = status(e, o),
          hist = db.journal
            .filter((j) => j.orgId === o.id)
            .sort((a, b) => (b.date + b.ts).localeCompare(a.date + a.ts))
            .slice(0, 8);
        modal(
          esc(o.nom) + " " + badge(s),
          `
    <dl class="kv">
      <dt>Équipement</dt><dd>${esc(e.nom)}</dd>
      <dt>Suivi en</dt><dd>${o.mode === "heures" ? "Heures de fonctionnement" : "Tonnage"}</dd>
      <dt>Usure depuis remplacement</dt><dd><b>${fmt(usage(e, o))} ${UNIT[o.mode]}</b> — ${remainTxt(e, o)}</dd>
      <dt>Seuil vigilance</dt><dd>${fmt(o.seuilVigilance)} ${UNIT[o.mode]}</dd>
      <dt>Seuil remplacement</dt><dd>${fmt(o.seuilRemplacement)} ${UNIT[o.mode]}</dd>
      <dt>Dernier remplacement</dt><dd>${fdate(o.ref.date)} (à ${fmt(o.ref.heures)} h · ${fmt(o.ref.tonnes)} t)</dd>
    </dl>${bar(e, o)}
    <h4 style="margin:16px 0 6px">Historique</h4>
    ${
      hist.length
        ? `<table><tbody>${hist
            .map(
              (
                j,
              ) => `<tr><td class="num">${fdate(j.date)}</td><td>${j.type === "remplacement" ? "🔁 Remplacement" : "⚙️ " + esc(j.type)}</td>
      <td>${esc(j.intervenant || "")}</td><td>${j.usage != null ? fmt(j.usage) + " " + (UNIT[j.mode] || "") : ""}</td><td>${esc(j.commentaire || "")}</td></tr>`,
            )
            .join("")}</tbody></table>`
        : '<div class="muted">Aucune intervention enregistrée.</div>'
    }`,
          {
            ok: "🔁 Déclarer un remplacement",
            onOk: () => {
              setTimeout(() => remplacement(e, o), 0);
            },
            extra:
              '<button class="btn" data-extra="edit">✏️ Modifier / seuils</button>',
            onExtra: () => {
              closeModal();
              editOrgane(e, o);
            },
          },
        );
      }

      function remplacement(e, o) {
        modal(
          "Remplacement — " + esc(o.nom),
          `<div class="form">
    <p class="full hint">${esc(e.nom)} · usure actuelle <b>${fmt(usage(e, o))} ${UNIT[o.mode]}</b>. Le compteur d'usure de l'organe repartira de zéro à partir des compteurs ci-dessous.</p>
    <label>Date<input type="date" name="date" value="${today()}" required></label>
    <label>Intervenant<input name="intervenant" placeholder="Nom / équipe" autocomplete="off"></label>
    <fieldset class="full"><legend>Compteurs de l'équipement au moment du remplacement</legend>
      <label>Heures<input type="number" name="heures" min="0" step="any" value="${e.compteurs.heures}" required></label>
      <label>Tonnes<input type="number" name="tonnes" min="0" step="any" value="${e.compteurs.tonnes}" required></label>
    </fieldset>
    <label class="full">Commentaire<textarea name="commentaire" rows="3" placeholder="Référence pièce, constat, n° OT…"></textarea></label></div>`,
          {
            ok: "Valider le remplacement",
            onOk: (fd) => {
              const h = +fd.get("heures"),
                t = +fd.get("tonnes");
              const used = Math.max(
                0,
                (o.mode === "heures" ? h : t) - (+o.ref[o.mode] || 0),
              );
              o.ref = { date: fd.get("date"), heures: h, tonnes: t };
              log({
                type: "remplacement",
                date: fd.get("date"),
                eqId: e.id,
                eqNom: e.nom,
                orgId: o.id,
                orgNom: o.nom,
                intervenant: fd.get("intervenant").trim(),
                commentaire: fd.get("commentaire").trim(),
                heures: h,
                tonnes: t,
                usage: used,
                mode: o.mode,
              });
              selOrg = o.id;
              commit();
              toast(
                "Remplacement enregistré — pensez à enregistrer le fichier",
              );
            },
          },
        );
      }

      function slotOptions(e, cur) {
        const sl = TYPES[e.type].slots;
        return (
          Object.entries(sl)
            .map(
              ([k, v]) =>
                `<option value="${k}"${k === cur ? " selected" : ""}>${esc(v)}</option>`,
            )
            .join("") +
          `<option value=""${!sl[cur] ? " selected" : ""}>Hors dessin (pastille)</option>`
        );
      }
      function editOrgane(e, o) {
        const isNew = !o;
        const d = o || {
          nom: "",
          slot: Object.keys(TYPES[e.type].slots)[0] || "",
          mode: "heures",
          seuilVigilance: "",
          seuilRemplacement: "",
          ref: {
            date: today(),
            heures: e.compteurs.heures,
            tonnes: e.compteurs.tonnes,
          },
        };
        modal(
          isNew ? "Nouvel organe — " + esc(e.nom) : "Modifier — " + esc(d.nom),
          `<div class="form">
    <label class="full">Nom de l'organe<input name="nom" value="${esc(d.nom)}" required placeholder="ex. Rouleau R9, Filtre retour…"></label>
    <label class="full">Emplacement sur le dessin<select name="slot">${slotOptions(e, d.slot)}</select></label>
    <div class="full"><div class="hint" style="margin-bottom:4px">Suivi en</div>
      <div class="seg"><label><input type="radio" name="mode" value="heures"${d.mode === "heures" ? " checked" : ""}>⏱ Heures</label>
      <label><input type="radio" name="mode" value="tonnes"${d.mode === "tonnes" ? " checked" : ""}>⚖️ Tonnes</label></div></div>
    <label>Seuil vigilance (<span data-un>${UNIT[d.mode]}</span>)<input type="number" name="seuilVigilance" min="0" step="any" value="${d.seuilVigilance}" required></label>
    <label>Seuil remplacement (<span data-un>${UNIT[d.mode]}</span>)<input type="number" name="seuilRemplacement" min="0" step="any" value="${d.seuilRemplacement}" required></label>
    <fieldset class="full"><legend>Dernier remplacement (point zéro de l'usure)</legend>
      <label class="full">Date<input type="date" name="rdate" value="${esc(d.ref.date)}"></label>
      <label>Compteur heures à ce moment<input type="number" name="rh" min="0" step="any" value="${d.ref.heures}"></label>
      <label>Compteur tonnes à ce moment<input type="number" name="rt" min="0" step="any" value="${d.ref.tonnes}"></label>
      <div class="full hint">Compteurs actuels de l'équipement : ${fmt(e.compteurs.heures)} h · ${fmt(e.compteurs.tonnes)} t. Pour une pièce neuve, laissez les compteurs actuels.</div>
    </fieldset></div>`,
          {
            ok: isNew ? "Ajouter" : "Enregistrer",
            extra: isNew
              ? ""
              : '<button class="btn danger" data-extra="del">🗑 Supprimer</button>',
            onExtra: () => {
              if (
                confirm(
                  "Supprimer « " +
                    d.nom +
                    " » ? L'historique du journal est conservé.",
                )
              ) {
                e.organes = e.organes.filter((x) => x !== o);
                log({
                  type: "config",
                  date: today(),
                  eqId: e.id,
                  eqNom: e.nom,
                  orgId: o.id,
                  orgNom: o.nom,
                  commentaire: "Organe supprimé",
                  heures: e.compteurs.heures,
                  tonnes: e.compteurs.tonnes,
                });
                closeModal();
                commit();
              }
            },
            onOk: (fd) => {
              const v = +fd.get("seuilVigilance"),
                r = +fd.get("seuilRemplacement");
              if (v > r) {
                alert(
                  "Le seuil de vigilance doit être inférieur ou égal au seuil de remplacement.",
                );
                return false;
              }
              const t = o || { id: uid(e.id) };
              Object.assign(t, {
                nom: fd.get("nom").trim(),
                slot: fd.get("slot"),
                mode: fd.get("mode"),
                seuilVigilance: v,
                seuilRemplacement: r,
                ref: {
                  date: fd.get("rdate"),
                  heures: +fd.get("rh") || 0,
                  tonnes: +fd.get("rt") || 0,
                },
              });
              if (isNew) {
                e.organes.push(t);
                log({
                  type: "config",
                  date: today(),
                  eqId: e.id,
                  eqNom: e.nom,
                  orgId: t.id,
                  orgNom: t.nom,
                  commentaire: "Organe ajouté",
                  heures: e.compteurs.heures,
                  tonnes: e.compteurs.tonnes,
                });
              }
              commit();
            },
          },
        );
        $("#mform")
          .querySelectorAll("input[name=mode]")
          .forEach(
            (r) =>
              (r.onchange = () =>
                $("#mform")
                  .querySelectorAll("[data-un]")
                  .forEach((s) => (s.textContent = UNIT[r.value]))),
          );
      }

      function editEquip(e) {
        const isNew = !e,
          d = e || {
            nom: "",
            zone: "",
            type: "generique",
            compteurs: { heures: 0, tonnes: 0 },
          };
        modal(
          isNew ? "Nouvel équipement" : "Modifier — " + esc(d.nom),
          `<div class="form">
    <label class="full">Nom<input name="nom" value="${esc(d.nom)}" required></label>
    <label>Zone<input name="zone" value="${esc(d.zone)}" placeholder="ex. Enfournement"></label>
    <label>Dessin<select name="type">${Object.entries(TYPES)
      .map(
        ([k, v]) =>
          `<option value="${k}"${k === d.type ? " selected" : ""}>${esc(v.label)}</option>`,
      )
      .join("")}</select></label>
    ${
      isNew
        ? `<label>Compteur heures actuel<input type="number" name="h" min="0" step="any" value="0"></label>
    <label>Compteur tonnes actuel<input type="number" name="t" min="0" step="any" value="0"></label>`
        : ""
    }</div>`,
          {
            ok: isNew ? "Créer" : "Enregistrer",
            extra: isNew
              ? ""
              : '<button class="btn danger" data-extra="del">🗑 Supprimer l\'équipement</button>',
            onExtra: () => {
              if (
                confirm("Supprimer « " + d.nom + " » et tous ses organes ?")
              ) {
                db.equipements = db.equipements.filter((x) => x !== e);
                closeModal();
                go("dash");
                commit();
              }
            },
            onOk: (fd) => {
              if (isNew) {
                const n = {
                  id: uid("eq"),
                  nom: fd.get("nom").trim(),
                  zone: fd.get("zone").trim(),
                  type: fd.get("type"),
                  compteurs: {
                    heures: +fd.get("h") || 0,
                    tonnes: +fd.get("t") || 0,
                    date: today(),
                  },
                  organes: [],
                };
                db.equipements.push(n);
                commit();
                go("eq=" + n.id);
              } else {
                Object.assign(e, {
                  nom: fd.get("nom").trim(),
                  zone: fd.get("zone").trim(),
                  type: fd.get("type"),
                });
                commit();
              }
            },
          },
        );
      }

      function releve(e) {
        modal(
          "Relevé compteurs — " + esc(e.nom),
          `<div class="form">
    <p class="full hint">Saisissez les valeurs <b>totales</b> lues sur l'équipement. Valeurs actuelles : ${fmt(e.compteurs.heures)} h · ${fmt(e.compteurs.tonnes)} t.</p>
    <label>Heures<input type="number" name="h" min="0" step="any" value="${e.compteurs.heures}" required></label>
    <label>Tonnes<input type="number" name="t" min="0" step="any" value="${e.compteurs.tonnes}" required></label>
    <label>Date<input type="date" name="date" value="${today()}" required></label>
    <label>Relevé par<input name="intervenant" autocomplete="off"></label></div>`,
          {
            ok: "Valider",
            onOk: (fd) => {
              const h = +fd.get("h"),
                t = +fd.get("t");
              if (
                (h < e.compteurs.heures || t < e.compteurs.tonnes) &&
                !confirm(
                  "Une valeur est inférieure au relevé précédent. Confirmer ?",
                )
              )
                return false;
              applyReleve(
                e,
                h,
                t,
                fd.get("date"),
                fd.get("intervenant").trim(),
              );
              commit();
              toast("Relevé enregistré");
            },
          },
        );
      }
      function applyReleve(e, h, t, date, who) {
        if (h === +e.compteurs.heures && t === +e.compteurs.tonnes)
          return false;
        const before = e.organes.map((o) => status(e, o));
        e.compteurs = { heures: h, tonnes: t, date };
        log({
          type: "releve",
          date,
          eqId: e.id,
          eqNom: e.nom,
          intervenant: who,
          heures: h,
          tonnes: t,
        });
        const newly = e.organes.filter(
          (o, i) =>
            RANK[status(e, o)] > RANK[before[i]] && status(e, o) !== "ok",
        );
        if (newly.length)
          setTimeout(
            () =>
              toast(
                "⚠ " +
                  e.nom +
                  " : " +
                  newly
                    .map((o) => o.nom + " → " + STATUS_TXT[status(e, o)])
                    .join(", "),
              ),
            300,
          );
        return true;
      }
      function releveLigne() {
        modal(
          "Relevé compteurs — tous les équipements",
          `<div class="form">
    <label>Date<input type="date" name="date" value="${today()}" required></label>
    <label>Relevé par<input name="intervenant" autocomplete="off"></label>
    <div class="full tablewrap"><table><thead><tr><th>Équipement</th><th class="num">Heures</th><th class="num">Tonnes</th></tr></thead><tbody>
    ${db.equipements
      .map(
        (e) => `<tr><td>${esc(e.nom)}</td>
      <td class="num"><input class="inline-in" style="width:110px" type="number" min="0" step="any" name="h_${e.id}" value="${e.compteurs.heures}"></td>
      <td class="num"><input class="inline-in" style="width:120px" type="number" min="0" step="any" name="t_${e.id}" value="${e.compteurs.tonnes}"></td></tr>`,
      )
      .join("")}
    </tbody></table></div>
    <p class="full hint">Astuce : « Appliquer la 1re ligne à tous » recopie les compteurs du premier équipement (compteur ligne commun).</p></div>`,
          {
            wide: true,
            ok: "Valider le relevé",
            extra:
              '<button class="btn" data-extra="copy">⇣ Appliquer la 1re ligne à tous</button>',
            onExtra: (k, f) => {
              const [h, t] = [
                f.querySelector("[name^=h_]").value,
                f.querySelector("[name^=t_]").value,
              ];
              f.querySelectorAll("[name^=h_]").forEach((i) => (i.value = h));
              f.querySelectorAll("[name^=t_]").forEach((i) => (i.value = t));
            },
            onOk: (fd) => {
              const down = db.equipements.filter(
                (e) =>
                  +fd.get("h_" + e.id) < e.compteurs.heures ||
                  +fd.get("t_" + e.id) < e.compteurs.tonnes,
              );
              if (
                down.length &&
                !confirm(
                  "Valeurs inférieures au relevé précédent pour : " +
                    down.map((e) => e.nom).join(", ") +
                    ". Confirmer ?",
                )
              )
                return false;
              let n = 0;
              db.equipements.forEach((e) => {
                if (
                  applyReleve(
                    e,
                    +fd.get("h_" + e.id),
                    +fd.get("t_" + e.id),
                    fd.get("date"),
                    fd.get("intervenant").trim(),
                  )
                )
                  n++;
              });
              commit();
              toast(n + " équipement(s) mis à jour");
            },
          },
        );
      }
      $("#btnReleveLigne").onclick = releveLigne;

      function exportCsv() {
        const cols = [
          "date",
          "type",
          "eqNom",
          "orgNom",
          "intervenant",
          "heures",
          "tonnes",
          "usage",
          "mode",
          "commentaire",
        ];
        const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
        const csv =
          "﻿" +
          cols.join(";") +
          "\n" +
          db.journal.map((j) => cols.map((c) => q(j[c])).join(";")).join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "gmao-journal-" + today() + ".csv";
        a.click();
        URL.revokeObjectURL(a.href);
      }

      /* ---------- démarrage ---------- */
      (async function init() {
        try {
          const s = JSON.parse(localStorage.getItem(LS_KEY) || "null");
          if (s && s.db) {
            db = normalize(s.db);
            fileName = s.fileName || "";
          }
        } catch (e) {}
        if (!db && location.protocol !== "file:") {
          try {
            const r = await fetch("gmao-data.json", { cache: "no-store" });
            if (r.ok) {
              db = normalize(await r.json());
              fileName = "gmao-data.json";
            }
          } catch (e) {}
        }
        if (!db) db = normalize(JSON.parse(JSON.stringify(DEFAULT_DB)));
        render();
      })();
    </script>
  </body>
</html>
