<title>Cannelures Laminoir</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: sticky control bar on top, then the mill line as one horizontal strip of cage columns (rolling direction left to right) with the product paths drawn over it. */
  :root {
    --bg: #eceff3;
    --surface: #ffffff;
    --surface-2: #e2e7ed;
    --fg: #19212a;
    --muted: #5b6876;
    --line: #c7d0da;
    --accent: #f2b705;
    --accent-ink: #19212a;
    --new: #2f9e44;
    --worn: #e8890c;
    --hs: #d63a2f;
    --o1: #16a34a;
    --o2: #2563eb;
    --o3: #8b3fd9;
    --shadow:
      0 1px 2px rgba(25, 33, 42, 0.08), 0 4px 14px rgba(25, 33, 42, 0.06);
    --f-display:
      "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --f-mono:
      "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas,
      monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151b;
      --surface: #19212a;
      --surface-2: #232d38;
      --fg: #e5eaf0;
      --muted: #94a2b1;
      --line: #313d4a;
      --accent: #f5c330;
      --accent-ink: #10151b;
      --new: #3fbf5a;
      --worn: #f59f2a;
      --hs: #f0544a;
      --o1: #34d27b;
      --o2: #5b95ff;
      --o3: #b07cff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151b;
    --surface: #19212a;
    --surface-2: #232d38;
    --fg: #e5eaf0;
    --muted: #94a2b1;
    --line: #313d4a;
    --accent: #f5c330;
    --accent-ink: #10151b;
    --new: #3fbf5a;
    --worn: #f59f2a;
    --hs: #f0544a;
    --o1: #34d27b;
    --o2: #5b95ff;
    --o3: #b07cff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.45;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--surface);
  }
  button,
  input,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    display: grid;
    gap: 12px;
  }
  .bar-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  h1 {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0;
    line-height: 1;
    text-wrap: balance;
  }
  h1 small {
    display: block;
    font-family: var(--f-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-top: 4px;
  }
  .sync {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sync::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .sync.ok::before {
    background: var(--new);
  }
  .sync.local::before {
    background: var(--worn);
  }

  .label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .diams {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .diam {
    border: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    min-width: 52px;
  }
  .diam[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
  }

  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: stretch;
  }
  .mode {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 500;
  }
  .mode[aria-pressed="true"] {
    border-color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--fg);
    background: var(--surface-2);
  }
  .opt {
    display: inline-flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  .opt[data-on="true"] {
    border-color: var(--oc);
    box-shadow: inset 0 0 0 1px var(--oc);
  }
  .opt .mode {
    border: 0;
    border-radius: 0;
    padding-right: 6px;
    background: transparent;
    box-shadow: none;
  }
  .swatch {
    width: 18px;
    height: 4px;
    border-radius: 2px;
    background: var(--oc);
    flex: none;
  }
  .opt input[type="text"] {
    border: 0;
    background: transparent;
    width: 9.5em;
    padding: 6px 4px;
    font-weight: 600;
    color: var(--oc);
  }
  .opt input[type="text"]:focus {
    outline: none;
    background: var(--surface-2);
  }
  .opt .count {
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--muted);
    padding: 0 8px;
    font-variant-numeric: tabular-nums;
  }
  .opt .count.warn {
    color: var(--hs);
  }
  .eye {
    border: 0;
    border-left: 1px solid var(--line);
    background: transparent;
    padding: 6px 9px;
    color: var(--muted);
    align-self: stretch;
  }
  .eye[aria-pressed="false"] {
    opacity: 0.45;
    text-decoration: line-through;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .legend i {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
  }

  main {
    padding-block: 16px 40px;
  }
  .scroller {
    overflow-x: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: 8px;
  }
  .line {
    position: relative;
    display: inline-flex;
    gap: 44px;
    align-items: flex-start;
    min-width: 100%;
  }
  .paths {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 2;
  }
  .paths path {
    fill: none;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 12 8;
    animation: flow 1.1s linear infinite;
    opacity: 0.9;
  }
  .paths path.halo {
    stroke-dasharray: none;
    animation: none;
    stroke-width: 8;
    opacity: 0.18;
  }
  .paths circle {
    stroke: var(--surface);
    stroke-width: 2;
  }
  @keyframes flow {
    to {
      stroke-dashoffset: -20;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .paths path {
      animation: none;
    }
    .paths .runner {
      display: none;
    }
  }

  .cage {
    position: relative;
    width: 152px;
    flex: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .cage-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 8px 6px 10px;
    border-bottom: 1px solid var(--line);
  }
  .cage-num {
    font-family: var(--f-display);
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .cage-num b {
    font-size: 24px;
    color: var(--fg);
    margin-left: 2px;
  }
  .hs-btn {
    border: 1.5px solid var(--hs);
    color: var(--hs);
    background: transparent;
    border-radius: 5px;
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 1px 8px;
  }
  .hs-btn:hover {
    background: var(--hs);
    color: #fff;
  }
  .roll-id {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: grid;
    gap: 1px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  .roll-id:hover {
    background: var(--surface-2);
  }
  .roll-id:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .roll-name {
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .roll-d {
    font-family: var(--f-mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .roll-meta {
    font-size: 11px;
    color: var(--muted);
  }
  .frettes {
    display: grid;
    gap: 6px;
    padding: 8px;
  }
  .frette {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 4px;
    align-items: start;
  }
  .frette + .frette {
    border-top: 1px dashed var(--line);
    padding-top: 6px;
  }
  .frette-label {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--muted);
    padding-top: 5px;
  }
  .grooves {
    display: grid;
    gap: 5px;
  }
  .g {
    position: relative;
    min-height: 26px;
    border-radius: 13px;
    border: 0;
    color: #fff;
    font-family: var(--f-mono);
    font-size: 12px;
    font-weight: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    padding: 4px 8px;
  }
  .g.has-c {
    border-radius: 9px;
    padding-bottom: 6px;
  }
  .g-num {
    line-height: 18px;
  }
  .g-c {
    display: block;
    width: 100%;
    margin-top: 2px;
    padding-top: 3px;
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    font-family: var(--f-body);
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.25;
    text-align: left;
    white-space: pre-line;
    overflow-wrap: anywhere;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
  }
  .g.s-new {
    background: var(--new);
  }
  .g.s-worn {
    background: var(--worn);
  }
  .g.s-hs {
    background: var(--hs);
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 6px,
      rgba(0, 0, 0, 0.18) 6px 9px
    );
  }
  .g:hover {
    filter: brightness(1.08);
  }
  .cage-foot {
    margin-top: auto;
    padding: 6px 10px 8px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .cage-foot b {
    font-weight: 600;
  }
  .cage-foot .n {
    color: var(--new);
  }
  .cage-foot .w {
    color: var(--worn);
  }
  .cage-foot .h {
    color: var(--hs);
  }
  .empty {
    padding: 18px 10px;
    display: grid;
    gap: 10px;
    justify-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  .empty p {
    margin: 0;
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 7px;
    padding: 7px 12px;
    font-weight: 500;
  }
  .btn:hover {
    border-color: var(--fg);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .btn.danger {
    color: var(--hs);
    border-color: var(--hs);
    background: transparent;
  }
  .btn.danger.armed {
    background: var(--hs);
    color: #fff;
  }

  .loading {
    padding: 40px 0;
    color: var(--muted);
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(10, 14, 19, 0.55);
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px))
      max(16px, env(safe-area-inset-right, 0px))
      max(16px, env(safe-area-inset-bottom, 0px))
      max(16px, env(safe-area-inset-left, 0px));
  }
  .modal {
    width: min(520px, 100%);
    max-height: 100%;
    overflow: auto;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .modal-head h2 {
    margin: 0;
    font-family: var(--f-display);
    font-size: 22px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-wrap: balance;
  }
  .modal-head.hs {
    background: var(--hs);
    color: #fff;
    border-bottom-color: var(--hs);
    border-radius: 11px 11px 0 0;
  }
  .x {
    border: 0;
    background: transparent;
    font-size: 22px;
    line-height: 1;
    padding: 2px 6px;
    color: inherit;
  }
  .modal-body {
    padding: 16px;
    display: grid;
    gap: 14px;
  }
  .modal-foot {
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-foot .spacer {
    flex: 1;
  }
  .field {
    display: grid;
    gap: 4px;
  }
  .field input,
  .field textarea {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 7px;
    padding: 8px 10px;
    width: 100%;
  }
  .field input:disabled {
    opacity: 0.6;
  }
  .field textarea {
    min-height: 90px;
    resize: vertical;
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .note {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
  }
  .states {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .states button {
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 6px 14px;
    color: #fff;
    font-weight: 600;
  }
  .states button[aria-pressed="true"] {
    border-color: var(--fg);
    box-shadow: 0 0 0 2px var(--surface) inset;
  }
  .proc {
    margin: 0;
    padding-left: 0;
    list-style: none;
    counter-reset: s;
    display: grid;
    gap: 10px;
  }
  .proc li {
    counter-increment: s;
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 10px;
    align-items: start;
    max-width: 65ch;
  }
  .proc li::before {
    content: counter(s);
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 18px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface-2);
  }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--muted);
  }
  .warnings {
    display: grid;
    gap: 4px;
    font-size: 13px;
  }
  .warnings div {
    color: var(--hs);
  }

  .toast {
    position: fixed;
    left: 50%;
    translate: -50% 0;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 30;
    background: var(--fg);
    color: var(--bg);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: var(--shadow);
    max-width: calc(100% - 32px);
  }
  .tabs {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .tab {
    border: 0;
    background: var(--surface);
    padding: 6px 14px;
    font-weight: 600;
    color: var(--muted);
  }
  .tab + .tab {
    border-left: 1px solid var(--line);
  }
  .tab[aria-pressed="true"] {
    background: var(--fg);
    color: var(--bg);
  }
  .view-tab #tools .mode,
  .view-tab #hint {
    display: none;
  }
  .view-tab .opt input[type="text"] {
    padding-left: 10px;
  }

  /* Visualisation: one row per cage, top to bottom; rolls centred on a common axis. */
  .vline {
    position: relative;
    display: grid;
    gap: 14px;
    width: max-content;
    min-width: 100%;
  }
  .vrow {
    display: grid;
    grid-template-columns: 112px 74px minmax(0, 1fr) 74px;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
  }
  .vrow.vhead {
    background: transparent;
    border: 0;
    box-shadow: none;
    padding-block: 0;
  }
  .vside {
    white-space: nowrap;
    font-family: var(--f-display);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .vside.l {
    text-align: left;
  }
  .vside.r {
    text-align: right;
  }
  .vhead .vside {
    font-size: 16px;
    color: var(--fg);
  }
  .vcage {
    display: grid;
    gap: 2px;
  }
  .vcage-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vcage .cage-num b {
    font-size: 22px;
  }
  .vcage small {
    font-size: 11px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .vcenter {
    display: grid;
    justify-items: center;
    gap: 6px;
  }
  .vroll {
    display: flex;
    align-items: center;
  }
  .journal {
    width: 16px;
    height: 20px;
    background: var(--line);
    border-radius: 3px;
  }
  .barrel {
    display: flex;
    gap: 0;
    padding: 8px 6px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .barrel.empty-roll {
    padding: 12px 24px;
    border-style: dashed;
    color: var(--muted);
    font-size: 12px;
  }
  .vfrette {
    display: flex;
    gap: 4px;
    padding: 0 6px;
  }
  .vfrette + .vfrette {
    border-left: 2px solid var(--line);
  }
  .vg {
    position: relative;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 6px;
    color: #fff;
    font-family: var(--f-mono);
    font-size: 12px;
    font-weight: 500;
    display: grid;
    place-items: center;
    font-variant-numeric: tabular-nums;
  }
  .vg.s-new {
    background: var(--new);
  }
  .vg.s-worn {
    background: var(--worn);
  }
  .vg.s-hs {
    background: var(--hs);
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 5px,
      rgba(0, 0, 0, 0.18) 5px 8px
    );
  }
  .vg.has-c::after {
    content: "";
    position: absolute;
    top: 3px;
    right: 3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
  }
  .vnotes {
    display: grid;
    gap: 2px;
    font-size: 11px;
    line-height: 1.3;
    max-width: 60ch;
  }
  .vnotes span b {
    font-family: var(--f-mono);
    font-weight: 500;
  }
  .vnotes .s-new b {
    color: var(--new);
  }
  .vnotes .s-worn b {
    color: var(--worn);
  }
  .vnotes .s-hs b {
    color: var(--hs);
  }
  @media (max-width: 560px) {
    .bar {
      position: static;
    }
    .row2 {
      grid-template-columns: 1fr;
    }
    .sync {
      margin-left: 0;
    }
  }
</style>

<header class="bar" id="bar">
  <div class="bar-top">
    <h1>
      Train de laminage<small>Répartition des cannelures · cages 1 à 16</small>
    </h1>
    <div class="group">
      <span class="label">Ø laminé</span>
      <div
        class="diams"
        id="diams"
        role="group"
        aria-label="Diamètre laminé"
      ></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Affichage">
      <button class="tab" data-tab="edit" aria-pressed="true">
        Renseignement
      </button>
      <button class="tab" data-tab="view" aria-pressed="false">
        Visualisation
      </button>
    </nav>
    <span class="sync" id="sync">Connexion…</span>
  </div>
  <div class="tools" id="tools">
    <button class="mode" id="mode-state" data-mode="state" aria-pressed="true">
      État · clic = neuve › usée › HS
    </button>
    <button class="mode" id="mode-note" data-mode="note" aria-pressed="false">
      Commentaire
    </button>
  </div>
  <div class="legend">
    <span><i style="background: var(--new)"></i>Neuve</span>
    <span><i style="background: var(--worn)"></i>Usée</span>
    <span><i style="background: var(--hs)"></i>HS</span>
    <span
      ><i
        style="
          background: var(--surface-2);
          border-radius: 50%;
          box-shadow: inset 0 0 0 4px var(--fg);
        "
      ></i
      >Commentaire</span
    >
    <span class="hint" id="hint"></span>
  </div>
</header>

<main>
  <div class="scroller" id="scroller">
    <div class="line" id="line">
      <p class="loading">Chargement des cylindres…</p>
    </div>
  </div>
  <div class="scroller" id="vscroller" hidden>
    <div class="vline" id="vline"></div>
  </div>
</main>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
  (() => {
    const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
    const without = (arr, ex) => arr.filter((n) => !ex.includes(n));
    const DIAMS = {
      16: without(range(1, 16), [7, 8]),
      18: range(1, 14),
      20: range(1, 14),
      25: range(1, 12),
      28: without(range(1, 12), [7, 8]),
      32: range(1, 10),
      40: without(range(1, 9), [7]),
    };
    const STATES = { new: "Neuve", worn: "Usée", hs: "HS" };
    const NEXT = { new: "worn", worn: "hs", hs: "new" };
    const OPT_VARS = ["--o1", "--o2", "--o3"];
    const DEFAULT_PROC = [
      "Arrêter l'alimentation de la cage et mettre le train en sécurité.",
      "Consigner la cage (électrique, hydraulique, eau de refroidissement) selon le mode opératoire de consignation.",
      "Prévenir le chef de poste et la maintenance.",
      "Identifier l'élément HS (cannelure, frette, guide, palier) et le noter dans le cahier de poste.",
      "Basculer sur l'option de cannelures de secours ou préparer le changement de cylindre.",
      "Contrôler les réglages (écartement, guidage, alignement) avant remise en service.",
      "Déconsigner et redémarrer après validation du chef de poste.",
    ].join("\n");

    const S = {
      cages: {},
      config: {
        options: [
          { name: "Option 1" },
          { name: "Option 2" },
          { name: "Option 3" },
        ],
        paths: {},
        procedures: {},
      },
      diam: 16,
      mode: "state",
      tab: "edit",
      show: [true, true, true],
      ready: false,
    };
    try {
      const d = Number(localStorage.getItem("laminoir-diam"));
      if (DIAMS[d]) S.diam = d;
      if (localStorage.getItem("laminoir-tab") === "view") S.tab = "view";
    } catch (e) {}

    const $ = (id) => document.getElementById(id);
    const esc = (s) =>
      String(s ?? "").replace(
        /[&<>"']/g,
        (c) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[c],
      );
    const clone = (o) => JSON.parse(JSON.stringify(o));

    // ---------- Storage: shared artifact db when available, else this browser ----------
    let backend = null;
    const pending = {},
      busy = {};
    function queueWrite(path, data) {
      pending[path] = data === null ? null : clone(data);
      if (!busy[path]) flush(path);
    }
    async function flush(path) {
      busy[path] = true;
      while (path in pending) {
        const data = pending[path];
        delete pending[path];
        try {
          if (data === null) await backend.del(path);
          else await backend.set(path, data);
        } catch (e) {
          const code = e && e.code;
          toast(
            code === "invalid_argument"
              ? "Modification refusée : accès en lecture seule."
              : code === "quota_exceeded"
                ? "Stockage plein : supprimez des données inutiles."
                : "Échec de l'enregistrement. Réessayez.",
          );
        }
      }
      busy[path] = false;
    }
    const isBusy = (path) => busy[path] || path in pending;

    function useLocal(reason) {
      const KEY = "laminoir-data-v1";
      let store = { cages: {}, config: null };
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) store = JSON.parse(raw);
      } catch (e) {}
      S.cages = store.cages || {};
      if (store.config) S.config = Object.assign(S.config, store.config);
      const persist = () => {
        try {
          localStorage.setItem(
            KEY,
            JSON.stringify({ cages: S.cages, config: S.config }),
          );
        } catch (e) {
          toast("Impossible d'enregistrer dans ce navigateur.");
        }
      };
      backend = { set: async () => persist(), del: async () => persist() };
      setSync("local", reason || "Enregistré dans ce navigateur");
      S.ready = true;
      renderAll();
    }

    function useDb(db) {
      backend = {
        set: (path, data) => db.doc(path).set(data),
        del: (path) => db.doc(path).delete(),
      };
      let gotCages = false,
        gotConfig = false;
      const ready = () => {
        if (gotCages && gotConfig && !S.ready) {
          S.ready = true;
          setSync("ok", "Enregistré · partagé");
        }
        renderAll();
      };
      db.collection("cages").onSnapshot((snap) => {
        const next = {};
        snap.docs.forEach((d) => {
          const n = parseInt(d.id.slice(1), 10);
          if (!n) return;
          next[n] = isBusy("cages/" + d.id) ? S.cages[n] : clone(d.data());
        });
        Object.keys(S.cages).forEach((n) => {
          if (isBusy("cages/c" + n) && S.cages[n]) next[n] = S.cages[n];
        });
        S.cages = next;
        gotCages = true;
        ready();
      }, onDbError);
      db.doc("config/main").onSnapshot((snap) => {
        if (snap.exists && !isBusy("config/main"))
          S.config = Object.assign(S.config, clone(snap.data()));
        gotConfig = true;
        ready();
      }, onDbError);
    }
    function onDbError(e) {
      setSync(
        "",
        e && e.code === "revoked"
          ? "Accès retiré"
          : "Connexion perdue · rechargez la page",
      );
    }
    function setSync(cls, text) {
      const el = $("sync");
      el.className = "sync " + cls;
      el.textContent = text;
    }

    async function init() {
      renderToolbar();
      let db = null;
      if (window.claude && typeof window.claude.use === "function") {
        try {
          db = await window.claude.use("db");
        } catch (e) {
          db = null;
        }
        if (db) return useDb(db);
        return useLocal("Non connecté · enregistré dans ce navigateur");
      }
      useLocal();
    }

    // ---------- Helpers on state ----------
    const visible = () => DIAMS[S.diam];
    const pathFor = (i) => {
      const p = S.config.paths;
      const d = (p[S.diam] = p[S.diam] || {});
      return (d[i] = d[i] || {});
    };
    const grooveOf = (n, key) => {
      const c = S.cages[n];
      return c ? (c.grooves && c.grooves[key]) || { s: "new" } : null;
    };
    const validKey = (n, key) => {
      const c = S.cages[n];
      if (!c || !key) return false;
      const [f, g] = key.split("-").map(Number);
      return f < c.frettes && g < c.gpf;
    };
    const saveCage = (n) => queueWrite("cages/c" + n, S.cages[n] || null);
    const saveConfig = () => queueWrite("config/main", S.config);

    // ---------- Toolbar ----------
    function renderToolbar() {
      $("diams").innerHTML = Object.keys(DIAMS)
        .map(
          (d) =>
            `<button class="diam" data-diam="${d}" aria-pressed="${Number(d) === S.diam}">Ø${d}</button>`,
        )
        .join("");
      const tools = $("tools");
      tools.querySelectorAll(".opt").forEach((el) => el.remove());
      S.config.options.forEach((o, i) => {
        const wrap = document.createElement("div");
        wrap.className = "opt";
        wrap.style.setProperty("--oc", `var(${OPT_VARS[i]})`);
        wrap.innerHTML =
          `<button class="mode" data-mode="o${i}" aria-pressed="false" title="Tracer ce chemin : cliquez une cannelure par cage"><span class="swatch"></span>Tracer</button>` +
          `<input type="text" id="opt-name-${i}" maxlength="30" aria-label="Nom de l'option ${i + 1}" value="${esc(o.name)}">` +
          `<span class="count" id="opt-count-${i}"></span>` +
          `<button class="eye" data-eye="${i}" aria-pressed="${S.show[i]}" title="Afficher ou masquer ce chemin">voir</button>`;
        tools.appendChild(wrap);
      });
      syncToolbar();
    }
    function syncToolbar() {
      document
        .querySelectorAll("[data-diam]")
        .forEach((b) =>
          b.setAttribute(
            "aria-pressed",
            String(Number(b.dataset.diam) === S.diam),
          ),
        );
      document
        .querySelectorAll("[data-mode]")
        .forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode)),
        );
      document
        .querySelectorAll(".opt")
        .forEach((el, i) => (el.dataset.on = String(S.mode === "o" + i)));
      S.config.options.forEach((o, i) => {
        const inp = $("opt-name-" + i);
        if (inp && document.activeElement !== inp) inp.value = o.name;
        const p = pathFor(i),
          vis = visible();
        const used = vis.filter((n) => validKey(n, p[n]));
        const bad = used.filter((n) => grooveOf(n, p[n]).s === "hs").length;
        const c = $("opt-count-" + i);
        c.textContent =
          `${used.length}/${vis.length}` + (bad ? ` · ${bad} HS` : "");
        c.className = "count" + (bad ? " warn" : "");
        c.title = bad
          ? `${bad} cannelure(s) HS sur ce chemin`
          : "Cages renseignées sur ce chemin";
      });
      const m = S.mode;
      $("hint").textContent =
        m === "state"
          ? "Cliquez une cannelure pour changer son état."
          : m === "note"
            ? "Cliquez une cannelure pour ajouter un commentaire."
            : `Tracé « ${S.config.options[+m[1]].name} » : cliquez une cannelure par cage (re-cliquez pour retirer).`;
    }

    // ---------- Mill line ----------
    function cageHTML(n) {
      const c = S.cages[n];
      const head =
        `<div class="cage-head"><span class="cage-num">Cage<b>${n}</b></span>` +
        `<button class="hs-btn" data-act="hs" data-cage="${n}" title="Procédure en cas de cage HS">HS</button></div>`;
      if (!c) {
        return (
          `<section class="cage" data-cage="${n}">${head}<div class="empty"><p>Aucun cylindre</p>` +
          `<button class="btn" data-act="config" data-cage="${n}">Insérer un cylindre</button></div></section>`
        );
      }
      const sel = [0, 1, 2].map((i) => pathFor(i)[n]);
      let counts = { new: 0, worn: 0, hs: 0 };
      let fr = "";
      for (let f = 0; f < c.frettes; f++) {
        let gs = "";
        for (let g = 0; g < c.gpf; g++) {
          const key = `${f}-${g}`;
          const st = grooveOf(n, key);
          counts[st.s]++;
          const rings = [];
          sel.forEach((k, i) => {
            if (k === key) rings.push(i);
          });
          const shadow = rings.length
            ? `style="box-shadow:${rings.map((i, j) => `0 0 0 ${2 + j * 4}px var(--surface), 0 0 0 ${4 + j * 4}px var(${OPT_VARS[i]})`).join(",")}"`
            : "";
          const tip =
            `Cage ${n} · Frette ${f + 1} · Cannelure ${g + 1} · ${STATES[st.s]}` +
            rings.map((i) => ` · ${S.config.options[i].name}`).join("") +
            (st.c ? `\n${st.c}` : "");
          gs += `<button class="g s-${st.s}${st.c ? " has-c" : ""}" data-act="g" data-cage="${n}" data-g="${key}" ${shadow} title="${esc(tip)}" aria-label="${esc(tip)}"><span class="g-num">${g + 1}</span>${st.c ? `<span class="g-c">${esc(st.c)}</span>` : ""}</button>`;
        }
        fr += `<div class="frette"><div class="frette-label">F${f + 1}</div><div class="grooves">${gs}</div></div>`;
      }
      return (
        `<section class="cage" data-cage="${n}">${head}` +
        `<button class="roll-id" data-act="config" data-cage="${n}" title="Modifier le cylindre"><span class="roll-name">${esc(c.name) || "Sans nom"}</span>` +
        `<span class="roll-d">Ø ${esc(c.diameter)} mm</span><span class="roll-meta">${c.frettes} frette${c.frettes > 1 ? "s" : ""} × ${c.gpf} cannelure${c.gpf > 1 ? "s" : ""}</span></button>` +
        `<div class="frettes">${fr}</div>` +
        `<div class="cage-foot"><span class="n"><b>${counts.new}</b> N</span><span class="w"><b>${counts.worn}</b> U</span><span class="h"><b>${counts.hs}</b> HS</span></div></section>`
      );
    }

    // ---------- Visualisation (cages top to bottom) ----------
    function vrowHTML(n) {
      const c = S.cages[n];
      const label =
        `<div class="vcage"><div class="vcage-top"><span class="cage-num">Cage<b>${n}</b></span>` +
        `<button class="hs-btn" data-act="hs" data-cage="${n}" title="Procédure en cas de cage HS">HS</button></div>` +
        (c
          ? `<small>${esc(c.name) || "Sans nom"} · Ø ${esc(c.diameter)} mm</small>`
          : "") +
        `</div>`;
      const sides = (mid) =>
        `<section class="vrow" data-cage="${n}">${label}<span class="vside l">Côté piste</span>` +
        `<div class="vcenter">${mid}</div><span class="vside r">Côté moteur</span></section>`;
      if (!c) {
        return sides(
          `<div class="vroll"><span class="journal"></span><div class="barrel empty-roll">Aucun cylindre</div><span class="journal"></span></div>`,
        );
      }
      const sel = [0, 1, 2].map((i) => pathFor(i)[n]);
      let fr = "",
        notes = "";
      for (let f = 0; f < c.frettes; f++) {
        let gs = "";
        for (let g = 0; g < c.gpf; g++) {
          const key = `${f}-${g}`;
          const st = grooveOf(n, key);
          const rings = [];
          sel.forEach((k, i) => {
            if (k === key) rings.push(i);
          });
          const shadow = rings.length
            ? `style="box-shadow:${rings.map((i, j) => `0 0 0 ${2 + j * 3}px var(--surface-2), 0 0 0 ${4 + j * 3}px var(${OPT_VARS[i]})`).join(",")}"`
            : "";
          const tip =
            `Cage ${n} · Frette ${f + 1} · Cannelure ${g + 1} · ${STATES[st.s]}` +
            rings.map((i) => ` · ${S.config.options[i].name}`).join("") +
            (st.c ? `\n${st.c}` : "");
          gs += `<button class="vg s-${st.s}${st.c ? " has-c" : ""}" data-act="g" data-cage="${n}" data-g="${key}" ${shadow} title="${esc(tip)}" aria-label="${esc(tip)}">${g + 1}</button>`;
          if (st.c)
            notes += `<span class="s-${st.s}"><b>F${f + 1}·C${g + 1}</b> ${esc(st.c)}</span>`;
        }
        fr += `<div class="vfrette">${gs}</div>`;
      }
      return sides(
        `<div class="vroll"><span class="journal"></span><div class="barrel">${fr}</div><span class="journal"></span></div>` +
          (notes ? `<div class="vnotes">${notes}</div>` : ""),
      );
    }

    function renderAll() {
      syncToolbar();
      document.body.classList.toggle("view-tab", S.tab === "view");
      document
        .querySelectorAll("[data-tab]")
        .forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.tab === S.tab)),
        );
      $("scroller").hidden = S.tab === "view";
      $("vscroller").hidden = S.tab !== "view";
      if (!S.ready) return;
      if (S.tab === "view") {
        $("vline").innerHTML =
          visible().map(vrowHTML).join("") +
          `<svg class="paths" id="vpaths" aria-hidden="true"></svg>`;
      } else {
        $("line").innerHTML =
          visible().map(cageHTML).join("") +
          `<svg class="paths" id="paths" aria-hidden="true"></svg>`;
      }
      requestAnimationFrame(drawPaths);
    }

    function drawPaths() {
      if (S.tab === "view") return drawVPaths();
      const line = $("line"),
        svg = $("paths");
      if (!svg) return;
      const base = line.getBoundingClientRect();
      svg.setAttribute("width", line.scrollWidth);
      svg.setAttribute("height", line.scrollHeight);
      let out = "";
      [0, 1, 2].forEach((i) => {
        if (!S.show[i]) return;
        const p = pathFor(i),
          off = (i - 1) * 4;
        const pts = [];
        visible().forEach((n) => {
          if (!validKey(n, p[n])) return;
          const el = line.querySelector(
            `.g[data-cage="${n}"][data-g="${p[n]}"]`,
          );
          if (!el) return;
          const r = el.getBoundingClientRect();
          pts.push({
            l: r.left - base.left - 5,
            r: r.right - base.left + 5,
            y: r.top - base.top + 13 + off,
          });
        });
        if (pts.length < 2) return;
        let d = "";
        for (let k = 1; k < pts.length; k++) {
          const a = pts[k - 1],
            b = pts[k],
            dx = (b.l - a.r) / 2;
          d += `M${a.r},${a.y} C${a.r + dx},${a.y} ${b.l - dx},${b.y} ${b.l},${b.y} `;
        }
        const col = `var(${OPT_VARS[i]})`;
        const dur = Math.max(3, pts.length * 0.8).toFixed(1);
        out +=
          `<path class="halo" d="${d}" stroke="${col}"></path><path d="${d}" stroke="${col}"></path>` +
          `<circle class="runner" r="5.5" fill="${col}"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"></animateMotion></circle>`;
      });
      svg.innerHTML = out;
    }

    function drawVPaths() {
      const line = $("vline"),
        svg = $("vpaths");
      if (!svg) return;
      const base = line.getBoundingClientRect();
      svg.setAttribute("width", line.scrollWidth);
      svg.setAttribute("height", line.scrollHeight);
      let out = "";
      [0, 1, 2].forEach((i) => {
        if (!S.show[i]) return;
        const p = pathFor(i),
          off = (i - 1) * 4;
        const pts = [];
        visible().forEach((n) => {
          if (!validKey(n, p[n])) return;
          const el = line.querySelector(
            `.vg[data-cage="${n}"][data-g="${p[n]}"]`,
          );
          if (!el) return;
          const r = el.getBoundingClientRect();
          pts.push({
            x: r.left - base.left + r.width / 2 + off,
            t: r.top - base.top - 6,
            b: r.bottom - base.top + 6,
          });
        });
        if (pts.length < 2) return;
        let d = "";
        for (let k = 1; k < pts.length; k++) {
          const a = pts[k - 1],
            b = pts[k],
            dy = (b.t - a.b) / 2;
          d += `M${a.x},${a.b} C${a.x},${a.b + dy} ${b.x},${b.t - dy} ${b.x},${b.t} `;
        }
        const col = `var(${OPT_VARS[i]})`;
        const dur = Math.max(3, pts.length * 0.8).toFixed(1);
        out +=
          `<path class="halo" d="${d}" stroke="${col}"></path><path d="${d}" stroke="${col}"></path>` +
          `<circle class="runner" r="5.5" fill="${col}"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"></animateMotion></circle>`;
      });
      svg.innerHTML = out;
    }
    if ("ResizeObserver" in window) {
      const ro = new ResizeObserver(() => requestAnimationFrame(drawPaths));
      ro.observe($("line"));
      ro.observe($("vline"));
    }
    window.addEventListener("resize", () => requestAnimationFrame(drawPaths));

    // ---------- Modals ----------
    function openModal(html, mount) {
      const ov = $("overlay");
      ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
      ov.hidden = false;
      mount && mount(ov.firstElementChild);
      const first = ov.querySelector(
        "input:not([disabled]), textarea, .modal-foot .primary",
      );
      first && first.focus();
    }
    function closeModal() {
      const ov = $("overlay");
      ov.hidden = true;
      ov.innerHTML = "";
    }
    $("overlay").addEventListener("click", (e) => {
      if (e.target.id === "overlay" || e.target.closest("[data-close]"))
        closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !$("overlay").hidden) closeModal();
    });

    function openConfig(n) {
      const c = S.cages[n];
      const locked = !!c;
      // Les cages 1 à 6 ont toujours 1 frette et 1 cannelure.
      const fixed = n <= 6;
      openModal(
        `
      <div class="modal-head"><h2>Cage ${n} · ${locked ? "Cylindre" : "Insérer un cylindre"}</h2><button class="x" data-close aria-label="Fermer">×</button></div>
      <form id="cfg">
        <div class="modal-body">
          <label class="field"><span class="label">Nom du cylindre</span><input id="cfg-name" required maxlength="40" value="${esc(c ? c.name : "")}" placeholder="ex. CYL-0412"></label>
          <label class="field"><span class="label">Diamètre du cylindre (mm)</span><input id="cfg-diam" type="number" inputmode="decimal" step="0.1" min="1" required value="${esc(c ? c.diameter : "")}" placeholder="ex. 420"></label>
          <div class="row2">
            <label class="field"><span class="label">Nombre de frettes</span><input id="cfg-fr" type="number" min="1" max="12" required value="${fixed ? 1 : c ? c.frettes : 1}" ${locked || fixed ? "disabled" : ""}></label>
            <label class="field"><span class="label">Cannelures par frette</span><input id="cfg-gpf" type="number" min="1" max="30" required value="${fixed ? 1 : c ? c.gpf : 6}" ${locked || fixed ? "disabled" : ""}></label>
          </div>
          <p class="note">${fixed ? "Les cages 1 à 6 ont toujours 1 frette et 1 cannelure." : locked ? "Le nombre de frettes et de cannelures est fixé à la création du cylindre." : "Attention : le nombre de frettes et de cannelures ne pourra plus être modifié après l'enregistrement."}</p>
        </div>
        <div class="modal-foot">
          ${locked ? `<button type="button" class="btn danger" id="cfg-reset">Tout remettre à neuf</button><button type="button" class="btn danger" id="cfg-remove">Retirer le cylindre</button><span class="spacer"></span>` : ""}
          <button type="button" class="btn" data-close>Annuler</button>
          <button type="submit" class="btn primary">Enregistrer</button>
        </div>
      </form>`,
        (m) => {
          m.querySelector("#cfg").addEventListener("submit", (e) => {
            e.preventDefault();
            const name = $("cfg-name").value.trim();
            const diameter = Number($("cfg-diam").value);
            if (!name || !(diameter > 0)) return;
            if (c) {
              c.name = name;
              c.diameter = diameter;
            } else {
              const frettes = Math.max(
                1,
                Math.min(12, parseInt($("cfg-fr").value, 10) || 1),
              );
              const gpf = Math.max(
                1,
                Math.min(30, parseInt($("cfg-gpf").value, 10) || 1),
              );
              S.cages[n] = fixed
                ? { name, diameter, frettes: 1, gpf: 1, grooves: {} }
                : { name, diameter, frettes, gpf, grooves: {} };
            }
            saveCage(n);
            closeModal();
            renderAll();
            toast(`Cage ${n} enregistrée.`);
          });
          const arm = (id, label, action) => {
            const b = m.querySelector(id);
            if (!b) return;
            b.addEventListener("click", () => {
              if (!b.classList.contains("armed")) {
                b.classList.add("armed");
                b.textContent = label;
                return;
              }
              action();
            });
          };
          arm("#cfg-reset", "Confirmer : tout à neuf", () => {
            c.grooves = {};
            saveCage(n);
            closeModal();
            renderAll();
            toast(`Cage ${n} : cannelures remises à neuf.`);
          });
          arm("#cfg-remove", "Confirmer le retrait", () => {
            delete S.cages[n];
            Object.values(S.config.paths).forEach((byOpt) =>
              Object.values(byOpt).forEach((p) => {
                delete p[n];
              }),
            );
            saveCage(n);
            saveConfig();
            closeModal();
            renderAll();
            toast(`Cylindre retiré de la cage ${n}.`);
          });
        },
      );
    }

    function openGroove(n, key) {
      const c = S.cages[n];
      const [f, g] = key.split("-").map(Number);
      const cur = Object.assign({ s: "new", c: "" }, grooveOf(n, key));
      let st = cur.s;
      openModal(
        `
      <div class="modal-head"><h2>Cage ${n} · F${f + 1} · C${g + 1}</h2><button class="x" data-close aria-label="Fermer">×</button></div>
      <form id="gf">
        <div class="modal-body">
          <p class="note">${esc(c.name)} · Ø ${esc(c.diameter)} mm</p>
          <div class="field"><span class="label">État</span><div class="states" id="gf-states">
            ${Object.entries(STATES)
              .map(
                ([k, l]) =>
                  `<button type="button" data-s="${k}" style="background:var(--${k})" aria-pressed="${k === st}">${l}</button>`,
              )
              .join("")}
          </div></div>
          <label class="field"><span class="label">Commentaire</span><textarea id="gf-c" maxlength="500" placeholder="ex. écaillage léger côté opérateur, à surveiller">${esc(cur.c)}</textarea></label>
        </div>
        <div class="modal-foot"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>
      </form>`,
        (m) => {
          m.querySelector("#gf-states").addEventListener("click", (e) => {
            const b = e.target.closest("[data-s]");
            if (!b) return;
            st = b.dataset.s;
            m.querySelectorAll("[data-s]").forEach((x) =>
              x.setAttribute("aria-pressed", String(x === b)),
            );
          });
          m.querySelector("#gf").addEventListener("submit", (e) => {
            e.preventDefault();
            const comment = $("gf-c").value.trim();
            c.grooves = c.grooves || {};
            if (st === "new" && !comment) delete c.grooves[key];
            else c.grooves[key] = comment ? { s: st, c: comment } : { s: st };
            saveCage(n);
            closeModal();
            renderAll();
          });
        },
      );
    }

    function procedureOf(n) {
      return (S.config.procedures && S.config.procedures[n]) || DEFAULT_PROC;
    }
    function openHS(n) {
      const custom = !!(S.config.procedures && S.config.procedures[n]);
      const c = S.cages[n];
      const p = [0, 1, 2].map((i) => pathFor(i)[n]);
      const view = () => `
      <div class="modal-head hs"><h2>Cage ${n} HS · Procédure</h2><button class="x" data-close aria-label="Fermer">×</button></div>
      <div class="modal-body">
        ${custom ? "" : `<span class="tag">Procédure type · à adapter à votre site</span>`}
        <ol class="proc">${procedureOf(n)
          .split("\n")
          .map((l) => l.trim())
          .filter(Boolean)
          .map((l) => `<li><span>${esc(l)}</span></li>`)
          .join("")}</ol>
        ${
          c
            ? `<div class="field"><span class="label">Cannelures de secours prévues</span><div class="warnings">${S.config.options
                .map((o, i) => {
                  if (!validKey(n, p[i]))
                    return `<span class="note">${esc(o.name)} : aucune cannelure affectée</span>`;
                  const [f, g] = p[i].split("-").map(Number),
                    s = grooveOf(n, p[i]).s;
                  return `<span style="color:var(${OPT_VARS[i]});font-weight:600">${esc(o.name)} : F${f + 1} · C${g + 1} <span class="note">(${STATES[s]})</span></span>`;
                })
                .join("")}</div></div>`
            : ""
        }
      </div>
      <div class="modal-foot"><button type="button" class="btn" id="hs-edit">Modifier la procédure</button><span class="spacer"></span><button type="button" class="btn primary" data-close>Fermer</button></div>`;
      openModal(view(), (m) => {
        m.querySelector("#hs-edit").addEventListener("click", () => {
          m.innerHTML = `
          <div class="modal-head hs"><h2>Cage ${n} · Modifier la procédure</h2><button class="x" data-close aria-label="Fermer">×</button></div>
          <form id="hsf"><div class="modal-body">
            <label class="field"><span class="label">Une étape par ligne</span><textarea id="hs-text" style="min-height:220px">${esc(procedureOf(n))}</textarea></label>
            <p class="note">Laissez vide pour revenir à la procédure type.</p>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>`;
          $("hs-text").focus();
          m.querySelector("#hsf").addEventListener("submit", (e) => {
            e.preventDefault();
            const t = $("hs-text").value.trim();
            S.config.procedures = S.config.procedures || {};
            if (t && t !== DEFAULT_PROC) S.config.procedures[n] = t;
            else delete S.config.procedures[n];
            saveConfig();
            closeModal();
            toast(`Procédure de la cage ${n} enregistrée.`);
          });
        });
      });
    }

    // ---------- Events ----------
    $("bar").addEventListener("click", (e) => {
      const t = e.target.closest("[data-tab]");
      if (t) {
        S.tab = t.dataset.tab;
        try {
          localStorage.setItem("laminoir-tab", S.tab);
        } catch (err) {}
        renderAll();
        return;
      }
      const d = e.target.closest("[data-diam]");
      if (d) {
        S.diam = Number(d.dataset.diam);
        try {
          localStorage.setItem("laminoir-diam", String(S.diam));
        } catch (err) {}
        renderAll();
        return;
      }
      const m = e.target.closest("[data-mode]");
      if (m) {
        S.mode = m.dataset.mode;
        syncToolbar();
        return;
      }
      const eye = e.target.closest("[data-eye]");
      if (eye) {
        const i = +eye.dataset.eye;
        S.show[i] = !S.show[i];
        eye.setAttribute("aria-pressed", String(S.show[i]));
        drawPaths();
      }
    });
    $("tools").addEventListener("change", (e) => {
      const m = e.target.id && e.target.id.match(/^opt-name-(\d)$/);
      if (!m) return;
      const v = e.target.value.trim() || `Option ${+m[1] + 1}`;
      e.target.value = v;
      S.config.options[+m[1]].name = v;
      saveConfig();
      syncToolbar();
    });
    $("tools").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.matches("input")) e.target.blur();
    });

    // Visualisation: HS opens the procedure, a groove opens its state and comment.
    $("vline").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      const n = Number(b.dataset.cage);
      if (b.dataset.act === "hs") return openHS(n);
      if (b.dataset.act === "g") return openGroove(n, b.dataset.g);
    });

    $("line").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      const n = Number(b.dataset.cage),
        act = b.dataset.act;
      if (act === "hs") return openHS(n);
      if (act === "config") return openConfig(n);
      if (act !== "g") return;
      const key = b.dataset.g,
        c = S.cages[n];
      if (S.mode === "note") return openGroove(n, key);
      if (S.mode === "state") {
        const cur = grooveOf(n, key);
        const next = Object.assign({}, cur, { s: NEXT[cur.s] });
        c.grooves = c.grooves || {};
        if (next.s === "new" && !next.c) delete c.grooves[key];
        else c.grooves[key] = next;
        saveCage(n);
        renderAll();
        return;
      }
      const i = +S.mode[1],
        p = pathFor(i);
      if (p[n] === key) delete p[n];
      else p[n] = key;
      saveConfig();
      renderAll();
    });

    let toastTimer;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.hidden = true;
      }, 2600);
    }

    init();
  })();
</script>
