<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9690"/>
      <stop offset="1" stop-color="#2f6964"/>
    </linearGradient>
    <linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="484" y2="0">
      <stop offset="0" stop-color="#f6b23f"/>
      <stop offset="0.55" stop-color="#ee7a2c"/>
      <stop offset="1" stop-color="#d9442b"/>
    </linearGradient>
    <radialGradient id="roll" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e3ebea"/>
      <stop offset="1" stop-color="#b7c7c5"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- barre chaude : épaisse à l'entrée, amincie après les cylindres -->
  <path d="M28 214 H256 V298 H28 Z" fill="url(#hot)"/>
  <path d="M256 236 H484 V276 H256 Z" fill="url(#hot)"/>
  <!-- cylindres de laminage -->
  <g stroke="#245653" stroke-width="10">
    <circle cx="256" cy="140" r="96" fill="url(#roll)"/>
    <circle cx="256" cy="372" r="96" fill="url(#roll)"/>
  </g>
  <g fill="#2f6964">
    <circle cx="256" cy="140" r="30"/>
    <circle cx="256" cy="372" r="30"/>
  </g>
  <g fill="#9ccbc6">
    <circle cx="256" cy="140" r="11"/>
    <circle cx="256" cy="372" r="11"/>
  </g>
  <!-- sens de rotation -->
  <g fill="none" stroke="#2f6964" stroke-width="9" stroke-linecap="round" opacity="0.55">
    <path d="M190 104 A72 72 0 0 1 300 84"/>
    <path d="M322 408 A72 72 0 0 1 212 428"/>
  </g>
</svg>
