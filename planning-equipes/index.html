    <script>
      (() => {
        "use strict";

        /* ---------- Constantes ---------- */
        const TEAMS = ["A", "B", "C", "D"];
        // Remplaçants : renforts de production sans cycle, appelés sur les absences des équipes.
        const POOL = "REMP";
        const GROUPS = [...TEAMS, POOL];
        const groupName = (g) => (g === POOL ? "Remplaçants" : "Équipe " + g);
        const groupShort = (g) => (g === POOL ? "Remplaçant" : "Équipe " + g);
        const SHIFT = { J: "Jour 8h–20h", N: "Nuit 20h–8h", R: "Repos" };
        const ABS = {
          CP: "Congé payé",
          RCR: "RCR/RCE",
          MAL: "Maladie",
          FOR: "Formation",
          ANA: "Absence non autorisée (ABS NA)",
        };
        // Anciens codes enregistrés avant le changement de liste.
        const LEGACY = { RTT: "RCR", ABS: "FOR" };
        // Remet les anciens codes d'un document mois aux codes actuels (en mémoire ; sauvegardé à la prochaine écriture).
        function normMonth(d) {
          if (!d || !d.j) return d;
          for (const id in d.j)
            for (const ds in d.j[id]) {
              const e = d.j[id][ds];
              if (e && LEGACY[e.c]) e.c = LEGACY[e.c];
              if (e && e.pa && LEGACY[e.pa.m]) e.pa.m = LEGACY[e.pa.m];
            }
          return d;
        }
        const LABEL = { ...SHIFT, ...ABS };
        const DEFAULT_CYCLE = {
          pattern: "RJJJRRRRRRRNNNRRRRJJJRNNNRRR".split(""),
          ref: "2026-01-05",
          offsets: { A: 0, B: 7, C: 14, D: 21 },
          target: 11,
          nightSplit: false,
          maxWeek: 48,
        };
        const DOW = ["D", "L", "M", "M", "J", "V", "S"];
        const MONTHS = [
          "janvier",
          "février",
          "mars",
          "avril",
          "mai",
          "juin",
          "juillet",
          "août",
          "septembre",
          "octobre",
          "novembre",
          "décembre",
        ];
        const DAYS_LONG = [
          "dimanche",
          "lundi",
          "mardi",
          "mercredi",
          "jeudi",
          "vendredi",
          "samedi",
        ];

        /* ---------- Dates (en jours UTC, sans fuseau) ---------- */
        const DAY = 864e5;
        const dnum = (ds) => {
          const [y, m, d] = ds.split("-").map(Number);
          return Math.round(Date.UTC(y, m - 1, d) / DAY);
        };
        const dstr = (n) => new Date(n * DAY).toISOString().slice(0, 10);
        const addDays = (ds, k) => dstr(dnum(ds) + k);
        const dow = (ds) => new Date(dnum(ds) * DAY).getUTCDay();
        const ymOf = (ds) => ds.slice(0, 7);
        const ymAdd = (ym, k) => {
          let [y, m] = ym.split("-").map(Number);
          m += k;
          while (m > 12) {
            m -= 12;
            y++;
          }
          while (m < 1) {
            m += 12;
            y--;
          }
          return `${y}-${String(m).padStart(2, "0")}`;
        };
        const daysIn = (ym) => {
          const [y, m] = ym.split("-").map(Number);
          return new Date(Date.UTC(y, m, 0)).getUTCDate();
        };
        const monthDays = (ym) =>
          Array.from(
            { length: daysIn(ym) },
            (_, i) => `${ym}-${String(i + 1).padStart(2, "0")}`,
          );
        const mondayOf = (ds) => addDays(ds, -((dow(ds) + 6) % 7));
        const isoWeek = (ds) => {
          const thu = addDays(mondayOf(ds), 3);
          return (
            1 + Math.floor((dnum(thu) - dnum(`${thu.slice(0, 4)}-01-01`)) / 7)
          );
        };
        const todayStr = () => {
          const t = new Date();
          return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
        };
        const fmtShort = (ds) => `${ds.slice(8)}/${ds.slice(5, 7)}`;
        const fmtLong = (ds) =>
          `${DAYS_LONG[dow(ds)]} ${Number(ds.slice(8))} ${MONTHS[Number(ds.slice(5, 7)) - 1]} ${ds.slice(0, 4)}`;
        const mod = (a, n) => ((a % n) + n) % n;

        /* ---------- Utilitaires ---------- */
        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const clone = (o) => JSON.parse(JSON.stringify(o ?? {}));
        const $ = (s, el = document) => el.querySelector(s);
        const fullName = (a) =>
          a
            ? `${(a.nom || "").toUpperCase()} ${a.prenom || ""}`.trim() ||
              "Agent sans nom"
            : "Agent supprimé";
        const LS_UI = "planning-equipes-ui";
        const uiGet = () => {
          try {
            return JSON.parse(localStorage.getItem(LS_UI)) || {};
          } catch {
            return {};
          }
        };
        const uiSet = (patch) => {
          try {
            localStorage.setItem(
              LS_UI,
              JSON.stringify({ ...uiGet(), ...patch }),
            );
          } catch {}
        };
        let toastT;
        function toast(msg) {
          const t = $("#toast");
          t.textContent = msg;
          t.hidden = false;
          clearTimeout(toastT);
          toastT = setTimeout(() => (t.hidden = true), 2600);
        }

        /* ---------- Stockage : base partagée de l'artefact, sinon navigateur ---------- */
        function localStore() {
          const KEY = "planning-equipes-data-v1";
          let data;
          try {
            data = JSON.parse(localStorage.getItem(KEY)) || {};
          } catch {
            data = {};
          }
          const subs = new Set();
          const persist = () => {
            try {
              localStorage.setItem(KEY, JSON.stringify(data));
            } catch {}
            setTimeout(() => subs.forEach((f) => f()), 0);
          };
          return {
            kind: "local",
            newId: () => Math.random().toString(36).slice(2, 12),
            watchCol(col, cb) {
              const f = () =>
                cb(
                  Object.keys(data)
                    .filter(
                      (p) =>
                        p.startsWith(col + "/") && p.split("/").length === 2,
                    )
                    .map((p) => ({ id: p.split("/")[1], ...data[p] })),
                );
              subs.add(f);
              f();
              return () => subs.delete(f);
            },
            watchDoc(path, cb) {
              const f = () => cb(data[path] || null);
              subs.add(f);
              f();
              return () => subs.delete(f);
            },
            async get(path) {
              return data[path] || null;
            },
            async set(path, v) {
              data[path] = clone(v);
              persist();
            },
            async del(path) {
              delete data[path];
              persist();
            },
          };
        }
        function dbStore(db) {
          const queues = {};
          const queue = (path, fn) =>
            (queues[path] = (queues[path] || Promise.resolve())
              .then(fn)
              .catch((e) => {
                if (e && e.code === "invalid_argument") {
                  S.canWrite = false;
                  render();
                  toast("Modification refusée : accès en lecture seule.");
                } else if (e && e.code === "quota_exceeded")
                  toast(
                    "La base est pleine : supprimez des données anciennes.",
                  );
                else toast("Enregistrement impossible, réessayez.");
              }));
          const onErr = () =>
            toast("Synchronisation interrompue. Rechargez la page.");
          return {
            kind: "db",
            newId: () => db.collection("agents").doc().id,
            watchCol: (col, cb) =>
              db
                .collection(col)
                .onSnapshot(
                  (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
                  onErr,
                ),
            watchDoc: (path, cb) =>
              db
                .doc(path)
                .onSnapshot((s) => cb(s.exists ? s.data() : null), onErr),
            async get(path) {
              const s = await db.doc(path).get();
              return s.exists ? s.data() : null;
            },
            set: (path, v) => queue(path, () => db.doc(path).set(v)),
            del: (path) => queue(path, () => db.doc(path).delete()),
          };
        }

        /* ---------- Fichier JSON partagé (version autonome, Chrome ou Edge) ---------- */
        // Structure du fichier : { application, format, revision, modifie_le, modifie_par,
        // verrou: {par, session, depuis, actif} | null, cycle, agents: {id: agent}, mois: {"AAAA-MM": mois} }
        const FILE_FORMAT = 1;
        const LOCK_STALE_MS = 15 * 60 * 1000; // verrou abandonné après 15 min sans signe de vie
        const HEARTBEAT_MS = 4 * 60 * 1000;
        const POLL_MS = 30 * 1000;
        const BACKUP_NAME = "planning-data-sauvegarde.json";
        const backupKey = (h) => "sauvegarde:" + (h && h.name ? h.name : "");
        const SESSION = Math.random().toString(36).slice(2, 10);
        const FS_OK = typeof window.showOpenFilePicker === "function";
        const emptyFile = () => ({
          application: "planning-equipes",
          format: FILE_FORMAT,
          revision: 0,
          modifie_le: null,
          modifie_par: null,
          verrou: null,
          cycle: null,
          agents: {},
          mois: {},
        });
        function normalizeFile(o) {
          if (
            !o ||
            typeof o !== "object" ||
            o.application !== "planning-equipes"
          )
            throw new Error(
              "Ce fichier n'est pas une base de planning des équipes.",
            );
          return {
            ...emptyFile(),
            ...o,
            agents: o.agents || {},
            mois: o.mois || {},
          };
        }
        // Chemins de l'application <-> emplacements dans le fichier.
        function fileSlot(data, path) {
          const [col, id] = path.split("/");
          if (col === "config" && id === "cycle") return [data, "cycle"];
          if (col === "agents") return [data.agents, id];
          if (col === "mois") return [data.mois, id];
          return [null, null];
        }
        const lockAlive = (v) =>
          v && v.actif && Date.now() - Date.parse(v.actif) < LOCK_STALE_MS;
        const fmtTime = (iso) => {
          const d = new Date(iso);
          return `${d.toLocaleDateString("fr-FR")} à ${d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`;
        };

        // Mémorise le dernier fichier ouvert (IndexedDB) pour le rouvrir en un clic.
        function idb(mode, value, key = "fichier") {
          return new Promise((resolve) => {
            try {
              const rq = indexedDB.open("planning-equipes", 1);
              rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
              rq.onerror = () => resolve(null);
              rq.onsuccess = () => {
                try {
                  const tr = rq.result.transaction(
                    "kv",
                    mode === "get" ? "readonly" : "readwrite",
                  );
                  const st = tr.objectStore("kv");
                  const r = mode === "get" ? st.get(key) : st.put(value, key);
                  r.onsuccess = () =>
                    resolve(mode === "get" ? r.result || null : true);
                  r.onerror = () => resolve(null);
                } catch {
                  resolve(null);
                }
              };
            } catch {
              resolve(null);
            }
          });
        }

        function fileStore(handle, initial, me, writable) {
          let data = initial;
          let known = data.revision || 0;
          let lastMod = 0;
          let saving = Promise.resolve();
          let timer = null;
          let skipCheck = false;
          let lastWrite = 0;
          const subs = new Set();
          const notify = () => setTimeout(() => subs.forEach((f) => f()), 0);
          const st = {
            kind: "file",
            handle,
            me,
            writable,
            status: "",
            get data() {
              return data;
            },
            newId: () => Math.random().toString(36).slice(2, 12),
            watchCol(col, cb) {
              const f = () =>
                cb(
                  Object.entries(col === "agents" ? data.agents : {}).map(
                    ([id, v]) => ({ id, ...v }),
                  ),
                );
              subs.add(f);
              f();
              return () => subs.delete(f);
            },
            watchDoc(path, cb) {
              const f = () => {
                const [o, k] = fileSlot(data, path);
                cb((o && o[k]) || null);
              };
              subs.add(f);
              f();
              return () => subs.delete(f);
            },
            async get(path) {
              const [o, k] = fileSlot(data, path);
              return (o && o[k]) || null;
            },
            async set(path, v) {
              if (!st.writable) throw { code: "invalid_argument" };
              const [o, k] = fileSlot(data, path);
              if (!o) return;
              o[k] = clone(v);
              notify();
              schedule();
            },
            async del(path) {
              if (!st.writable) throw { code: "invalid_argument" };
              const [o, k] = fileSlot(data, path);
              if (o) delete o[k];
              notify();
              schedule();
            },
            save: () => (saving = saving.then(writeNow)),
            async release() {
              if (!st.writable) return;
              clearTimeout(timer);
              if (data.verrou && data.verrou.session === SESSION)
                data.verrou = null;
              await (saving = saving.then(() => writeNow(true)));
              st.writable = false;
            },
            async takeOver(fresh) {
              if (!fresh) {
                const cur = await readFile();
                data = cur;
                known = cur.revision || 0;
              }
              skipCheck = true;
              data.verrou = {
                par: me,
                session: SESSION,
                depuis: new Date().toISOString(),
                actif: new Date().toISOString(),
              };
              st.writable = true;
              notify();
              await st.save();
            },
            async refresh() {
              const f = await handle.getFile();
              if (f.lastModified === lastMod) return false;
              lastMod = f.lastModified;
              data = normalizeFile(JSON.parse(await f.text()));
              known = data.revision || 0;
              notify();
              return true;
            },
          };
          async function readFile() {
            const f = await handle.getFile();
            lastMod = f.lastModified;
            const txt = await f.text();
            return txt.trim() ? normalizeFile(JSON.parse(txt)) : emptyFile();
          }
          let dirty = false;
          function schedule() {
            dirty = true;
            clearTimeout(timer);
            st.status = "Enregistrement…";
            fileBanner();
            timer = setTimeout(() => st.save(), 400);
          }
          async function writeNow(releasing) {
            if (!st.writable) return;
            try {
              // Quelqu'un d'autre a-t-il écrit depuis notre dernière lecture ?
              const cur = await readFile();
              const mine = cur.verrou && cur.verrou.session === SESSION;
              const check = !skipCheck;
              skipCheck = false;
              if (
                check &&
                ((cur.revision || 0) !== known ||
                  (cur.verrou && !mine && lockAlive(cur.verrou)))
              ) {
                st.writable = false;
                S.canWrite = false;
                st.status = `Modifications non enregistrées : le fichier a été modifié par ${cur.modifie_par || cur.verrou?.par || "un autre utilisateur"}${cur.modifie_le ? " le " + fmtTime(cur.modifie_le) : ""}. Rechargez le fichier.`;
                st.conflict = true;
                fileBanner();
                render();
                return;
              }
              // Sauvegarde : la version actuelle du fichier (avant-dernière après cet enregistrement).
              // (uniquement quand les données changent, pas lors du simple maintien du verrou)
              if (dirty && st.backup && (cur.revision || 0) > 0) {
                try {
                  const bw = await st.backup.createWritable();
                  await bw.write(
                    JSON.stringify({ ...cur, verrou: null }, null, 1),
                  );
                  await bw.close();
                  st.backupAt = new Date();
                  st.backupErr = "";
                } catch (e) {
                  st.backupErr =
                    "Sauvegarde impossible : " +
                    (e && e.message ? e.message : "accès refusé");
                }
              }
              dirty = false;
              const now = new Date().toISOString();
              data.revision = known + 1;
              data.modifie_le = now;
              data.modifie_par = me;
              if (!releasing)
                data.verrou = {
                  ...(data.verrou || {
                    par: me,
                    session: SESSION,
                    depuis: now,
                  }),
                  actif: now,
                };
              const w = await handle.createWritable();
              await w.write(JSON.stringify(data, null, 1));
              await w.close();
              known = data.revision;
              lastWrite = Date.now();
              lastMod = (await handle.getFile()).lastModified;
              st.status = `Enregistré à ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`;
            } catch (e) {
              st.status =
                "Échec de l'enregistrement dans le fichier : " +
                (e && e.message ? e.message : "accès refusé") +
                ". Vos dernières modifications ne sont pas sauvegardées.";
            }
            fileBanner();
          }
          // Écriture : signe de vie régulier pour garder le verrou. Lecture seule : relit le fichier.
          setInterval(() => {
            if (st.conflict) return;
            if (st.writable) {
              if (Date.now() - lastWrite > HEARTBEAT_MS) st.save();
            } else
              st.refresh()
                .then((ch) => ch && fileBanner())
                .catch(() => {});
          }, POLL_MS);
          addEventListener("pagehide", () => {
            if (st.writable && data.verrou && data.verrou.session === SESSION)
              st.release();
          });
          return st;
        }

        // Ouvre un fichier : vérifie le verrou, puis le prend si possible.
        async function openFile(handle, { force = false, create = null } = {}) {
          const me = S.me;
          const perm = async (mode) => {
            if (!handle.queryPermission) return true;
            if ((await handle.queryPermission({ mode })) === "granted")
              return true;
            return (await handle.requestPermission({ mode })) === "granted";
          };
          if (!(await perm("read")))
            throw new Error("Accès au fichier refusé.");
          let data;
          if (create) data = create;
          else {
            const f = await handle.getFile();
            const txt = await f.text();
            data = txt.trim() ? normalizeFile(JSON.parse(txt)) : emptyFile();
          }
          const v = data.verrou;
          const busy = v && v.par !== me && lockAlive(v) && !force;
          let writable = !busy && (await perm("readwrite"));
          const st = fileStore(handle, data, me, false);
          if (writable) await st.takeOver(!!create);
          await idb("put", handle);
          const bh = await idb("get", null, backupKey(handle));
          if (bh) {
            try {
              if (
                !bh.queryPermission ||
                (await bh.queryPermission({ mode: "readwrite" })) === "granted"
              )
                st.backup = bh;
              else st.backupPending = bh;
            } catch {
              st.backupPending = bh;
            }
          }
          return { st, busy: busy ? v : null, writable };
        }

        function fileBanner() {
          const b = $("#banner");
          const st = S.store;
          if (!st || st.kind !== "file") return;
          b.hidden = false;
          const name = esc(st.handle.name || "fichier");
          const d = st.data;
          if (st.writable) {
            const hm = (d) =>
              d.toLocaleTimeString("fr-FR", {
                hour: "2-digit",
                minute: "2-digit",
              });
            const bk = st.backupErr
              ? `<span class="over">${esc(st.backupErr)}</span> <button class="btn sm" data-act="fbackup">Choisir le fichier de sauvegarde</button>`
              : st.backup
                ? `<span class="muted">Sauvegarde de la version précédente : ${esc(st.backup.name)}${st.backupAt ? ` (mise à jour à ${hm(st.backupAt)})` : ""}</span>`
                : st.backupPending
                  ? `<span class="over">Sauvegarde en pause.</span> <button class="btn sm primary" data-act="fbackup">Réactiver la sauvegarde</button>`
                  : `<span class="over">Aucune sauvegarde.</span> <button class="btn sm primary" data-act="fbackup">Activer la sauvegarde (${BACKUP_NAME})</button>`;
            b.innerHTML = `<div class="filebar"><span><b>${name}</b> · ouvert par vous (${esc(st.me)}) · les autres utilisateurs le voient en lecture seule · <span class="muted">${esc(st.status || "")}</span></span><button class="btn sm" data-act="fclose">Fermer et libérer le fichier</button></div><div class="filebar" style="margin-top:6px;justify-content:flex-start">${bk}</div>`;
          } else if (st.conflict) {
            b.innerHTML = `<div class="filebar warnbar"><span>${esc(st.status)}</span><button class="btn sm primary" data-act="freload">Recharger le fichier</button></div>`;
          } else {
            const v = d.verrou;
            const who =
              v && lockAlive(v)
                ? `utilisé par <b>${esc(v.par)}</b> depuis le ${fmtTime(v.depuis)}`
                : "libre";
            b.innerHTML = `<div class="filebar warnbar"><span><b>${name}</b> · lecture seule · fichier ${who}${d.modifie_le ? ` · dernière modification par ${esc(d.modifie_par || "?")} le ${fmtTime(d.modifie_le)}` : ""}. L'affichage se met à jour tout seul.</span>${
              S.forceAsk
                ? `<span class="confirm">Prendre la main ? Les modifications en cours de ${esc(v?.par || "l'autre utilisateur")} non enregistrées seront perdues.<button class="btn sm danger" data-act="fforce">Oui, prendre la main</button><button class="btn sm" data-act="fforceno">Non</button></span>`
                : st.handle.createWritable
                  ? `<button class="btn sm primary" data-act="ftake">${v && lockAlive(v) ? "Prendre la main" : "Modifier le planning"}</button>`
                  : ""
            }</div>`;
          }
        }

        function viewConnect() {
          const me = esc(S.me || "");
          const last = S.lastHandle;
          return `<div class="panel connect">
        <h2>Ouvrir la base du planning</h2>
        <p>Le planning est enregistré dans un fichier <b>.json</b> placé dans un dossier partagé (lecteur réseau, OneDrive, SharePoint…). Une seule personne à la fois peut le modifier ; les autres le consultent en lecture seule et peuvent reprendre la main quand il est libéré.</p>
        <label class="field">Votre nom (affiché aux autres utilisateurs)<input type="text" id="me-name" value="${me}" placeholder="ex. Thomas D." autocomplete="name"></label>
        ${
          FS_OK
            ? `<div class="choices">
          ${last ? `<button class="btn primary" data-act="freopen">Rouvrir « ${esc(last.name)} »</button>` : ""}
          <button class="btn ${last ? "" : "primary"}" data-act="fopen">Ouvrir un fichier de planning…</button>
          <button class="btn" data-act="fnew">Créer un nouveau fichier…</button>
        </div>
        <p class="note">« Créer un nouveau fichier » reprend les données déjà saisies dans ce navigateur, s'il y en a. À chaque enregistrement, la version précédente est copiée dans <b>${BACKUP_NAME}</b> (à activer une fois, dans le même dossier). Pour revenir en arrière, ouvrez ce fichier de sauvegarde.</p>`
            : `<p class="banner">Ce navigateur ne sait pas enregistrer directement dans un fichier. Utilisez <b>Google Chrome</b> ou <b>Microsoft Edge</b> sur ordinateur pour modifier le planning. Ici, vous pouvez seulement le consulter.</p>
        <div class="choices"><label class="btn">Consulter un fichier de planning…<input type="file" id="ro-file" accept=".json,application/json" hidden></label></div>`
        }
        <p class="note">Sans fichier, vous pouvez aussi <button class="linkbtn" data-act="flocal">travailler dans ce navigateur uniquement</button> (données non partagées).</p>
        ${S.connectErr ? `<p class="over">${esc(S.connectErr)}</p>` : ""}
      </div>`;
        }

        async function fileAction(act) {
          const nameEl = $("#me-name");
          if (nameEl) {
            S.me = nameEl.value.trim();
            uiSet({ me: S.me });
          }
          S.connectErr = "";
          try {
            if (act === "fclose") {
              await S.store.release();
              location.reload();
              return;
            }
            if (act === "freload") {
              location.reload();
              return;
            }
            if (act === "fbackup") {
              const st = S.store;
              let bh = null;
              if (st.backupPending && !st.backupErr) {
                const p = st.backupPending.requestPermission
                  ? await st.backupPending.requestPermission({
                      mode: "readwrite",
                    })
                  : "granted";
                if (p === "granted") bh = st.backupPending;
              }
              if (!bh) {
                const opts = {
                  suggestedName: BACKUP_NAME,
                  types: [
                    {
                      description: "Sauvegarde du planning (JSON)",
                      accept: { "application/json": [".json"] },
                    },
                  ],
                };
                try {
                  bh = await showSaveFilePicker({
                    ...opts,
                    startIn: st.handle,
                  });
                } catch (e) {
                  if (e && e.name === "AbortError") throw e;
                  bh = await showSaveFilePicker(opts);
                }
              }
              if (await bh.isSameEntry?.(st.handle))
                throw new Error(
                  "La sauvegarde doit être un autre fichier que le planning.",
                );
              st.backup = bh;
              st.backupPending = null;
              st.backupErr = "";
              await idb("put", bh, backupKey(st.handle));
              // Première copie : l'état actuel du fichier sur le disque.
              const f = await st.handle.getFile();
              const txt = await f.text();
              if (txt.trim()) {
                const cur = normalizeFile(JSON.parse(txt));
                const bw = await bh.createWritable();
                await bw.write(
                  JSON.stringify({ ...cur, verrou: null }, null, 1),
                );
                await bw.close();
                st.backupAt = new Date();
              }
              toast("Sauvegarde activée : " + bh.name);
              fileBanner();
              return;
            }
            if (act === "fforceno") {
              S.forceAsk = false;
              fileBanner();
              return;
            }
            if (act === "ftake" || act === "fforce") {
              const st = S.store;
              await st.refresh().catch(() => {});
              const v = st.data.verrou;
              if (act === "ftake" && v && v.par !== S.me && lockAlive(v)) {
                S.forceAsk = true;
                fileBanner();
                return;
              }
              S.forceAsk = false;
              if (
                st.handle.requestPermission &&
                (await st.handle.requestPermission({ mode: "readwrite" })) !==
                  "granted"
              )
                throw new Error("Écriture dans le fichier refusée.");
              await st.takeOver();
              S.canWrite = true;
              fileBanner();
              render();
              return;
            }
            if (act === "flocal") {
              startStore(localStore());
              const b = $("#banner");
              b.hidden = false;
              b.textContent =
                "Données enregistrées dans ce navigateur uniquement (non partagées). Rechargez la page pour ouvrir un fichier de planning.";
              return;
            }
            if (!S.me) {
              S.connectErr =
                "Indiquez votre nom : il permet aux autres utilisateurs de savoir qui modifie le planning.";
              render();
              return;
            }
            let handle,
              create = null;
            if (act === "freopen") handle = S.lastHandle;
            if (act === "fopen")
              [handle] = await showOpenFilePicker({
                types: [
                  {
                    description: "Planning (JSON)",
                    accept: { "application/json": [".json"] },
                  },
                ],
              });
            if (act === "fnew") {
              handle = await showSaveFilePicker({
                suggestedName: "planning-data.json",
                types: [
                  {
                    description: "Planning (JSON)",
                    accept: { "application/json": [".json"] },
                  },
                ],
              });
              create = emptyFile();
              const loc = localStore();
              const agents = await new Promise((r) =>
                loc.watchCol("agents", r),
              );
              agents.forEach(({ id, ...a }) => (create.agents[id] = a));
              create.cycle = await loc.get("config/cycle");
              for (const k of Object.keys(
                localStorage.getItem("planning-equipes-data-v1")
                  ? JSON.parse(localStorage.getItem("planning-equipes-data-v1"))
                  : {},
              ))
                if (k.startsWith("mois/"))
                  create.mois[k.slice(5)] = await loc.get(k);
            }
            if (!handle) return;
            const { st, busy, writable } = await openFile(handle, { create });
            S.canWrite = writable;
            startStore(st);
            if (busy)
              toast(
                `Planning utilisé par ${busy.par} : ouverture en lecture seule.`,
              );
            fileBanner();
          } catch (e) {
            if (e && e.name === "AbortError") return;
            if (S.store) {
              toast(e && e.message ? e.message : "Opération impossible.");
              return;
            }
            S.connectErr =
              e && e.message ? e.message : "Impossible d'ouvrir le fichier.";
            render();
          }
        }

        /* ---------- État ---------- */
        const now = todayStr();
        const S = {
          store: null,
          ready: { agents: false, cycle: false },
          agents: [],
          cycle: clone(DEFAULT_CYCLE),
          months: {},
          monthSubs: {},
          ym: ymOf(now),
          tab: uiGet().tab || "planning",
          canWrite: true,
          drawer: null,
          pop: null,
          delAsk: null,
          cycleDraft: null,
        };

        /* ---------- Calcul du planning ---------- */
        let memo = new Map();
        const agentById = (id) => S.agents.find((a) => a.id === id);
        function cycleCode(team, ds) {
          if (team === POOL) return "R";
          const c = S.cycle,
            n = c.pattern.length || 1;
          return (
            c.pattern[
              mod(dnum(ds) - dnum(c.ref) - (Number(c.offsets?.[team]) || 0), n)
            ] || "R"
          );
        }
        const teamOverride = (team, ds) =>
          S.months[ymOf(ds)]?.eq?.[team]?.[ds] || null;
        const teamCode = (team, ds) =>
          teamOverride(team, ds) || cycleCode(team, ds);
        const entryOf = (id, ds) => S.months[ymOf(ds)]?.j?.[id]?.[ds] || null;
        const noteOf = (id, ds) => S.months[ymOf(ds)]?.n?.[id]?.[ds] || "";
        // « Non disponible » : l'agent a été contacté pour ce jour et a refusé.
        const ndOf = (id, ds) => !!S.months[ymOf(ds)]?.nd?.[id]?.[ds];
        function codeOf(a, ds) {
          const k = a.id + ds;
          if (memo.has(k)) return memo.get(k);
          const e = entryOf(a.id, ds);
          const v = (e && e.c) || teamCode(a.eq, ds);
          memo.set(k, v);
          return v;
        }
        const isWork = (c) => c === "J" || c === "N";
        // "08:30" -> 8.5 ; sur un poste de nuit, les heures après minuit sont ramenées à 24 h et plus.
        const toH = (hm) => {
          const [h, m] = String(hm || "")
            .split(":")
            .map(Number);
          return h + (m || 0) / 60;
        };
        function partialSpan(c, pa) {
          if (!pa || !isWork(c)) return null;
          let a = toH(pa.from),
            b = toH(pa.to);
          if (Number.isNaN(a) || Number.isNaN(b)) return null;
          if (c === "N") {
            if (a < 20) a += 24;
            if (b <= 20) b += 24;
          }
          return [a, b];
        }
        // Heures travaillées d'un poste : [le jour de prise de poste avant minuit, le lendemain].
        function shiftParts(c, pa) {
          if (!isWork(c)) return [0, 0];
          const sp = partialSpan(c, pa);
          const ov = (x, y) =>
            sp ? Math.max(0, Math.min(sp[1], y) - Math.max(sp[0], x)) : 0;
          return c === "J"
            ? [12 - ov(8, 20), 0]
            : [4 - ov(20, 24), 8 - ov(24, 32)];
        }
        const partialHours = (c, pa) => {
          if (!pa || !isWork(c)) return 0;
          const p = shiftParts(c, pa);
          return 12 - p[0] - p[1];
        };
        function hoursBetween(a, from, to) {
          const f = dnum(from),
            t = dnum(to);
          let h = 0;
          for (let n = f - 1; n <= t; n++) {
            const ds = dstr(n);
            const c = codeOf(a, ds);
            if (!isWork(c)) continue;
            const [p0, p1] = shiftParts(c, entryOf(a.id, ds)?.pa);
            if (S.cycle.nightSplit) {
              if (n >= f) h += p0;
              if (n + 1 <= t) h += p1;
            } else if (n >= f) h += p0 + p1;
          }
          return h;
        }
        const fmtH = (h) =>
          Number.isInteger(h)
            ? String(h)
            : (Math.round(h * 100) / 100).toString().replace(".", ",");
        // Heures réalisées : seuls les jours jusqu'à la veille comptent (les jours à venir ne sont pas faits).
        const lastDone = () => addDays(todayStr(), -1);
        const isDone = (ds) => ds <= lastDone();
        function doneHours(a, from, to) {
          const end = to < lastDone() ? to : lastDone();
          return end < from ? 0 : hoursBetween(a, from, end);
        }
        const weekHours = (a, ds) => {
          const m = mondayOf(ds);
          return doneHours(a, m, addDays(m, 6));
        };
        function needsCover(a, ds) {
          const e = entryOf(a.id, ds);
          return !!(e && ABS[e.c] && isWork(teamCode(a.eq, ds)) && !e.r);
        }
        // Ordre choisi par l'utilisateur dans chaque équipe (champ ord) ; le tri par nom ne sert
        // qu'aux fiches antérieures à ce champ, le temps de leur attribuer un rang.
        const ordOf = (a) => (Number.isFinite(a.ord) ? a.ord : Infinity);
        const sortedAgents = () =>
          [...S.agents].sort(
            (x, y) =>
              (x.eq || "").localeCompare(y.eq || "") ||
              ordOf(x) - ordOf(y) ||
              (x.nom || "").localeCompare(y.nom || "", "fr") ||
              (x.prenom || "").localeCompare(y.prenom || "", "fr") ||
              (x.mat || "").localeCompare(y.mat || ""),
          );

        const nextOrd = (team) =>
          S.agents
            .filter((a) => a.eq === team && Number.isFinite(a.ord))
            .reduce((m, a) => Math.max(m, a.ord + 1), 0);
        // Range l'agent `id` à la position `to` de son équipe et renumérote l'équipe.
        async function moveAgent(id, to) {
          const a = agentById(id);
          if (!a) return;
          const list = sortedAgents().filter((x) => x.eq === a.eq);
          const from = list.findIndex((x) => x.id === id);
          to = Math.max(0, Math.min(list.length - 1, to));
          if (from < 0 || from === to) return;
          list.splice(to, 0, ...list.splice(from, 1));
          await saveOrder(list);
        }
        async function saveOrder(list) {
          const changed = [];
          list.forEach((x, i) => {
            if (x.ord !== i) changed.push({ ...x, ord: i });
          });
          if (!changed.length) return;
          S.agents = S.agents.map(
            (x) => changed.find((c) => c.id === x.id) || x,
          );
          render();
          for (const { id, ...rest } of changed)
            await S.store.set("agents/" + id, rest);
        }
        // Fiches créées avant l'ordre manuel : on fige une seule fois leur ordre actuel.
        let ordMigrated = false;
        function migrateOrder() {
          if (
            ordMigrated ||
            !S.canWrite ||
            !S.agents.some((a) => !Number.isFinite(a.ord))
          )
            return;
          ordMigrated = true;
          const all = sortedAgents();
          setTimeout(
            () =>
              GROUPS.forEach((t) => saveOrder(all.filter((a) => a.eq === t))),
            0,
          );
        }

        /* ---------- Écritures groupées par mois ---------- */
        async function ensureMonths(yms) {
          for (const ym of yms)
            if (!(ym in S.months))
              S.months[ym] =
                normMonth(clone(await S.store.get("mois/" + ym))) || null;
        }
        function tx() {
          const work = {};
          const m = (ds) =>
            (work[ymOf(ds)] ??= clone(S.months[ymOf(ds)] || {}));
          return {
            entry: (id, ds) => m(ds).j?.[id]?.[ds] || null,
            put(id, ds, e) {
              const mm = m(ds);
              mm.j ??= {};
              if (e) (mm.j[id] ??= {})[ds] = e;
              else if (mm.j[id]) {
                delete mm.j[id][ds];
                if (!Object.keys(mm.j[id]).length) delete mm.j[id];
              }
            },
            nd(id, ds, v) {
              const mm = m(ds);
              mm.nd ??= {};
              if (v) (mm.nd[id] ??= {})[ds] = v;
              else if (mm.nd[id]) {
                delete mm.nd[id][ds];
                if (!Object.keys(mm.nd[id]).length) delete mm.nd[id];
              }
            },
            note(id, ds, v) {
              const mm = m(ds);
              mm.n ??= {};
              if (v) (mm.n[id] ??= {})[ds] = v;
              else if (mm.n[id]) {
                delete mm.n[id][ds];
                if (!Object.keys(mm.n[id]).length) delete mm.n[id];
              }
            },
            team(t, ds, v) {
              const mm = m(ds);
              mm.eq ??= {};
              if (v) (mm.eq[t] ??= {})[ds] = v;
              else if (mm.eq[t]) {
                delete mm.eq[t][ds];
                if (!Object.keys(mm.eq[t]).length) delete mm.eq[t];
              }
            },
            commit() {
              for (const ym in work) {
                S.months[ym] = work[ym];
                S.store.set("mois/" + ym, work[ym]);
              }
              render();
            },
          };
        }
        // Défait le lien de remplacement d'une entrée (côté absent ou côté remplaçant).
        function unlink(t, id, ds) {
          const e = t.entry(id, ds);
          if (!e) return;
          if (e.r) {
            const o = t.entry(e.r, ds);
            if (o && o.rp === id) t.put(e.r, ds, null);
          }
          if (e.rp) {
            const o = t.entry(e.rp, ds);
            if (o && o.r === id) {
              const { r, ...rest } = o;
              t.put(e.rp, ds, rest);
            }
          }
        }
        function setPartial(id, ds, pa) {
          const t = tx();
          const { pa: _old, ...rest } = t.entry(id, ds) || {};
          const next = pa ? { ...rest, pa } : rest;
          t.put(id, ds, Object.keys(next).length ? next : null);
          t.commit();
        }
        async function setShift(id, ds, code) {
          const t = tx();
          unlink(t, id, ds);
          t.put(id, ds, code ? { c: code } : null);
          t.commit();
        }
        async function setAbsence(id, from, to, code, onlyWork) {
          const a = agentById(id);
          if (!a) return;
          const days = [];
          for (let n = dnum(from); n <= dnum(to); n++) days.push(dstr(n));
          await ensureMonths([...new Set(days.map(ymOf))]);
          const t = tx();
          let k = 0;
          for (const ds of days) {
            if (onlyWork && !isWork(teamCode(a.eq, ds))) continue;
            unlink(t, id, ds);
            t.put(id, ds, { c: code });
            k++;
          }
          t.commit();
          toast(
            k
              ? `${LABEL[code]} posé sur ${k} jour${k > 1 ? "s" : ""}`
              : "Aucun jour travaillé sur cette période",
          );
        }
        async function assignRepl(absentId, days, replId) {
          const absent = agentById(absentId);
          const t = tx();
          for (const ds of days) {
            const e = t.entry(absentId, ds);
            if (!e || !ABS[e.c]) continue;
            if (e.r) {
              const o = t.entry(e.r, ds);
              if (o && o.rp === absentId) t.put(e.r, ds, null);
            }
            const shift = teamCode(absent.eq, ds);
            unlink(t, replId, ds);
            t.put(absentId, ds, { ...e, r: replId });
            t.put(replId, ds, { c: shift, rp: absentId });
          }
          t.commit();
          toast(
            `${fullName(agentById(replId))} remplace ${fullName(absent)} (${days.length} j)`,
          );
        }
        function removeRepl(absentId, ds) {
          const t = tx();
          const e = t.entry(absentId, ds);
          if (!e) return;
          if (e.r) {
            const o = t.entry(e.r, ds);
            if (o && o.rp === absentId) t.put(e.r, ds, null);
          }
          const { r, ...rest } = e;
          t.put(absentId, ds, rest);
          t.commit();
        }
        async function setNd(id, days, v) {
          await ensureMonths([...new Set(days.map(ymOf))]);
          const t = tx();
          for (const ds of days) t.nd(id, ds, v ? 1 : null);
          t.commit();
        }
        function setNote(id, ds, v) {
          const t = tx();
          t.note(id, ds, v);
          t.commit();
        }
        function setTeam(team, ds, v) {
          const t = tx();
          t.team(team, ds, v);
          t.commit();
        }

        /* ---------- Remplacement : candidats ---------- */
        function absenceBlock(a, ds) {
          // Jours travaillés consécutifs (selon le cycle) couverts par la même absence non remplacée.
          const e = entryOf(a.id, ds);
          if (!e || !ABS[e.c]) return [ds];
          const same = (d) => {
            const x = entryOf(a.id, d);
            return x && x.c === e.c && !x.r;
          };
          const days = [];
          for (let k = -40; k <= 40; k++) {
            const d = addDays(ds, k);
            if (isWork(teamCode(a.eq, d)) && same(d)) days.push(d);
          }
          // garder le bloc contigu (en ignorant les jours de repos) qui contient ds
          let i = days.indexOf(ds);
          if (i < 0) return [ds];
          let lo = i,
            hi = i;
          const contiguous = (d1, d2) => {
            for (let n = dnum(d1) + 1; n < dnum(d2); n++) {
              const d = dstr(n);
              if (isWork(teamCode(a.eq, d)) && !same(d)) return false;
            }
            return true;
          };
          while (lo > 0 && contiguous(days[lo - 1], days[lo])) lo--;
          while (hi < days.length - 1 && contiguous(days[hi], days[hi + 1]))
            hi++;
          return days.slice(lo, hi + 1);
        }
        function candidates(absent, days) {
          const out = [];
          for (const c of S.agents) {
            if (c.id === absent.id) continue;
            let ok = true;
            const flags = [];
            for (const ds of days) {
              const code = codeOf(c, ds);
              const e = entryOf(c.id, ds);
              if (code !== "R" || (e && e.c && e.c !== "R")) {
                ok = false;
                break;
              }
              const shift = teamCode(absent.eq, ds);
              const before = codeOf(c, addDays(ds, -1)),
                after = codeOf(c, addDays(ds, 1));
              if (shift === "J" && before === "N")
                flags.push(["bad", `sort de nuit le ${fmtShort(ds)}`]);
              if (shift === "N" && after === "J")
                flags.push([
                  "bad",
                  `travaille de jour le ${fmtShort(addDays(ds, 1))}`,
                ]);
            }
            if (!ok) continue;
            // Heures projetées par semaine touchée
            const weeks = [...new Set(days.map(mondayOf))];
            let worst = 0,
              worstNow = 0;
            for (const w of weeks) {
              const cur = hoursBetween(c, w, addDays(w, 6));
              const add = days.filter((d) => mondayOf(d) === w).length * 12;
              if (cur + add > worst) {
                worst = cur + add;
                worstNow = cur;
              }
            }
            if (worst > S.cycle.maxWeek)
              flags.push(["warn", `${fmtH(worst)} h sur la semaine`]);
            const ndDays = days.filter((d) => ndOf(c.id, d));
            if (ndDays.length)
              flags.unshift([
                "bad",
                `non disponible ${ndDays.length === days.length ? (days.length > 1 ? "sur toute la période" : "") : ndDays.map(fmtShort).join(", ")}`.trim(),
              ]);
            out.push({
              a: c,
              now: worstNow,
              after: worst,
              flags,
              nd: ndDays.length,
            });
          }
          out.sort(
            (x, y) =>
              !!x.nd - !!y.nd ||
              x.flags.some((f) => f[0] === "bad") -
                y.flags.some((f) => f[0] === "bad") ||
              (y.a.eq === POOL) - (x.a.eq === POOL) ||
              x.flags.length - y.flags.length ||
              x.after - y.after ||
              fullName(x.a).localeCompare(fullName(y.a), "fr"),
          );
          return out;
        }

        /* ---------- Rendu ---------- */
        function render() {
          memo = new Map();
          const [y, m] = S.ym.split("-").map(Number);
          $("#mlabel").textContent = `${MONTHS[m - 1]} ${y}`;
          document
            .querySelectorAll(".tab")
            .forEach((b) =>
              b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)),
            );
          $("#rot").textContent =
            `4 équipes · ${S.agents.filter((a) => a.eq !== POOL).length} agents · ${S.agents.filter((a) => a.eq === POOL).length} remplaçants · cycle ${S.cycle.pattern.length} j`;
          const v = $("#view");
          const fid = document.activeElement && document.activeElement.id;
          const scroll = $(".gridwrap")
            ? { l: $(".gridwrap").scrollLeft, t: $(".gridwrap").scrollTop }
            : null;
          if (S.connect && !S.store) {
            v.innerHTML = viewConnect();
            return;
          }
          if (!S.ready.agents || !S.ready.cycle) {
            v.innerHTML = `<div class="panel"><p class="muted">Chargement du planning…</p></div>`;
            return;
          }
          v.innerHTML =
            S.tab === "planning"
              ? viewPlanning()
              : S.tab === "heures"
                ? viewHours()
                : S.tab === "agents"
                  ? viewAgents()
                  : viewCycle();
          if (scroll && $(".gridwrap")) {
            $(".gridwrap").scrollLeft = scroll.l;
            $(".gridwrap").scrollTop = scroll.t;
          } else if (
            S.tab === "planning" &&
            $(".gridwrap") &&
            ymOf(now) === S.ym
          ) {
            const th = $(".dh.today");
            if (th)
              $(".gridwrap").scrollLeft = Math.max(0, th.offsetLeft - 260);
          }
          renderOverlay();
          refocus(fid);
        }

        // Rend le focus au champ en cours de saisie après un rafraîchissement (ids stables).
        function refocus(fid) {
          if (
            !fid ||
            (document.activeElement && document.activeElement.id === fid)
          )
            return;
          const el = document.getElementById(fid);
          if (el && typeof el.focus === "function")
            el.focus({ preventScroll: true });
        }

        function viewPlanning() {
          const days = monthDays(S.ym);
          const agents = sortedAgents();
          if (!agents.length) return emptyAgents();
          const head = days
            .map((ds) => {
              const w = dow(ds);
              return `<th class="dh${w === 0 || w === 6 ? " we" : ""}${w === 1 ? " wkstart" : ""}${ds === now ? " today" : ""}"><small>${DOW[w]}</small><b>${Number(ds.slice(8))}</b></th>`;
            })
            .join("");
          const wkrow = days
            .map((ds, i) => {
              const w = dow(ds);
              return w === 1 || i === 0
                ? `<th class="wkno${w === 1 ? " wkstart" : ""}" colspan="${Math.min(w === 1 ? 7 : (8 - w) % 7 || 7, days.length - i)}">S${isoWeek(ds)}</th>`
                : "";
            })
            .join("");
          const cls = (ds) => {
            const w = dow(ds);
            return `d${w === 0 || w === 6 ? " we" : ""}${w === 1 ? " wkstart" : ""}`;
          };
          let body = "";
          const todo = [];
          for (const t of GROUPS) {
            const list = agents.filter((a) => a.eq === t);
            if (t === POOL) {
              body += `<tr class="team pool"><th class="name">Remplaçants<small>${list.length ? `renfort production · ${list.length}` : "aucun : ajoutez-les dans l'onglet Agents"}</small></th>${days.map((ds) => `<td class="${cls(ds)}"></td>`).join("")}<td class="tot"></td></tr>`;
            } else
              body +=
                `<tr class="team"><th class="name">Équipe ${t}<small>${list.length} agent${list.length > 1 ? "s" : ""}</small></th>` +
                days
                  .map((ds) => {
                    const c = teamCode(t, ds),
                      o = teamOverride(t, ds);
                    return `<td class="${cls(ds)}"><button class="cell c c-${c}${o ? " ovr" : ""}" data-act="team" data-team="${t}" data-date="${ds}" title="Équipe ${t} · ${fmtShort(ds)} · ${LABEL[c]}${o ? " (modifié)" : ""}" ${S.canWrite ? "" : "disabled"}>${c === "R" ? "" : c}</button></td>`;
                  })
                  .join("") +
                `<td class="tot"></td></tr>`;
            for (const a of list) {
              body +=
                `<tr><th class="name" title="${a.fn ? esc(a.fn) + " · " : ""}${esc(a.mat)} ${esc(fullName(a))}">${a.fn ? `<span class="fn">${esc(a.fn)}</span>` : ""}<span class="mat">${esc(a.mat || "—")}</span>${esc(fullName(a))}</th>` +
                days
                  .map((ds) => {
                    const e = entryOf(a.id, ds),
                      c = codeOf(a, ds);
                    const need = needsCover(a, ds);
                    if (need) todo.push({ a, ds });
                    const k = ["cell", "c", "c-" + c];
                    if (a.eq === POOL) k.push("pool");
                    let tip = `${fullName(a)} · ${fmtShort(ds)} · ${a.eq === POOL && c === "R" ? "Disponible (sans poste)" : LABEL[c] || c}`;
                    if (e?.rp) {
                      k.push("rp");
                      tip += ` · remplace ${fullName(agentById(e.rp))}`;
                    } else if (
                      e &&
                      e.c &&
                      !ABS[e.c] &&
                      e.c !== teamCode(a.eq, ds)
                    )
                      k.push("ovr");
                    if (need) {
                      k.push("need");
                      tip += " · à remplacer";
                    }
                    if (e?.pa && isWork(c)) {
                      k.push("part");
                      tip += ` · ${ABS[e.pa.m] || "absence"} ${e.pa.from}–${e.pa.to} · ${fmtH(12 - partialHours(c, e.pa))} h travaillées`;
                    }
                    if (e?.r) {
                      k.push("cov");
                      tip += ` · remplacé par ${fullName(agentById(e.r))}`;
                    }
                    const nd = ndOf(a.id, ds);
                    if (nd) {
                      k.push("nd");
                      tip += " · contacté : NON disponible";
                    }
                    const nt = noteOf(a.id, ds);
                    if (nt) {
                      k.push("cmt");
                      tip += `\n💬 ${nt}`;
                    }
                    return `<td class="${cls(ds)}"><button class="${k.join(" ")}" data-act="cell" data-id="${a.id}" data-date="${ds}" title="${esc(tip)}">${c === "R" ? (nd ? "ND" : "") : c}</button></td>`;
                  })
                  .join("") +
                `<td class="tot" title="Prévu sur le mois : ${fmtH(hoursBetween(a, days[0], days[days.length - 1]))} h">${fmtH(doneHours(a, days[0], days[days.length - 1]))} h</td></tr>`;
            }
          }
          const staff = (code) =>
            `<tr class="staff"><th class="name">Effectif ${code === "J" ? "jour" : "nuit"} <small class="muted">/ ${S.cycle.target}</small></th>` +
            days
              .map((ds) => {
                const n = agents.filter((a) => codeOf(a, ds) === code).length;
                const k =
                  n < S.cycle.target
                    ? "low"
                    : n > S.cycle.target
                      ? "high"
                      : "ok";
                return `<td class="${cls(ds)}"><span class="staffn ${k}" title="${n} agent(s) en ${LABEL[code]} le ${fmtShort(ds)}">${n}</span></td>`;
              })
              .join("") +
            `<td class="tot"></td></tr>`;

          // Heures réalisées sur les postes de jour / de nuit commençant ce jour-là (absences partielles déduites).
          const shiftHours = (code, ds) =>
            agents.reduce((h, a) => {
              if (codeOf(a, ds) !== code) return h;
              const p = shiftParts(code, entryOf(a.id, ds)?.pa);
              return h + p[0] + p[1];
            }, 0);
          const hoursRow = (code) => {
            const vals = days.map((ds) =>
              isDone(ds) ? shiftHours(code, ds) : null,
            );
            const full = S.cycle.target * 12;
            return (
              `<tr class="staff hrs"><th class="name">Heures ${code === "J" ? "jour" : "nuit"} <small class="muted">/ ${full}</small></th>` +
              vals
                .map((h, i) => {
                  if (h === null)
                    return `<td class="${cls(days[i])}"><span class="staffn muted" title="Pas encore réalisé (prévu : ${fmtH(shiftHours(code, days[i]))} h)">–</span></td>`;
                  const k = h < full ? "low" : h > full ? "high" : "ok";
                  return `<td class="${cls(days[i])}"><span class="staffn ${k}" title="${fmtH(h)} h réalisées en ${LABEL[code]} le ${fmtShort(days[i])}">${fmtH(h)}</span></td>`;
                })
                .join("") +
              `<td class="tot"><b>${fmtH(vals.reduce((x, y) => x + (y || 0), 0))} h</b></td></tr>`
            );
          };

          return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="gridwrap"><table class="plan">
      <thead><tr><th class="name" rowspan="2">Agent</th>${wkrow}<th class="tot" rowspan="2">H mois</th></tr><tr>${head}</tr></thead>
      <tbody>${body}${staff("J")}${staff("N")}${hoursRow("J")}${hoursRow("N")}</tbody>
    </table></div>
    <div class="legend">
      <span><i class="c c-J">J</i>Jour 8h–20h</span><span><i class="c c-N">N</i>Nuit 20h–8h</span><span><i class="c c-R" style="width:30px">·</i>Repos</span>
      <span><i class="c c-CP">CP</i>Congé</span><span><i class="c c-RCR">RCR</i>RCR/RCE</span><span><i class="c c-MAL">MAL</i>Maladie</span><span><i class="c c-FOR">FOR</i>Formation</span><span><i class="c c-ANA">ANA</i>Abs. non autorisée</span><span><i class="nd-mark">ND</i>contacté, non disponible</span><span><i class="cmt-mark"></i>commentaire</span>
      <span><i class="c cell need" style="width:14px;height:14px"></i>à remplacer</span><span><i class="c cell cov" style="width:14px;height:14px"></i>remplacé</span>
      <span><i class="c c-J cell rp">J</i>en remplacement</span><span><i class="c c-J cell ovr">J</i>modifié hors cycle</span><span><i class="c c-J cell part">J</i>absence partielle</span>
    </div>
    <p class="note">Cliquez une case agent pour poser un congé, changer un poste ou choisir un remplaçant. Cliquez la ligne d'une équipe pour la passer en jour, nuit ou repos sur une date.</p>
  </div>`;
        }

        function emptyAgents() {
          return `<div class="panel empty">
    <h2>Aucun agent enregistré</h2>
    <p class="muted">Le planning se remplit dès que les agents sont rattachés à leur équipe. Vous pouvez créer 44 fiches vierges (11 par équipe) puis compléter matricule, nom et prénom, ou coller votre liste dans l'onglet Agents.</p>
    ${S.canWrite ? `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="gen">Créer 4 × 11 fiches à compléter</button><button class="btn" data-act="tab" data-tab="agents">Saisir ou importer les agents</button></div>` : ""}
  </div>`;
        }

        function viewHours() {
          const days = monthDays(S.ym);
          const agents = sortedAgents();
          if (!agents.length) return emptyAgents();
          const weeks = [...new Set(days.map(mondayOf))];
          const max = S.cycle.maxWeek;
          let rows = "",
            tsv = [
              "Fonction\tMatricule\tNom\tPrénom\tÉquipe\t" +
                weeks.map((w) => `S${isoWeek(w)}`).join("\t") +
                "\tMois\tJours d'absence\tHeures d'absence partielle",
            ];
          for (const t of GROUPS) {
            const list = agents.filter((a) => a.eq === t);
            if (!list.length) continue;
            rows += `<tr class="grp"><td colspan="${weeks.length + 6}">${groupName(t)}</td></tr>`;
            for (const a of list) {
              const wh = weeks.map((w) =>
                w <= lastDone() ? doneHours(a, w, addDays(w, 6)) : null,
              );
              const wp = weeks.map((w) => hoursBetween(a, w, addDays(w, 6)));
              const mh = doneHours(a, days[0], days[days.length - 1]);
              const absd = days.filter((d) => ABS[codeOf(a, d)]).length;
              const parth = days.reduce(
                (s, d) => s + partialHours(codeOf(a, d), entryOf(a.id, d)?.pa),
                0,
              );
              rows += `<tr><td>${esc(a.fn || "")}</td><td class="mono">${esc(a.mat || "—")}</td><td>${esc(fullName(a))}</td>${wh.map((h, i) => (h === null ? `<td class="num muted" title="Semaine à venir (prévu : ${fmtH(wp[i])} h)">–</td>` : `<td class="num${h > max ? " over" : ""}" title="Prévu sur la semaine : ${fmtH(wp[i])} h">${fmtH(h)}</td>`)).join("")}<td class="num"><b>${fmtH(mh)}</b></td><td class="num">${absd || ""}</td><td class="num">${parth ? fmtH(parth) : ""}</td></tr>`;
              tsv.push(
                [
                  a.fn || "",
                  a.mat || "",
                  a.nom || "",
                  a.prenom || "",
                  a.eq,
                  ...wh.map((h) => (h === null ? "" : fmtH(h))),
                  fmtH(mh),
                  absd,
                  fmtH(parth),
                ].join("\t"),
              );
            }
          }
          S.hoursTsv = tsv.join("\n");
          return `<div class="panel">
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
      <h2>Heures réalisées par semaine</h2>
      <button class="btn" data-act="copytsv">Copier pour Excel</button>
    </div>
    <p class="note">Semaines calendaires du lundi 0 h au dimanche 24 h. Jour = 12 h. Nuit = 12 h ${S.cycle.nightSplit ? "réparties à minuit (4 h le soir de prise de poste, 8 h le lendemain)" : "comptées sur le jour de prise de poste"}. Les absences, y compris les absences partielles, ne comptent pas comme heures travaillées. En rouge : plus de ${max} h dans la semaine. Seules les heures réalisées sont comptées, jusqu'à la veille (${fmtShort(lastDone())}) incluse : la semaine en cours est partielle et les semaines à venir affichent « – ». Survolez une valeur pour voir les heures prévues. Les semaines à cheval sur deux mois sont comptées en entier.</p>
    <div class="tablewrap"><table class="list">
      <thead><tr><th>Fonction</th><th>Matr.</th><th>Agent</th>${weeks.map((w) => `<th class="num" title="du ${fmtShort(w)} au ${fmtShort(addDays(w, 6))}">S${isoWeek(w)}<br><span style="text-transform:none;letter-spacing:0;font-weight:400">${fmtShort(w)}</span></th>`).join("")}<th class="num">Mois</th><th class="num">Abs. (j)</th><th class="num">Abs. part. (h)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
        }

        function viewAgents() {
          const agents = sortedAgents();
          const ro = S.canWrite ? "" : "disabled";
          const rows = GROUPS.map((t) => {
            const list = agents.filter((a) => a.eq === t);
            return (
              `<tr class="grp"><td colspan="7">${groupName(t)} <span class="muted" style="font-family:var(--f-body);font-size:13px;font-weight:500">${t === POOL ? `${list.length} · renfort de production, sans cycle : ils remplacent les absents des équipes` : `${list.length} / 11`}</span></td></tr>` +
              list
                .map(
                  (a, i) => `<tr data-row="${a.id}" data-team="${t}">
        <td><div class="ordcell">${
          S.canWrite
            ? `<span class="grip" data-grip="${a.id}" title="Glisser pour déplacer" aria-hidden="true">⠿</span><button class="btn sm ghost mv" data-act="up" data-id="${a.id}" aria-label="Monter ${esc(fullName(a))}" ${i === 0 ? "disabled" : ""}>↑</button><button class="btn sm ghost mv" data-act="down" data-id="${a.id}" aria-label="Descendre ${esc(fullName(a))}" ${i === list.length - 1 ? "disabled" : ""}>↓</button>`
            : `<span class="muted mono">${i + 1}</span>`
        }</div></td>
        <td><input type="text" id="fn-${a.id}" data-f="fn" data-id="${a.id}" value="${esc(a.fn)}" placeholder="Fonction" list="fn-list" ${ro}></td>
        <td><input type="text" id="mat-${a.id}" data-f="mat" data-id="${a.id}" value="${esc(a.mat)}" placeholder="Matricule" ${ro}></td>
        <td><input type="text" id="nom-${a.id}" data-f="nom" data-id="${a.id}" value="${esc(a.nom)}" placeholder="Nom" ${ro}></td>
        <td><input type="text" id="pre-${a.id}" data-f="prenom" data-id="${a.id}" value="${esc(a.prenom)}" placeholder="Prénom" ${ro}></td>
        <td><select id="eq-${a.id}" data-f="eq" data-id="${a.id}" ${ro}>${GROUPS.map((x) => `<option value="${x}" ${x === a.eq ? "selected" : ""}>${x === POOL ? "Remplaçant" : x}</option>`).join("")}</select></td>
        <td>${S.canWrite ? (S.delAsk === a.id ? `<span class="confirm">Supprimer ?<button class="btn sm danger" data-act="delyes" data-id="${a.id}">Oui</button><button class="btn sm" data-act="delno">Non</button></span>` : `<button class="btn sm ghost danger" data-act="del" data-id="${a.id}">Supprimer</button>`) : ""}</td>
      </tr>`,
                )
                .join("")
            );
          }).join("");
          return `<div class="cols">
    <div class="panel">
      <h2>Agents</h2>
      <p class="note">Les modifications sont enregistrées dès que vous quittez le champ. Changer l'équipe d'un agent l'aligne sur le cycle de sa nouvelle équipe. L'ordre des agents (flèches ou poignée ⠿ à faire glisser) est celui du planning et du tableau des heures.</p>
      <div class="tablewrap"><table class="list"><thead><tr><th>Ordre</th><th>Fonction</th><th>Matricule</th><th>Nom</th><th>Prénom</th><th>Équipe</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <datalist id="fn-list">${[
        ...new Set(S.agents.map((a) => (a.fn || "").trim()).filter(Boolean)),
      ]
        .sort((x, y) => x.localeCompare(y, "fr"))
        .map((f) => `<option value="${esc(f)}">`)
        .join("")}</datalist>
    </div>
    ${
      S.canWrite
        ? `<div style="display:flex;flex-direction:column;gap:16px">
      <form class="panel" id="addform">
        <h3>Ajouter un agent</h3>
        <div class="addrow">
          <label>Fonction<input type="text" id="add-fn" list="fn-list"></label>
          <label>Matricule<input type="text" id="add-mat" required></label>
          <label>Nom<input type="text" id="add-nom" required></label>
          <label>Prénom<input type="text" id="add-pre"></label>
          <label>Équipe<select id="add-eq">${GROUPS.map((x) => `<option value="${x}">${x === POOL ? "Remplaçant" : x}</option>`).join("")}</select></label>
          <button class="btn primary" type="submit">Ajouter</button>
        </div>
      </form>
      <div class="panel">
        <h3>Importer une liste</h3>
        <p class="note">Collez une ligne par agent : matricule ; nom ; prénom ; équipe (A, B, C, D ou REMP pour un remplaçant) ; fonction (facultative). Le point-virgule, la virgule et la tabulation (copie depuis Excel) sont acceptés. Un matricule déjà présent est mis à jour.</p>
        <textarea id="importtxt" placeholder="10234;MARTIN;Julie;A;Pontier&#10;10235;BERNARD;Karim;A"></textarea>

        function viewCycle() {

                    }<button class="btn sm primary" data-act="repl" data-r="${c.a.id}" data-days="${days.join(",")}">Choisir</button></div></div>`,
                )
                .join("")
            : `<p class="muted">Aucun agent en repos disponible ${days.length > 1 ? "sur toute la période. Essayez « Ce jour »." : "ce jour-là."}</p>`
        }</div></div>`;
            }
          }
          const rp = e?.rp
            ? `<div class="banner">En remplacement de <b>${esc(fullName(agentById(e.rp)))}</b> (équipe ${esc(agentById(e.rp)?.eq || "?")}).</div>`
            : "";
          const dr = S.drawer;
          dr.from ||= ds;
          dr.to ||= ds;
          if (dr.onlyWork === undefined) dr.onlyWork = a.eq !== POOL;
          o.innerHTML = `<div class="scrim" data-act="close"></div>
  <aside class="drawer" role="dialog" aria-label="Journée de ${esc(fullName(a))}">
    <header><div><div class="label">${esc(groupShort(a.eq))}${a.fn ? ` · ${esc(a.fn)}` : ""} · ${esc(a.mat || "sans matricule")}</div><h2>${esc(fullName(a))}</h2><div class="muted" style="text-transform:capitalize">${fmtLong(ds)}</div></div>
      <button class="btn iconbtn ghost" data-act="close" aria-label="Fermer">✕</button></header>
    <div class="body">
      <dl class="kv">${a.eq === POOL ? `<dt>Prévu</dt><dd>Remplaçant : pas de cycle, disponible pour renforcer les équipes</dd>` : `<dt>Prévu pour l'équipe</dt><dd><span class="c c-${base}" style="width:30px;height:20px">${base === "R" ? "·" : base}</span> ${LABEL[base]}</dd>`}
        <dt>Affectation</dt><dd><span class="c c-${code}" style="min-width:30px;height:20px;padding:0 4px">${code === "R" ? "·" : code}</span> ${a.eq === POOL && code === "R" ? "Disponible (sans poste)" : LABEL[code]}</dd>
        <dt>Semaine S${isoWeek(ds)}</dt><dd class="mono">${fmtH(wk)} h réalisées · ${fmtH(hoursBetween(a, mon, addDays(mon, 6)))} h prévues <span class="muted">(${fmtShort(mon)} → ${fmtShort(addDays(mon, 6))})</span></dd></dl>
      ${rp}
      ${
        can
          ? `<div class="sec"><div class="label">Disponibilité</div><div class="choices"><button class="choice" data-act="nd" aria-pressed="${ndOf(id, ds)}"><span class="nd-mark">ND</span>${ndOf(id, ds) ? "Contacté : NON disponible (cliquer pour retirer)" : "Contacté : NON disponible ce jour"}</button></div></div>`

        <div class="choices"><button class="btn sm primary" data-act="note">Enregistrer le commentaire</button>${noteOf(id, ds) ? `<button class="btn sm" data-act="unnote">Supprimer</button>` : ""}</div></div>`
          : noteOf(id, ds)
            ? `<div class="sec"><div class="label">Commentaire du jour</div><div class="cmt-txt">${esc(noteOf(id, ds))}</div></div>`
            : ""

      ${repl}
      ${
        can
          ? `<div class="sec"><div class="label">Poste de la journée</div><div class="choices">

        ${e ? `<button class="choice" data-act="shift" data-v="">Revenir au cycle</button>` : ""}</div></div>
      ${
        isWork(code)
          ? `<div class="sec"><div class="label">Absence partielle sur le poste${e?.pa ? ` · ${fmtH(12 - partialHours(code, e.pa))} h travaillées` : ""}</div>
        <div class="range"><label>De<input type="time" id="pa-from" step="900" value="${esc(e?.pa?.from || (code === "J" ? "08:00" : "20:00"))}"></label><label>À<input type="time" id="pa-to" step="900" value="${esc(e?.pa?.to || "")}"></label>
          <label>Motif<select id="pa-m">${Object.keys(ABS)
            .map(
              (m) =>
                `<option value="${m}" ${(e?.pa?.m || "FOR") === m ? "selected" : ""}>${ABS[m]}</option>`,
            )
            .join("")}</select></label></div>
        <div class="choices"><button class="btn sm primary" data-act="partial">${e?.pa ? "Modifier" : "Enregistrer"}</button>${e?.pa ? `<button class="btn sm" data-act="unpartial">Retirer l'absence partielle</button>` : ""}</div>
        <p class="note">Horaires compris dans le poste (${code === "J" ? "8h–20h" : "20h–8h"}). Les heures d'absence sont retirées des heures travaillées.</p>

        <div class="range"><label>Du<input type="date" id="ab-from" value="${dr.from}"></label><label>Au<input type="date" id="ab-to" value="${dr.to}"></label></div>
        <label class="check"><input type="checkbox" id="ab-only" ${dr.onlyWork ? "checked" : ""}> Seulement les jours travaillés selon le cycle</label>
        <div class="choices">${Object.keys(ABS)
          .map(
            (c) =>
              `<button class="choice" data-act="abs" data-v="${c}" aria-pressed="${code === c}"><span class="c c-${c}">${c}</span>${ABS[c]}</button>`,
