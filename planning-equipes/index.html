<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
  </head>
  <body style="margin: 0">
    <title>Planning des équipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <style>
      /* Layout : barre de commande en haut, onglets, grille mensuelle défilante à colonne agent figée, tiroir latéral pour éditer une journée. */
      :root {
        --bg: #f3f5f3;
        --surface: #ffffff;
        --surface-2: #eceff0;
        --line: #d9dedc;
        --line-strong: #b9c1be;
        --fg: #182024;
        --muted: #5d6a6f;
        --accent: #0e6a5b;
        --accent-fg: #ffffff;
        --accent-soft: #d6ece6;
        --day-fg: #7a4800;
        --day-bg: #ffe2a8;
        --night-fg: #eef0ff;
        --night-bg: #2f347a;
        --cp-fg: #1c6a33;
        --cp-bg: #d3eedb;
        --rtt-fg: #1d5b71;
        --rtt-bg: #d4eaf3;
        --mal-fg: #982a1f;
        --mal-bg: #f8d8d4;
        --abs-fg: #5a3b7a;
        --abs-bg: #e9def4;
        --weekend: #e7ebe9;
        --bad: #c2321f;
        --warn: #a66300;
        --good: #1c7a3c;
        --shadow: 0 10px 40px rgba(20, 30, 30, 0.18);
        --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
        --f-body: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
        --f-mono:
          "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #111618;
          --surface: #192023;
          --surface-2: #20282c;
          --line: #2c373b;
          --line-strong: #43514f;
          --fg: #e4eae7;
          --muted: #92a09b;
          --accent: #4cc0a6;
          --accent-fg: #0b1513;
          --accent-soft: #173a33;
          --day-fg: #ffd28a;
          --day-bg: #4a3410;
          --night-fg: #d3d6ff;
          --night-bg: #2c3172;
          --cp-fg: #93dcaa;
          --cp-bg: #173b23;
          --rtt-fg: #94d1e8;
          --rtt-bg: #15374a;
          --mal-fg: #f5a69c;
          --mal-bg: #4a1c18;
          --abs-fg: #cfb5ec;
          --abs-bg: #33264a;
          --weekend: #1d2427;
          --bad: #ff7a66;
          --warn: #f0b04a;
          --good: #6fd391;
          --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #111618;
        --surface: #192023;
        --surface-2: #20282c;
        --line: #2c373b;
        --line-strong: #43514f;
        --fg: #e4eae7;
        --muted: #92a09b;
        --accent: #4cc0a6;
        --accent-fg: #0b1513;
        --accent-soft: #173a33;
        --day-fg: #ffd28a;
        --day-bg: #4a3410;
        --night-fg: #d3d6ff;
        --night-bg: #2c3172;
        --cp-fg: #93dcaa;
        --cp-bg: #173b23;
        --rtt-fg: #94d1e8;
        --rtt-bg: #15374a;
        --mal-fg: #f5a69c;
        --mal-bg: #4a1c18;
        --abs-fg: #cfb5ec;
        --abs-bg: #33264a;
        --weekend: #1d2427;
        --bad: #ff7a66;
        --warn: #f0b04a;
        --good: #6fd391;
        --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--f-body);
        font-size: 15px;
        line-height: 1.4;
      }
      .app {
        max-width: 1600px;
        margin: 0 auto;
        padding-inline: 16px;
        padding-block: 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      h1,
      h2,
      h3 {
        font-family: var(--f-display);
        font-weight: 700;
        letter-spacing: 0.01em;
        margin: 0;
        text-wrap: balance;
      }
      h1 {
        font-size: 30px;
        line-height: 1;
      }
      h2 {
        font-size: 22px;
      }
      h3 {
        font-size: 17px;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: var(--f-mono);
        font-variant-numeric: tabular-nums;
      }
      .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 600;
      }

      /* En-tête */
      .top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-right: auto;
      }
      .brand .rot {
        font-family: var(--f-mono);
        font-size: 12px;
        color: var(--muted);
      }
      .monthnav {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .monthnav .m {
        font-family: var(--f-display);
        font-size: 22px;
        font-weight: 700;
        min-width: 170px;
        text-align: center;
        text-transform: capitalize;
      }
      .btn {
        border: 1px solid var(--line-strong);
        background: var(--surface);
        border-radius: 6px;
        padding: 6px 12px;
        font-weight: 600;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.sm {
        padding: 3px 8px;
        font-size: 13px;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .iconbtn {
        width: 34px;
        height: 34px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        font-size: 18px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }
      .tab {
        border: 0;
        background: none;
        padding: 8px 14px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 3px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
      }
      .tab[aria-selected="true"] {
        color: var(--fg);
        border-bottom-color: var(--accent);
      }
      .banner {
        padding: 8px 12px;
        border-radius: 6px;
        background: var(--surface-2);
        font-size: 14px;
      }

      /* Codes de poste */
      .c {
        display: inline-grid;
        place-items: center;
        font-family: var(--f-mono);
        font-weight: 600;
        font-size: 12px;
        border-radius: 4px;
      }
      .c-J {
        background: var(--day-bg);
        color: var(--day-fg);
      }
      .c-N {
        background: var(--night-bg);
        color: var(--night-fg);
      }
      .c-R {
        color: var(--muted);
      }
      .c-CP {
        background: var(--cp-bg);
        color: var(--cp-fg);
      }
      .c-RCR {
        background: var(--rtt-bg);
        color: var(--rtt-fg);
      }
      .c-MAL {
        background: var(--mal-bg);
        color: var(--mal-fg);
      }
      .c-FOR {
        background: var(--abs-bg);
        color: var(--abs-fg);
      }
      .c-ANA {
        background: var(--bad);
        color: var(--surface);
      }
      .plan .cell.cmt {
        background-image: linear-gradient(
          135deg,
          var(--warn) 0 7px,
          var(--surface) 7px 9px,
          transparent 9px
        );
      }
      .plan .cell.nd {
        box-shadow: inset 0 0 0 2px var(--bad);
      }
      .plan .cell.c-R.nd {
        color: var(--bad);
        font-size: 10px;
        font-weight: 700;
      }
      .cell.c-R.nd::after {
        content: none;
      }
      .nd-mark {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 20px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 2px var(--bad);
        color: var(--bad);
        font-family: var(--f-mono);
        font-size: 10px;
        font-weight: 700;
      }
      .cmt-mark {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 1px solid var(--line-strong);
        border-radius: 3px;
        background: linear-gradient(135deg, var(--warn) 0 6px, transparent 6px);
      }
      .cmt-txt {
        white-space: pre-wrap;
        background: var(--surface-2);
        border-left: 3px solid var(--warn);
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 14px;
      }

      /* Bandeau résumé */
      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-start;
      }
      .todo {
        flex: 1 1 420px;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .todo-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .todo-item {
        border: 1px solid var(--bad);
        color: var(--fg);
        background: var(--surface);
        border-radius: 999px;
        padding: 3px 10px 3px 4px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
      }
      .todo-item .c {
        width: 30px;
        height: 20px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
        padding-top: 4px;
      }
      .legend .c {
        width: 30px;
        height: 20px;
      }
      .legend span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }

      /* Grille */
      .gridwrap {
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        max-height: calc(100vh - 210px);
        min-height: 320px;
      }
      table.plan {
        border-collapse: separate;
        border-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      .plan th,
      .plan td {
        padding: 0;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .plan thead th {
        position: sticky;
        top: 0;
        height: 20px;
        z-index: 3;
        background: var(--surface);
        border-bottom: 1px solid var(--line-strong);
      }
      .plan .name {
        position: sticky;
        left: 0;
        z-index: 2;
        text-align: left;
        min-width: 260px;
        max-width: 260px;
        padding: 4px 10px;
        border-right: 1px solid var(--line-strong);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .plan thead tr + tr th {
        top: 20px;
      }
      .plan thead .name {
        z-index: 4;
      }
      .plan .name .mat {
        font-family: var(--f-mono);
        font-size: 11px;
        color: var(--muted);
        margin-right: 6px;
      }
      .fn {
        display: inline-block;
        max-width: 88px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 3px;
        padding: 0 4px;
        margin-right: 6px;
      }
      .plan .dh {
        width: 34px;
        min-width: 34px;
        text-align: center;
        font-weight: 500;
        padding: 4px 0;
      }
      .plan .dh small {
        display: block;
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .plan .dh b {
        font-family: var(--f-mono);
        font-size: 13px;
      }
      .plan .dh.today b {
        background: var(--accent);
        color: var(--accent-fg);
        border-radius: 4px;
        padding: 0 4px;
      }
      .plan .wkstart {
        border-left: 2px solid var(--line-strong);
      }
      .plan .we {
        background: var(--weekend);
      }
      .plan td.d {
        text-align: center;
        height: 30px;
      }
      .plan .tot {
        min-width: 64px;
        text-align: right;
        padding: 0 10px;
        font-family: var(--f-mono);
        font-size: 13px;
        border-left: 1px solid var(--line-strong);
      }
      .plan .wkno {
        font-family: var(--f-mono);
        font-size: 10px;
        color: var(--muted);
        text-align: left;
        padding: 2px 4px;
      }
      .plan tr.team th,
      .plan tr.team td {
        background: var(--surface-2);
        border-top: 1px solid var(--line-strong);
      }
      .plan tr.team .name {
        font-family: var(--f-display);
        font-size: 17px;
        font-weight: 700;
      }
      .plan tr.team .name small {
        font-family: var(--f-body);
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        margin-left: 6px;
      }
      .cell {
        width: 30px;
        height: 24px;
        border: 0;
        padding: 0;
        position: relative;
      }
      .plan tr.team.pool th,
      .plan tr.team.pool td {
        background: var(--accent-soft);
      }
      .cell.pool.c-R::after {
        content: none;
      }
      button.c-R {
        background: transparent;
      }
      .cell.c-R::after {
        content: "·";
        font-size: 16px;
        line-height: 1;
      }
      .plan button.cell:hover {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .cell.ovr {
        box-shadow: inset 0 -3px 0 var(--accent);
      }
      .cell.rp {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .cell.need::before {
        content: "";
        position: absolute;
        top: -3px;
        right: -3px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--bad);
        border: 2px solid var(--surface);
      }
      .cell.part::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 4px;
        bottom: 4px;
        width: 3px;
        border-radius: 2px;
        background: var(--bad);
      }
      .cell.cov::before {
        content: "";
        position: absolute;
        top: -3px;
        right: -3px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--good);
        border: 2px solid var(--surface);
      }
      .plan tr.staff th,
      .plan tr.staff td {
        background: var(--surface-2);
      }
      .plan tr.staff:first-of-type th {
        border-top: 2px solid var(--line-strong);
      }
      .staffn {
        font-family: var(--f-mono);
        font-size: 12px;
        font-weight: 600;
      }
      .hrs .staffn {
        font-size: 10.5px;
        letter-spacing: -0.02em;
      }
      .staffn.low {
        color: var(--bad);
      }
      .staffn.high {
        color: var(--warn);
      }
      .staffn.ok {
        color: var(--good);
      }
      .empty {
        padding: 32px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      .empty p {
        max-width: 52ch;
        margin: 0;
      }

      /* Popover équipe */
      .pop {
        position: fixed;
        z-index: 30;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 220px;
      }
      .pop .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* Tiroir */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(10, 16, 16, 0.35);
        z-index: 20;
      }
      .drawer {
        position: fixed;
        z-index: 21;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(440px, 100%);
        background: var(--surface);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .drawer header {
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .drawer header > div {
        flex: 1;
        min-width: 0;
      }
      .drawer .body {
        overflow-y: auto;
        padding: 14px 18px 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .sec {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .choice {
        border: 1px solid var(--line-strong);
        background: var(--surface);
        border-radius: 6px;
        padding: 6px 10px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-weight: 600;
        font-size: 14px;
      }
      .choice .c {
        min-width: 30px;
        height: 22px;
        padding: 0 4px;
      }
      .choice[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .choice:hover {
        border-color: var(--accent);
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        font-size: 14px;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
      }
      .range {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
      }
      .range label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 13px;
        color: var(--muted);
      }
      input[type="date"],
      input[type="text"],
      input[type="number"],
      select,
      textarea {
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 5px 8px;
      }
      textarea {
        width: 100%;
        min-height: 110px;
        font-family: var(--f-mono);
        font-size: 13px;
      }
      .check {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 14px;
      }
      .cands {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .cand {
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
      }
      .cand > div {
        flex: 1;
        min-width: 0;
      }
      .cand .who {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cand .meta {
        font-size: 13px;
        color: var(--muted);
      }
      .flag {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        padding: 0 6px;
        border-radius: 4px;
        margin-right: 4px;
      }
      .flag.bad {
        color: var(--bad);
        border: 1px solid var(--bad);
      }
      .flag.warn {
        color: var(--warn);
        border: 1px solid var(--warn);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: var(--surface);
        padding: 4px 10px;
        font-size: 13px;
        font-weight: 600;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .note {
        font-size: 13px;
        color: var(--muted);
      }
      .linkbtn {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 0;
        font-weight: 600;
        text-decoration: underline;
      }

      /* Panneaux */
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
