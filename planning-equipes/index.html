      </div>`
          : ""
      }
    </div>
  </aside>`;
        }

        /* ---------- Événements ---------- */
        document.addEventListener("click", async (ev) => {
          const b = ev.target.closest("[data-act]");
          if (
            b &&
            /^f(open|new|reopen|close|reload|take|force|forceno|local|backup)$/.test(
              b.dataset.act,
            )
          ) {
            await fileAction(b.dataset.act);
            return;
          }
          if (!b) return;
          const act = b.dataset.act;
          if (act === "close") {
            S.drawer = null;
            S.pop = null;
            renderOverlay();
            return;
          }
          if (act === "tab") {
            S.tab = b.dataset.tab;
            uiSet({ tab: S.tab });
            render();
            return;
          }
          if (act === "cell") {
            S.pop = null;
            S.drawer = { id: b.dataset.id, ds: b.dataset.date };
            renderOverlay();
            return;
          }
          if (act === "team") {
            const r = b.getBoundingClientRect();
            S.drawer = null;
            S.pop = {
              team: b.dataset.team,
              ds: b.dataset.date,
              x: r.left,
              y: r.bottom + 4,
            };
            renderOverlay();
            return;
          }
          if (act === "teamset") {
            setTeam(S.pop.team, S.pop.ds, b.dataset.v || null);
            S.pop = null;
            renderOverlay();
            return;
          }
          if (act === "shift") {
            await setShift(S.drawer.id, S.drawer.ds, b.dataset.v || null);
            return;
          }
          if (act === "up" || act === "down") {
            const list = sortedAgents().filter(
              (x) => x.eq === agentById(b.dataset.id)?.eq,
            );
            const i = list.findIndex((x) => x.id === b.dataset.id);
            await moveAgent(b.dataset.id, i + (act === "up" ? -1 : 1));
            const nb = document.querySelector(
              `[data-act="${act}"][data-id="${b.dataset.id}"]`,
            );
            if (nb && !nb.disabled) nb.focus();
            return;
          }
          if (act === "partial") {
            const a = agentById(S.drawer.id),
              ds = S.drawer.ds,
              c = codeOf(a, ds);
            const pa = {
              from: $("#pa-from").value,
              to: $("#pa-to").value,
              m: $("#pa-m").value,
            };
            const sp = partialSpan(c, pa);
            const lo = c === "J" ? 8 : 20;
            if (!pa.from || !pa.to || !sp) {
              toast("Indiquez l'heure de début et l'heure de fin.");
              return;
            }
            if (sp[0] < lo || sp[1] > lo + 12 || sp[1] <= sp[0]) {
              toast(
                `Les horaires doivent être compris dans le poste (${c === "J" ? "8h–20h" : "20h–8h"}).`,
              );
              return;
            }
            if (sp[1] - sp[0] >= 12) {
              toast(
                "Absence sur tout le poste : utilisez une absence sur la journée entière.",
              );
              return;
            }
            setPartial(a.id, ds, pa);
            toast(`Absence partielle ${pa.from}–${pa.to} enregistrée`);
            return;
          }
          if (act === "nd") {
            const v = !ndOf(S.drawer.id, S.drawer.ds);
            await setNd(S.drawer.id, [S.drawer.ds], v);
            toast(
              v
                ? "Noté : non disponible"
                : "Mention « non disponible » retirée",
            );
            return;
          }
          if (act === "ndc") {
            const days = b.dataset.days.split(",");
            await setNd(b.dataset.r, days, !!b.dataset.v);
            toast(
              `${fullName(agentById(b.dataset.r))} : ${b.dataset.v ? "non disponible" : "mention retirée"}`,
            );
            return;
          }
          if (act === "note") {
            const v = $("#note-txt").value.trim();
            setNote(S.drawer.id, S.drawer.ds, v || null);
            toast(v ? "Commentaire enregistré" : "Commentaire supprimé");
            return;
          }
          if (act === "unnote") {
            setNote(S.drawer.id, S.drawer.ds, null);
            toast("Commentaire supprimé");
            return;
          }
          if (act === "unpartial") {
            setPartial(S.drawer.id, S.drawer.ds, null);
            return;
          }
          if (act === "abs") {
            const from = $("#ab-from").value,
              to = $("#ab-to").value;
            if (!from || !to || to < from) {
              toast("La date de fin doit suivre la date de début.");
              return;
            }
            if (dnum(to) - dnum(from) > 120) {
              toast("Période limitée à 4 mois.");
              return;
            }
            await setAbsence(
              S.drawer.id,
              from,
              to,
              b.dataset.v,
              $("#ab-only").checked,
            );
            S.drawer.from = from;
            S.drawer.to = to;
            renderOverlay();
            return;
          }
          if (act === "scope") {
            S.drawer.scope = b.dataset.v;
            renderOverlay();
            return;
          }
          if (act === "repl") {
            await assignRepl(
              S.drawer.id,
              b.dataset.days.split(","),
              b.dataset.r,
            );
            return;
          }
          if (act === "unrepl") {
            removeRepl(S.drawer.id, S.drawer.ds);
            return;
          }
          if (act === "gen") {
            await genAgents();
            return;
          }
          if (act === "import") {
            await importAgents($("#importtxt").value);
            return;
          }
          if (act === "del") {
            S.delAsk = b.dataset.id;
            render();
            return;
          }
          if (act === "delno") {
            S.delAsk = null;
            render();
            return;
          }
          if (act === "delyes") {
            await S.store.del("agents/" + b.dataset.id);
            S.delAsk = null;
            toast("Agent supprimé");
            return;
          }
          if (act === "copytsv") {
            try {
              await navigator.clipboard.writeText(S.hoursTsv);
              toast("Tableau copié : collez-le dans Excel");
            } catch {
              const ta = document.createElement("textarea");
              ta.value = S.hoursTsv;
              ta.style.height = "200px";
              b.after(ta);
              ta.select();
              toast("Sélectionnez le texte puis copiez-le");
            }
            return;
          }
          const d = S.cycleDraft;
          if (act === "pat") {
            const i = +b.dataset.i;
            d.pattern[i] = { J: "N", N: "R", R: "J" }[d.pattern[i]];
            render();
            return;
          }
          if (act === "patadd") {
            d.pattern.push("R");
            render();
            return;
          }
          if (act === "patdel") {
            d.pattern.pop();
            render();
            return;
          }
          if (act === "preset") {
            d.pattern = b.dataset.p.split("");
            const q = d.pattern.length / 4;
            TEAMS.forEach((t, i) => (d.offsets[t] = q * i));
            if (d.pattern.length % 7 === 0) d.ref = mondayOf(d.ref);
            render();
            return;
          }
          if (act === "cyreset") {
            S.cycleDraft = null;
            render();
            return;
          }
          if (act === "cysave") {
            S.cycle = clone(d);
            S.cycleDraft = null;
            await S.store.set("config/cycle", S.cycle);
            toast("Cycle enregistré");
            render();
            return;
          }
        });
        document.addEventListener("change", async (ev) => {
          const el = ev.target;
          if (el.dataset.f && el.dataset.id) {
            const a = agentById(el.dataset.id);
            if (!a) return;
            const v = el.value.trim();
            if ((a[el.dataset.f] || "") === v) return;
            const { id, ...rest } = a;
            const extra = el.dataset.f === "eq" ? { ord: nextOrd(v) } : {};
            await S.store.set("agents/" + id, {
              ...rest,
              [el.dataset.f]: v,
              ...extra,
            });
            return;
          }
          if (el.id === "ab-from" && S.drawer) {
            S.drawer.from = el.value;
            if (S.drawer.to < el.value) {
              S.drawer.to = el.value;
              $("#ab-to").value = el.value;
            }
          }
          if (el.id === "ab-to" && S.drawer) S.drawer.to = el.value;
          if (el.id === "ab-only" && S.drawer) S.drawer.onlyWork = el.checked;
          const d = S.cycleDraft;
          if (!d) return;
          if (el.id === "cy-ref" && el.value) d.ref = el.value;
          else if (el.id.startsWith("cy-off-"))
            d.offsets[el.dataset.team] = Math.max(
              0,
              parseInt(el.value, 10) || 0,
            );
          else if (el.id === "cy-target")
            d.target = Math.max(1, parseInt(el.value, 10) || 11);
          else if (el.id === "cy-max")
            d.maxWeek = Math.max(1, parseInt(el.value, 10) || 48);
          else if (el.id === "cy-split") d.nightSplit = el.checked;
          else return;
          render();
        });
        document.addEventListener("submit", async (ev) => {
          if (ev.target.id !== "addform") return;
          ev.preventDefault();
          const mat = $("#add-mat").value.trim(),
            nom = $("#add-nom").value.trim();
          if (!mat || !nom) {
            toast("Matricule et nom sont obligatoires.");
            return;
          }
          if (S.agents.some((a) => a.mat === mat)) {
            toast(`Le matricule ${mat} existe déjà.`);
            return;
          }
          const fn = $("#add-fn").value.trim();
          await S.store.set("agents/" + S.store.newId(), {
            ...(fn ? { fn } : {}),
            mat,
            nom,
            prenom: $("#add-pre").value.trim(),
            eq: $("#add-eq").value,
            ord: nextOrd($("#add-eq").value),
          });
          toast(
            $("#add-eq").value === POOL
              ? `${nom.toUpperCase()} ajouté aux remplaçants`
              : `${nom.toUpperCase()} ajouté à l'équipe ${$("#add-eq").value}`,
          );
          ev.target.reset();
          $("#add-fn").focus();
        });
        let dragId = null;
        document.addEventListener("pointerdown", (ev) => {
          const g = ev.target.closest("[data-grip]");
          if (!g) return;
          const tr = g.closest("tr");
          tr.draggable = true;
          dragId = g.dataset.grip;
        });
        document.addEventListener("pointerup", () => {
          dragId = null;
          document
            .querySelectorAll("tr[draggable]")
            .forEach((x) => (x.draggable = false));
        });
        document.addEventListener("dragstart", (ev) => {
          if (!dragId) return ev.preventDefault();
          ev.dataTransfer.effectAllowed = "move";
          ev.dataTransfer.setData("text/plain", dragId);
          ev.target.classList.add("dragging");
        });
        const dropRow = (ev) => {
          const tr = ev.target.closest("tr[data-row]");
          const a = dragId && agentById(dragId);
          return tr && a && tr.dataset.team === a.eq ? tr : null;
        };
        document.addEventListener("dragover", (ev) => {
          const tr = dropRow(ev);
          document
            .querySelectorAll(".dropbefore,.dropafter")
            .forEach((x) => x.classList.remove("dropbefore", "dropafter"));
          if (!tr) return;
          ev.preventDefault();
          const r = tr.getBoundingClientRect();
          tr.classList.add(
            ev.clientY < r.top + r.height / 2 ? "dropbefore" : "dropafter",
          );
        });
        document.addEventListener("drop", async (ev) => {
          const tr = dropRow(ev);
          if (!tr) return;
          ev.preventDefault();
          const after = tr.classList.contains("dropafter");
          const list = sortedAgents().filter((x) => x.eq === tr.dataset.team);
          const from = list.findIndex((x) => x.id === dragId);
          let to =
            list.findIndex((x) => x.id === tr.dataset.row) + (after ? 1 : 0);
          if (from < to) to--;
          const id = dragId;
          dragId = null;
          await moveAgent(id, to);
        });
        document.addEventListener("dragend", () => {
          dragId = null;
          document
            .querySelectorAll("tr[draggable]")
            .forEach((x) => (x.draggable = false));
          document
            .querySelectorAll(".dragging,.dropbefore,.dropafter")
            .forEach((x) =>
              x.classList.remove("dragging", "dropbefore", "dropafter"),
            );
        });
        document.addEventListener("keydown", (ev) => {
          if (ev.key === "Escape" && (S.drawer || S.pop)) {
            S.drawer = null;
            S.pop = null;
            renderOverlay();
          }
        });
        $("#prev").onclick = () => goMonth(ymAdd(S.ym, -1));
        $("#next").onclick = () => goMonth(ymAdd(S.ym, 1));
        $("#today").onclick = () => goMonth(ymOf(now));

        async function genAgents() {
          for (const t of TEAMS) {
            const have = S.agents.filter((a) => a.eq === t).length;
            const base = nextOrd(t);
            for (let i = have; i < 11; i++)
              await S.store.set("agents/" + S.store.newId(), {
                mat: "",
                nom: "À compléter",
                prenom: `${t}${String(i + 1).padStart(2, "0")}`,
                eq: t,
                ord: base + i - have,
              });
          }
          toast("Fiches créées : complétez-les dans l'onglet Agents");
          S.tab = "agents";
          uiSet({ tab: "agents" });
          render();
        }
        async function importAgents(txt) {
          const lines = txt
            .split(/\r?\n/)
            .map((l) => l.trim())
            .filter(Boolean);
          let add = 0,
            upd = 0;
          const errs = [];
          const ords = {};
          const nx = (eq) => {
            ords[eq] ??= nextOrd(eq);
            return ords[eq]++;
          };
          for (const [i, l] of lines.entries()) {
            const p = l.split(/\t|;|,/).map((x) => x.trim());
            const [mat, nom, prenom = "", eqRaw = "", fnRaw = ""] = p;
            const fnv = fnRaw ? { fn: fnRaw } : {};
            let eq = eqRaw.toUpperCase().replace(/^ÉQUIPE\s*|^EQUIPE\s*/, "");
            if (/^REMP/.test(eq)) eq = POOL;
            if (!mat || !nom || !GROUPS.includes(eq)) {
              if (!/matricule/i.test(l)) errs.push(i + 1);
              continue;
            }
            const ex = S.agents.find((a) => a.mat === mat);
            if (ex) {
              const { id, ...rest } = ex;
              const ord =
                eq === ex.eq && Number.isFinite(ex.ord) ? ex.ord : nx(eq);
              await S.store.set("agents/" + id, {
                ...rest,
                ...fnv,
                nom,
                prenom,
                eq,
                ord,
              });
              upd++;
            } else {
              await S.store.set("agents/" + S.store.newId(), {
                ...fnv,
                mat,
                nom,
                prenom,
                eq,
                ord: nx(eq),
              });
              add++;
            }
          }
          toast(
            `${add} ajouté(s), ${upd} mis à jour${errs.length ? ` · lignes ignorées : ${errs.slice(0, 6).join(", ")}` : ""}`,
          );
          if (!errs.length) {
            const ta = $("#importtxt");
            if (ta) ta.value = "";
          }
        }

        /* ---------- Abonnements ---------- */
        function goMonth(ym) {
          S.ym = ym;
          S.drawer = null;
          S.pop = null;
          watchMonths();
          render();
        }
        function watchMonths() {
          const need = [ymAdd(S.ym, -1), S.ym, ymAdd(S.ym, 1)];
          for (const ym of Object.keys(S.monthSubs))
            if (!need.includes(ym)) {
              S.monthSubs[ym]();
              delete S.monthSubs[ym];
            }
          for (const ym of need)
            if (!S.monthSubs[ym])
              S.monthSubs[ym] = S.store.watchDoc("mois/" + ym, (d) => {
                S.months[ym] = d ? normMonth(clone(d)) : null;
                render();
              });
        }

        async function boot() {
          let db = null,
            user = null;
          for (let i = 0; i < 15 && !(window.claude && window.claude.use); i++)
            await new Promise((r) => setTimeout(r, 100));
          if (window.claude && typeof window.claude.use === "function") {
            try {
              [db, user] = await Promise.all([
                window.claude.use("db"),
                window.claude.use("user"),
              ]);
            } catch {
              db = null;
            }
          }
          if (db) {
            S.store = dbStore(db);
            if (user) {
              try {
                const w = await user.can("data.write");
                if (w === false) S.canWrite = false;
              } catch {}
            }
            if (!S.canWrite) {
              const b = $("#banner");
              b.hidden = false;
              b.textContent =
                "Consultation seule : vous pouvez voir le planning mais pas le modifier.";
            }
          } else if (window.claude) {
            startStore(localStore());
            const b = $("#banner");
            b.hidden = false;
            b.textContent =
              "Les données sont enregistrées dans ce navigateur uniquement. Connectez-vous à claude.ai pour les partager.";
            return;
          } else {
            // Version autonome : la base est un fichier JSON partagé.
            S.connect = true;
            S.me = uiGet().me || "";
            S.lastHandle = FS_OK ? await idb("get") : null;
            render();
            return;
          }
          startStore(S.store);
        }
        function startStore(store) {
          S.store = store;
          S.store.watchCol("agents", (list) => {
            S.agents = list.filter((a) => GROUPS.includes(a.eq));
            S.ready.agents = true;
            migrateOrder();
            render();
          });
          S.store.watchDoc("config/cycle", (c) => {
            S.cycle = { ...clone(DEFAULT_CYCLE), ...(c ? clone(c) : {}) };
            S.ready.cycle = true;
            render();
          });
          watchMonths();
          render();
        }
        // Consultation seule d'un fichier choisi (navigateurs sans écriture directe).
        document.addEventListener("change", async (ev) => {
          if (ev.target.id !== "ro-file" || !ev.target.files[0]) return;
          try {
            const data = normalizeFile(
              JSON.parse(await ev.target.files[0].text()),
            );
            const fake = {
              name: ev.target.files[0].name,
              getFile: async () => ev.target.files[0],
            };
            S.canWrite = false;
            startStore(fileStore(fake, data, S.me || "", false));
            fileBanner();
          } catch (e) {
            S.connectErr = e.message || "Fichier illisible.";
            render();
          }
        });
        boot();
      })();
    </script>
  </body>
</html>
